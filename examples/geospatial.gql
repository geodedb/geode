// Geospatial Analytics Examples
// Demonstrates LatLon coordinates and spatial operations

// Create cities with coordinates
CREATE (sf:City {
    name: 'San Francisco',
    location: LatLon(37.7749, -122.4194),
    population: 873965,
    area_sqkm: 121.4,
    timezone: 'America/Los_Angeles'
});

CREATE (oak:City {
    name: 'Oakland',
    location: LatLon(37.8044, -122.2712),
    population: 433031,
    area_sqkm: 202.4
});

CREATE (sj:City {
    name: 'San Jose',
    location: LatLon(37.3382, -121.8863),
    population: 1030119,
    area_sqkm: 461.5
});

CREATE (la:City {
    name: 'Los Angeles',
    location: LatLon(34.0522, -118.2437),
    population: 3898747,
    area_sqkm: 1302.0
});

CREATE (sd:City {
    name: 'San Diego',
    location: LatLon(32.7157, -117.1611),
    population: 1386932,
    area_sqkm: 964.5
});

// Create points of interest
CREATE (ggb:Landmark {
    name: 'Golden Gate Bridge',
    location: LatLon(37.8199, -122.4783),
    type: 'Bridge',
    year_built: 1937
});

CREATE (alc:Landmark {
    name: 'Alcatraz Island',
    location: LatLon(37.8267, -122.4230),
    type: 'Historic Site'
});

CREATE (yos:Park {
    name: 'Yosemite National Park',
    entrance: LatLon(37.8651, -119.5383),
    area_sqkm: 3028.8,
    elevation_m: 1200
});

// Create transportation routes
MATCH (sf:City {name: 'San Francisco'}), (oak:City {name: 'Oakland'})
CREATE (sf)-[:ROUTE {
    type: 'Highway',
    name: 'I-80',
    distance_km: distance_haversine(sf.location, oak.location) / 1000.0,
    travel_time_min: 20
}]->(oak);

MATCH (sf:City {name: 'San Francisco'}), (sj:City {name: 'San Jose'})
CREATE (sf)-[:ROUTE {
    type: 'Highway',
    name: 'US-101',
    distance_km: distance_haversine(sf.location, sj.location) / 1000.0,
    travel_time_min: 60
}]->(sj);

MATCH (sf:City {name: 'San Francisco'}), (la:City {name: 'Los Angeles'})
CREATE (sf)-[:FLIGHT {
    airline: 'United',
    flight_number: 'UA507',
    distance_km: distance_haversine(sf.location, la.location) / 1000.0,
    duration_min: 90
}]->(la);

// Query 1: Find cities within a certain distance
MATCH (origin:City {name: 'San Francisco'}), (dest:City)
WHERE origin <> dest
  AND distance_haversine(origin.location, dest.location) < 100000  // 100km in meters
RETURN dest.name,
       distance_haversine(origin.location, dest.location) / 1000.0 AS distance_km
ORDER BY distance_km;

// Query 2: Calculate bearings between cities
MATCH (sf:City {name: 'San Francisco'}), (c:City)
WHERE sf <> c
RETURN c.name,
       distance_haversine(sf.location, c.location) / 1000.0 AS distance_km,
       geo_bearing(sf.location, c.location) AS bearing_degrees,
       CASE
           WHEN geo_bearing(sf.location, c.location) < 45 THEN 'North'
           WHEN geo_bearing(sf.location, c.location) < 135 THEN 'East'
           WHEN geo_bearing(sf.location, c.location) < 225 THEN 'South'
           WHEN geo_bearing(sf.location, c.location) < 315 THEN 'West'
           ELSE 'North'
       END AS general_direction
ORDER BY distance_km;

// Query 3: Find nearest landmarks to a city
MATCH (c:City {name: 'San Francisco'}), (l:Landmark)
WITH c, l, distance_haversine(c.location, l.location) AS distance_m
RETURN l.name,
       l.type,
       distance_m / 1000.0 AS distance_km
ORDER BY distance_m
LIMIT 5;

// Query 4: Create a bounding box query
MATCH (poi)
WHERE poi.location IS NOT NULL
  AND geo_lat(poi.location) >= 37.7 AND geo_lat(poi.location) <= 37.9
  AND geo_lon(poi.location) >= -122.5 AND geo_lon(poi.location) <= -122.3
RETURN poi.name,
       labels(poi) AS type,
       geo_lat(poi.location) AS latitude,
       geo_lon(poi.location) AS longitude;

// Query 5: Calculate total route distance
MATCH path = (sf:City {name: 'San Francisco'})-[:ROUTE*1..3]->(dest:City)
WITH path, dest,
     [r IN relationships(path) | r.distance_km] AS distances,
     [n IN nodes(path) | n.name] AS cities
RETURN dest.name AS destination,
       cities AS route,
       reduce(total = 0.0, d IN distances | total + d) AS total_distance_km
ORDER BY total_distance_km;

// Query 6: Find cities in a radius with population filter
WITH LatLon(37.7749, -122.4194) AS center_point, 150000 AS radius_m
MATCH (c:City)
WHERE distance_haversine(center_point, c.location) <= radius_m
  AND c.population > 400000
RETURN c.name,
       c.population,
       distance_haversine(center_point, c.location) / 1000.0 AS distance_km
ORDER BY c.population DESC;

// Query 7: Cluster analysis - find city groups
MATCH (c1:City), (c2:City)
WHERE c1.name < c2.name
  AND distance_haversine(c1.location, c2.location) < 200000  // 200km
CREATE (c1)-[:NEARBY {
    distance_km: distance_haversine(c1.location, c2.location) / 1000.0
}]->(c2);

// Query 8: Route optimization with waypoints
MATCH (start:City {name: 'San Francisco'}),
      (waypoint:City {name: 'San Jose'}),
      (end:City {name: 'Los Angeles'})
WITH start, waypoint, end,
     distance_haversine(start.location, waypoint.location) / 1000.0 AS leg1_km,
     distance_haversine(waypoint.location, end.location) / 1000.0 AS leg2_km,
     distance_haversine(start.location, end.location) / 1000.0 AS direct_km
RETURN start.name AS start,
       waypoint.name AS via,
       end.name AS destination,
       leg1_km + leg2_km AS total_with_waypoint_km,
       direct_km AS direct_distance_km,
       (leg1_km + leg2_km) - direct_km AS detour_km;

// Query 9: Geographic clustering by region
MATCH (c:City)
RETURN CASE
           WHEN geo_lat(c.location) > 37.0 THEN 'Northern California'
           WHEN geo_lat(c.location) > 34.0 THEN 'Central California'
           ELSE 'Southern California'
       END AS region,
       collect(c.name) AS cities,
       count(c) AS city_count,
       sum(c.population) AS total_population,
       avg(c.area_sqkm) AS avg_area_sqkm
ORDER BY total_population DESC;

// Query 10: Calculate midpoint between cities
MATCH (sf:City {name: 'San Francisco'}), (la:City {name: 'Los Angeles'})
WITH sf, la,
     (geo_lat(sf.location) + geo_lat(la.location)) / 2.0 AS mid_lat,
     (geo_lon(sf.location) + geo_lon(la.location)) / 2.0 AS mid_lon
RETURN sf.name AS city1,
       la.name AS city2,
       mid_lat AS midpoint_latitude,
       mid_lon AS midpoint_longitude,
       distance_haversine(sf.location, LatLon(mid_lat, mid_lon)) / 1000.0 AS distance_to_midpoint_km;

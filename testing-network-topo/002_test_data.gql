// =============================================================================
// VULNERABILITY ASSOCIATIONS
// =============================================================================

// Redis no-auth vulnerability
MATCH (s:Service {service_id: 'svc-redis-cache-01'}), (v:Vulnerability {vuln_id: 'vuln-redis-noauth'})
CREATE (s)-[:HAS_VULNERABILITY {discovered_at: datetime('2024-01-15T10:30:00'), verified: true}]->(v);

// OpenSSH vulnerability on bastion
MATCH (s:Service {service_id: 'svc-ssh-bastion'}), (v:Vulnerability {vuln_id: 'vuln-openssh-2024-001'})
CREATE (s)-[:HAS_VULNERABILITY {discovered_at: datetime('2024-07-01T14:00:00'), verified: true}]->(v);

// PostgreSQL privilege escalation
MATCH (s:Service {service_id: 'svc-postgres-db-01'}), (v:Vulnerability {vuln_id: 'vuln-postgres-priv-esc'})
CREATE (s)-[:HAS_VULNERABILITY {discovered_at: datetime('2024-08-15T09:00:00'), verified: true}]->(v);

// Kong auth bypass
MATCH (s:Service {service_id: 'svc-kong-api-gw'}), (v:Vulnerability {vuln_id: 'vuln-kong-bypass'})
CREATE (s)-[:HAS_VULNERABILITY {discovered_at: datetime('2024-09-01T11:00:00'), verified: false}]->(v);

// Windows LPE on admin workstation
MATCH (h:Host {host_id: 'host-admin-ws-01'}), (v:Vulnerability {vuln_id: 'vuln-win11-lpe'})
CREATE (h)-[:HAS_VULNERABILITY {discovered_at: datetime('2024-10-01T08:00:00'), verified: true, remediation_status: 'open'}]->(v);


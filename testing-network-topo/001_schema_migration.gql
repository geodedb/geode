// =============================================================================
// Network Topology Mapper Schema Migration
// =============================================================================
// Purpose: Maps protocols and services through interfaces between subnets
//          and identifies attack paths for security analysis
// Version: 1.0.0
// GQL Compliance: ISO/IEC 39075:2024
// =============================================================================

// =============================================================================
// GRAPH CREATION
// =============================================================================

CREATE GRAPH IF NOT EXISTS network_topology;
USE GRAPH network_topology;

// Clean any existing data
MATCH (n) DETACH DELETE n;

// =============================================================================
// PROTOCOL REFERENCE DATA (Layer 3-7)
// =============================================================================

CREATE (:Protocol {
    protocol_id: 'proto-tcp',
    name: 'tcp',
    layer: 4,
    is_connection_oriented: true,
    description: 'Transmission Control Protocol'
});

CREATE (:Protocol {
    protocol_id: 'proto-udp',
    name: 'udp',
    layer: 4,
    is_connection_oriented: false,
    description: 'User Datagram Protocol'
});

CREATE (:Protocol {
    protocol_id: 'proto-icmp',
    name: 'icmp',
    layer: 3,
    is_connection_oriented: false,
    description: 'Internet Control Message Protocol'
});

CREATE (:Protocol {
    protocol_id: 'proto-https',
    name: 'https',
    layer: 7,
    is_connection_oriented: true,
    description: 'HTTP over TLS'
});

CREATE (:Protocol {
    protocol_id: 'proto-ssh',
    name: 'ssh',
    layer: 7,
    is_connection_oriented: true,
    description: 'Secure Shell Protocol'
});

CREATE (:Protocol {
    protocol_id: 'proto-dns',
    name: 'dns',
    layer: 7,
    is_connection_oriented: false,
    description: 'Domain Name System'
});


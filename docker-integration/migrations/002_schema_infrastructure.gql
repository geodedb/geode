-- Enterprise Network Schema - Infrastructure Entities
-- Migration 002: Server, Application, Database, Network, Datacenter nodes

-- Server nodes (2,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (s:Server) REQUIRE s.id IS UNIQUE;
CREATE CONSTRAINT IF NOT EXISTS FOR (s:Server) REQUIRE s.hostname IS UNIQUE;

-- Application nodes (3,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (a:Application) REQUIRE a.id IS UNIQUE;

-- Database nodes (500 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (db:Database) REQUIRE db.id IS UNIQUE;

-- Network nodes (200 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (n:Network) REQUIRE n.id IS UNIQUE;

-- Datacenter nodes (20 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (dc:Datacenter) REQUIRE dc.id IS UNIQUE;


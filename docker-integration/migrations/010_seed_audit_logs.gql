-- Policies
CREATE (:Policy {
  id: 'policy-rls-001',
  name: 'Employee Salary Visibility',
  type: 'ROW_LEVEL_SECURITY',
  enabled: true,
  expression: 'user.role IN ["admin", "hr"] OR user.id = row.manager_id',
  priority: 100,
  created_at: datetime('2024-01-01T00:00:00Z')
});

CREATE (:Policy {
  id: 'policy-rls-002',
  name: 'Project Access Control',
  type: 'ROW_LEVEL_SECURITY',
  enabled: true,
  expression: 'user.department_id = row.department_id OR user.role = "admin"',
  priority: 90,
  created_at: datetime('2024-01-01T00:00:00Z')
});

CREATE (:Policy {
  id: 'policy-audit-001',
  name: 'Full Audit Logging',
  type: 'AUDIT',
  enabled: true,
  expression: 'action IN ["LOGIN", "CREATE", "UPDATE", "DELETE", "SCHEMA_CHANGE"]',
  priority: 100,
  created_at: datetime('2024-01-01T00:00:00Z')
});

CREATE (:Policy {
  id: 'policy-encryption-001',
  name: 'PII Encryption',
  type: 'ENCRYPTION',
  enabled: true,
  expression: 'property IN ["salary", "ssn", "password_hash"]',
  priority: 100,
  created_at: datetime('2024-01-01T00:00:00Z')
});

-- Link policies to roles
MATCH (p:Policy {type: 'ROW_LEVEL_SECURITY'}), (r:Role {id: 'role-viewer'}) CREATE (p)-[:APPLIES_TO]->(r);
MATCH (p:Policy {type: 'ROW_LEVEL_SECURITY'}), (r:Role {id: 'role-analyst'}) CREATE (p)-[:APPLIES_TO]->(r);
MATCH (p:Policy {type: 'ROW_LEVEL_SECURITY'}), (r:Role {id: 'role-developer'}) CREATE (p)-[:APPLIES_TO]->(r);

-- Database connections from applications to databases (additional)
MATCH (a:Application {id: 'app-web-001'}), (db:Database {id: 'db-geode-001'}) CREATE (a)-[:CONNECTS_TO]->(db);

-- Server monitoring relationships
MATCH (i:Incident), (s:Server) WHERE i.id = 'inc-001' AND s.id = 'srv-api-001' CREATE (i)-[:OCCURRED_ON]->(s);

-- Enterprise Network Schema - Security and Audit Entities
-- Migration 003: User, Permission, AuditLog, Policy, Incident nodes

-- User nodes (1,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (u:User) REQUIRE u.id IS UNIQUE;
CREATE CONSTRAINT IF NOT EXISTS FOR (u:User) REQUIRE u.username IS UNIQUE;

-- Permission nodes (500 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (p:Permission) REQUIRE p.id IS UNIQUE;

-- Role nodes for RBAC
CREATE CONSTRAINT IF NOT EXISTS FOR (r:Role) REQUIRE r.id IS UNIQUE;

-- AuditLog nodes (100,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (al:AuditLog) REQUIRE al.id IS UNIQUE;

-- Policy nodes (50 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (p:Policy) REQUIRE p.id IS UNIQUE;

-- Incident nodes (500 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (i:Incident) REQUIRE i.id IS UNIQUE;


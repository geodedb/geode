  name: 'Core API',
  version: '5.1.0',
  port: 8080,
  health_status: 'healthy',
  last_deploy: datetime('2024-11-10T14:00:00Z')
});

CREATE (:Application {
  id: 'app-worker-001',
  name: 'Background Worker',
  version: '2.0.5',

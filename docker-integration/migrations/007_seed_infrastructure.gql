-- Databases
CREATE (:Database {
  id: 'db-geode-001',
  name: 'GraphDB Primary',
  engine: 'Geode',
  size_gb: 2048,
  replica_count: 3,
  connection_string: 'quic://db-prod-001:3141'
});

CREATE (:Database {
  id: 'db-postgres-001',
  name: 'Analytics',
  engine: 'PostgreSQL 15',
  size_gb: 512,
  replica_count: 2,
  connection_string: 'postgresql://analytics-db:5432/analytics'
});

-- Link applications to servers
MATCH (a:Application {id: 'app-web-001'}), (s:Server {id: 'srv-web-001'}) CREATE (a)-[:RUNS_ON]->(s);
MATCH (a:Application {id: 'app-api-001'}), (s:Server {id: 'srv-api-001'}) CREATE (a)-[:RUNS_ON]->(s);
MATCH (a:Application {id: 'app-worker-001'}), (s:Server {id: 'srv-api-001'}) CREATE (a)-[:RUNS_ON]->(s);

-- Link servers to datacenters
MATCH (s:Server {datacenter_id: 'dc-us-west-1'}), (dc:Datacenter {id: 'dc-us-west-1'}) CREATE (s)-[:LOCATED_IN]->(dc);

-- Link servers to networks
MATCH (s:Server), (n:Network {id: 'net-prod-001'}) WHERE s.ip_addr STARTS WITH '10.0' CREATE (s)-[:IN_NETWORK]->(n);

-- Link applications to databases
MATCH (a:Application {id: 'app-api-001'}), (db:Database {id: 'db-geode-001'}) CREATE (a)-[:CONNECTS_TO]->(db);
MATCH (a:Application {id: 'app-worker-001'}), (db:Database {id: 'db-postgres-001'}) CREATE (a)-[:CONNECTS_TO]->(db);

-- Application dependencies
MATCH (a1:Application {id: 'app-web-001'}), (a2:Application {id: 'app-api-001'}) CREATE (a1)-[:DEPENDS_ON]->(a2);

-- Enterprise Network Schema - Core Entities
-- Migration 001: Core node types and constraints
-- Creates: Organization, Department, Employee, Project, Document

-- Organization nodes (100 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (o:Organization) REQUIRE o.id IS UNIQUE;

-- Department nodes (1,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (d:Department) REQUIRE d.id IS UNIQUE;

-- Employee nodes (25,000 expected with vector embeddings)
CREATE CONSTRAINT IF NOT EXISTS FOR (e:Employee) REQUIRE e.id IS UNIQUE;
CREATE CONSTRAINT IF NOT EXISTS FOR (e:Employee) REQUIRE e.email IS UNIQUE;

-- Project nodes (5,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (p:Project) REQUIRE p.id IS UNIQUE;

-- Document nodes (10,000 expected)
CREATE CONSTRAINT IF NOT EXISTS FOR (d:Document) REQUIRE d.id IS UNIQUE;


version: "1.0"
name: "Geode Basic Functionality Tests"
description: "Core Geode database functionality testing including server, queries, and authentication"

cli:
  binary: "/home/benji/src/spyder/geode/zig-out/bin/geode"
  working_dir: null
  env:
    GEODE_LOG_LEVEL: "info"
  server:
    enabled: true
    port: null  # Auto-allocate
    data_dir: null  # Use temporary directory
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "info"]
    env: {}
  client:
    server_address: "127.0.0.1:3141"  # Will be overridden by managed server
    timeout_ms: 30000
    tls_verify: false
    format: "json"

secrets:
  admin_password:
    source: "env"
    key: "GEODE_ADMIN_PASSWORD"
    required: false
  test_token:
    source: "env"
    key: "GEODE_TEST_TOKEN"
    required: false

invariants:
  - type: "server_running"

fuzz:
  enabled: false
  provider: "mock"
  max_cases: 5
  seed: 42
  geode_specific: true
  include_gql: true
  include_auth: false

tests:
  - name: "help-command"
    description: "Test basic help command"
    args: ["--help"]
    expect:
      exit_code: 0
      stdout_contains: ["geode", "Usage:", "graph database"]
    tags: ["basic", "help"]

  - name: "version-command"
    description: "Test version display"
    args: ["--version"]
    expect:
      exit_code: 0
      stdout_regex: ["v?\\d+\\.\\d+\\.\\d+"]
    tags: ["basic", "version"]

  - name: "simple-query"
    description: "Execute a simple RETURN query"
    args: ["RETURN 1 AS result", "--embedded"]
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].result"
          equals: 1
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["query", "basic"]

  - name: "node-count-query"
    description: "Count all nodes in the database"
    args: ["MATCH (n) RETURN count(n) AS node_count", "--embedded"]
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].node_count"
          matches_regex: "\\d+"
      geode_query:
        row_count: 1
        columns: ["node_count"]
    tags: ["query", "graph"]

  - name: "create-test-node"
    description: "Create a test node"
    args: ["CREATE (n:TestNode {name: 'geodetestlab', created_at: timestamp()}) RETURN n", "--embedded"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        contains_node:
          name: "geodetestlab"
    tags: ["query", "create", "graph"]

  - name: "query-test-nodes"
    description: "Query for test nodes"
    args: ["MATCH (n:TestNode) WHERE n.name = 'geodetestlab' RETURN n", "--embedded"]
    expect:
      exit_code: 0
      geode_query:
        min_rows: 0  # May or may not exist depending on previous test execution
        contains_node:
          name: "geodetestlab"
    tags: ["query", "graph"]

  - name: "query-with-format"
    description: "Test different output formats"
    args: ["--format", "table", "RETURN 1 AS num, 'hello' AS text", "--embedded"]
    expect:
      exit_code: 0
      stdout_contains: ["num", "text", "hello"]
    tags: ["query", "format"]

  - name: "invalid-gql-syntax"
    description: "Test error handling with invalid GQL"
    args: ["MATCH (n INVALID SYNTAX", "--embedded"]
    expect:
      exit_code: 1
      stderr_contains: ["syntax", "error"]
    tags: ["query", "error"]

  - name: "server-help"
    description: "Test server subcommand help"
    args: ["serve", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["serve", "Start", "server"]
    tags: ["server", "help"]

  - name: "shell-help" 
    description: "Test shell subcommand help"
    args: ["shell", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["shell", "Interactive", "GQL"]
    tags: ["shell", "help"]

  - name: "auth-help"
    description: "Test auth subcommand help"
    args: ["auth", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["auth", "Authentication"]
    tags: ["auth", "help"]

  - name: "user-help"
    description: "Test user management help"
    args: ["user", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["user", "management"]
    tags: ["user", "help"]

tags: ["basic", "core", "geode"]
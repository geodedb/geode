  - name: "cleanup-01-analytics-graph"
    description: "Clean up analytics graph data"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (n) DETACH DELETE n
      RETURN 'analytics_cleaned' AS status
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "cleanup-02-production-graph"
    description: "Clean up production graph data"
    args: ["query", "-"]
    stdin: |
      USE GRAPH production;
      MATCH (n) DETACH DELETE n
      RETURN 'production_cleaned' AS status
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "cleanup-03-staging-graph"
    description: "Clean up staging graph data"
    args: ["query", "-"]
    stdin: |
      USE GRAPH staging;
      MATCH (n) DETACH DELETE n
      RETURN 'staging_cleaned' AS status
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "cleanup-04-verify-empty"
    description: "Verify all graphs are empty"
    args: ["query", "-"]
    stdin: |
      USE GRAPH production;
      MATCH (n) RETURN count(n) AS remaining_nodes
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        rows:
          - remaining_nodes: 0
    tags: ["cleanup", "verify"]

tags: ["enterprise", "comprehensive", "security", "vectors", "algorithms", "transactions", "multi-graph"]

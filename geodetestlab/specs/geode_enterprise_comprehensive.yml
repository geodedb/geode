  - name: "with-01-basic-projection"
    description: "Basic WITH clause for variable projection"
    args: ["query", "-"]
    stdin: |
      USE GRAPH production;
      MATCH (u:User)
      WITH u.name AS username, u.department AS dept, u.clearance AS level
      WHERE level >= 3
      RETURN username, dept, level
      ORDER BY level DESC
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["with-clause", "projection"]

  - name: "with-02-aggregation-chain"
    description: "WITH clause for aggregation and filtering"
    args: ["query", "-"]
    stdin: |
      USE GRAPH production;
      MATCH (u:User)-[:CAN_ACCESS]->(d:Document)
      WITH u, count(d) AS doc_count
      WHERE doc_count >= 2
      RETURN u.name AS user, doc_count
      ORDER BY doc_count DESC
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["with-clause", "aggregation"]

  - name: "with-03-multi-stage-pipeline"
    description: "Multi-stage query pipeline with WITH"
    args: ["query", "-"]
    stdin: |
      USE GRAPH production;
      MATCH (u:User {department: 'Engineering'})
      WITH u
      MATCH (u)-[:CAN_ACCESS]->(d:Document)
      WITH u, d
      WHERE d.classification <> 'public'
      RETURN u.name AS engineer, d.title AS restricted_doc
      ORDER BY u.name
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["with-clause", "pipeline"]

  - name: "with-04-order-and-limit"
    description: "WITH clause with ORDER BY and LIMIT"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (p:Person)
      WITH p ORDER BY p.influence DESC LIMIT 3
      MATCH (p)-[:FOLLOWS]->(followed:Person)
      RETURN p.name AS influencer, followed.name AS follows
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["with-clause", "order-limit"]

  - name: "with-05-collect-aggregation"
    description: "WITH clause with COLLECT aggregation"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (p:Person)-[:FOLLOWS]->(followed:Person)
      WITH p, collect(followed.name) AS following_list
      WHERE size(following_list) >= 2
      RETURN p.name AS person, following_list, size(following_list) AS follow_count
      ORDER BY follow_count DESC
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["with-clause", "collect"]


  - name: "vlp-01-exact-length"
    description: "Variable-length path with exact length"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (start:Person {name: 'Alice'})-[:FOLLOWS*2]->(end:Person)
      RETURN end.name AS reached_in_2_hops
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["variable-length", "exact"]

  - name: "vlp-02-range-length"
    description: "Variable-length path with range (min..max)"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (start:Person {name: 'Alice'})-[:FOLLOWS*1..3]->(end:Person)
      RETURN DISTINCT end.name AS reachable
      ORDER BY end.name
    expect:
      exit_code: 0
      geode_query:
        min_rows: 2
    tags: ["variable-length", "range"]

  - name: "vlp-03-unbounded-max"
    description: "Variable-length path with unbounded max (n..)"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (start:Person {name: 'Frank'})-[:FOLLOWS*2..]->(end:Person)
      RETURN DISTINCT end.name AS distant_connections
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["variable-length", "unbounded"]

  - name: "vlp-04-path-with-properties"
    description: "Variable-length path with relationship property filter"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH path = (start:Person {name: 'Alice'})-[r:FOLLOWS*1..3]->(end:Person)
      WHERE ALL(rel IN r WHERE rel.weight > 0.5)
      RETURN end.name AS strong_connections, length(path) AS hops
      ORDER BY hops
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
    tags: ["variable-length", "filtered"]

  - name: "vlp-05-bidirectional-paths"
    description: "Bidirectional variable-length path"
    args: ["query", "-"]
    stdin: |
      USE GRAPH analytics;
      MATCH (a:Person {name: 'Carol'})-[:FOLLOWS*1..2]-(b:Person)
      WHERE a <> b
      RETURN DISTINCT b.name AS connected
      ORDER BY b.name
    expect:
      exit_code: 0
      geode_query:
        min_rows: 2
    tags: ["variable-length", "bidirectional"]


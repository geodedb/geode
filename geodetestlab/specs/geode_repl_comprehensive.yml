name: "Geode REPL Comprehensive Tests"
description: "Comprehensive test suite for Geode REPL functionality including QUIC integration, command history, formatting, and transaction support"

# CANARY: REQ=REQ-REPL-COMPREHENSIVE-001; FEATURE="REPL Comprehensive Testing"; ASPECT=GeodeTestLab; STATUS=IMPL; TEST=geode_repl_comprehensive; OWNER=repl; UPDATED=2025-10-05

setup:
  timeout: 30
  cleanup: true

tests:
  # 1. REPL Basic Functionality Tests
  - name: "REPL basic startup and help"
    description: "Test REPL starts up and shows help correctly"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\help\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Welcome to Geode Shell"
      - "Meta-Commands"
      - "\\help"
      - "\\quit"

  - name: "REPL simple query execution"
    description: "Test basic query execution in REPL"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 1 AS result;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "geode>"

  - name: "REPL multi-line query support" 
    description: "Test multi-line query input with continuation prompts"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "MATCH (n:Person)\nRETURN n.name\nLIMIT 5;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "geode>"
      - "geode->"

  # 2. REPL Meta-Command Tests
  - name: "REPL timing command"
    description: "Test timing meta-command functionality"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\timing on\nRETURN 1;\n\\timing off\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Timing is on"
      - "executed in"
      - "Timing is off"

  - name: "REPL format commands"
    description: "Test output format switching"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\format table\n\\format csv\n\\format json\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Output format set to table"
      - "Output format set to csv"
      - "Output format set to json"

  - name: "REPL clear screen command"
    description: "Test clear screen functionality"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\clear\n\\quit\n"
    expect_exit_code: 0

  - name: "REPL echo command"
    description: "Test echo meta-command"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\echo Hello World\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Hello World"

  # 3. REPL History Management Tests
  - name: "REPL history basic functionality"
    description: "Test command history storage and retrieval"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 1;\nRETURN 2;\n\\history\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "RETURN 1"
      - "RETURN 2"

  - name: "REPL history with limit"
    description: "Test history command with number limit"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 1;\nRETURN 2;\nRETURN 3;\n\\history 2\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "RETURN 2"
      - "RETURN 3"

  - name: "REPL history clear"
    description: "Test history clear functionality"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 1;\n\\history -c\n\\history\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "History cleared"

  # 4. REPL Transaction Support Tests
  - name: "REPL transaction begin-commit"
    description: "Test transaction begin and commit workflow"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\begin\n\\commit\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Transaction started"
      - "Transaction committed"

  - name: "REPL transaction begin-rollback"
    description: "Test transaction begin and rollback workflow"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\begin\n\\rollback\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Transaction started"
      - "Transaction rolled back"

  - name: "REPL transaction prompt change"
    description: "Test that prompt shows transaction state"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\begin\nRETURN 1;\n\\commit\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "geode(txn)>"

  # 5. REPL Connection Management Tests
  - name: "REPL connect command syntax"
    description: "Test connect command with various server addresses"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\connect localhost:3141\n\\disconnect\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Connected to localhost:3141"
      - "Disconnected"

  - name: "REPL connect command error handling"
    description: "Test connect command error handling for missing arguments"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\connect\n\\quit\n"
    expect_exit_code: 0
    expect_stderr_contains:
      - "Usage: \\connect <host:port>"

  # 6. REPL Configuration and Settings Tests
  - name: "REPL set keymap emacs"
    description: "Test setting keymap to emacs mode"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\set keymap emacs\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Keymap set to emacs"

  - name: "REPL set keymap vi"
    description: "Test setting keymap to vi mode"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\set keymap vi\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Keymap set to vi"

  # 7. REPL Error Handling Tests
  - name: "REPL unknown meta-command"
    description: "Test handling of unknown meta-commands"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\unknown\n\\quit\n"
    expect_exit_code: 0
    expect_stderr_contains:
      - "Unknown command"

  - name: "REPL typo detection"
    description: "Test typo detection in meta-commands"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\connet\n\\quit\n"
    expect_exit_code: 0
    expect_stderr_contains:
      - "Did you mean '\\connect'"

  - name: "REPL invalid timing argument"
    description: "Test error handling for invalid timing arguments"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\timing invalid\n\\quit\n"
    expect_exit_code: 0
    expect_stderr_contains:
      - "Usage: \\timing on|off"

  - name: "REPL invalid format argument"
    description: "Test error handling for invalid format arguments"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\format invalid\n\\quit\n"
    expect_exit_code: 0
    expect_stderr_contains:
      - "Usage: \\format table|csv|json"

  # 8. REPL Output Format Tests
  - name: "REPL JSON output format"
    description: "Test JSON output formatting"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\format json\nRETURN 1 AS number, 'test' AS text;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Output format set to json"

  - name: "REPL table output format"
    description: "Test table output formatting"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\format table\nRETURN 1 AS number, 'test' AS text;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Output format set to table"

  - name: "REPL CSV output format"
    description: "Test CSV output formatting"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\format csv\nRETURN 1 AS number, 'test' AS text;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "Output format set to csv"

  # 9. REPL Persistence Tests
  - name: "REPL history persistence"
    description: "Test that history persists between sessions"
    timeout: 15
    cmd: "bash"
    args: ["-c", "rm -f /tmp/test_history.txt; GEODE_HISTORY=/tmp/test_history.txt ./zig-out/bin/geode shell --server localhost:7567 <<< $'RETURN 42;\\n\\\\quit\\n'; GEODE_HISTORY=/tmp/test_history.txt ./zig-out/bin/geode shell --server localhost:7567 <<< $'\\\\history\\n\\\\quit\\n'"]
    expect_exit_code: 0
    expect_stdout_contains:
      - "RETURN 42"

  # 10. REPL Advanced Feature Tests
  - name: "REPL source command (not implemented)"
    description: "Test source command returns not implemented"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\source test.gql\n\\quit\n"
    expect_exit_code: 0
    expect_stderr_contains:
      - "not yet implemented"

  - name: "REPL complex query with formatting"
    description: "Test complex GQL query with different output formats"
    timeout: 15
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\timing on\n\\format table\nMATCH (n) RETURN count(n) AS total LIMIT 1;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "executed in"

  # 11. REPL QUIC Integration Tests
  - name: "REPL QUIC connection establishment"
    description: "Test that REPL can establish QUIC connections"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 'QUIC test' AS message;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "geode>"

  - name: "REPL QUIC connection with timing"
    description: "Test QUIC connection performance timing"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\timing on\nRETURN 'Performance test' AS message;\n\\quit\n"
    expect_exit_code: 0
    expect_stdout_contains:
      - "executed in"
      - "ms"

  # 12. REPL Edge Cases and Stress Tests
  - name: "REPL multiple format switches"
    description: "Test rapid format switching works correctly"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\format json\n\\format table\n\\format csv\n\\format json\nRETURN 1;\n\\quit\n"
    expect_exit_code: 0

  - name: "REPL long query input"
    description: "Test handling of long query input"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 'This is a very long string that tests the input buffer handling capabilities of the REPL system' AS long_message;\n\\quit\n"
    expect_exit_code: 0

  - name: "REPL rapid command execution"
    description: "Test rapid execution of multiple commands"
    timeout: 15
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "RETURN 1;\nRETURN 2;\nRETURN 3;\nRETURN 4;\nRETURN 5;\n\\quit\n"
    expect_exit_code: 0

  # 13. REPL Memory and Resource Tests
  - name: "REPL history memory management"
    description: "Test history doesn't cause memory issues with many entries"
    timeout: 15
    cmd: "bash"
    args: ["-c", "{ for i in {1..50}; do echo \"RETURN $i;\"; done; echo '\\quit'; } | ./zig-out/bin/geode shell --server localhost:7567"]
    expect_exit_code: 0

  - name: "REPL connection cleanup"
    description: "Test proper cleanup of connections and resources"
    timeout: 10
    cmd: "./zig-out/bin/geode"
    args: ["shell", "--server", "localhost:7567"]
    stdin: "\\connect localhost:7567\n\\disconnect\n\\connect localhost:7567\n\\quit\n"
    expect_exit_code: 0

tags:
  - repl
  - interactive
  - quic
  - history
  - formatting
  - transactions
  - meta-commands
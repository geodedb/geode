version: "1.0"
name: "Geode GQL Keyword Handling Fixes Test Suite"
description: "Comprehensive test suite validating all keyword handling fixes for 100% GQL ISO/IEC 39075:2024 compliance"

cli:
  binary: "/home/benji/src/spyder/geode/zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # SETUP - Create test data
  # ===============================

  - name: "setup-keyword-test-data"
    description: "Create test data for keyword handling validation"
    args: ["query", 
           "CREATE (alice:Person {name: 'Alice', age: 30, property: 'senior', type: 'engineer', count: 5, path: '/home/alice', value: 100}), (bob:Person {name: 'Bob', age: 25, property: 'junior', type: 'developer', count: 3, path: '/home/bob', value: 80}), (charlie:Person {name: 'Charlie', age: 35, property: 'manager', type: 'lead', count: 8, path: '/home/charlie', value: 120}), (alice)-[:KNOWS {since: 2020, type: 'friendship', property: 'strong'}]->(bob), (alice)-[:KNOWS {since: 2018, type: 'work', property: 'professional'}]->(charlie), (bob)-[:KNOWS {since: 2021, type: 'work', property: 'collaboration'}]->(charlie) RETURN count(*) AS created"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["created"]
    tags: ["setup", "keywords"]

  # ===============================
  # PATH VARIABLE ASSIGNMENT TESTS
  # (The original failing case from GQL compliance)
  # ===============================

  - name: "path-variable-basic-assignment"
    description: "Test basic path variable assignment with PATH keyword"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS path_length"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "path_length"]
    tags: ["path", "variable", "assignment"]

  - name: "path-variable-with-quantifiers"
    description: "Test path variable assignment with variable-length patterns"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS*1..2]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS path_length"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "path_length"]
    tags: ["path", "variable", "quantifiers"]

  - name: "path-variable-complex-pattern"
    description: "Test the originally failing complex path variable pattern"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS*2..4]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS path_length"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "path_length"]
    tags: ["path", "variable", "complex"]

  - name: "multiple-path-variables"
    description: "Test multiple path variables with different keyword names"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person), route = (b)-[:KNOWS]->(c:Person) RETURN length(path) AS path_len, length(route) AS route_len"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["path_len", "route_len"]
    tags: ["path", "multiple", "variables"]

  # ===============================
  # FUNCTION CALLS WITH KEYWORDS
  # ===============================

  - name: "function-calls-with-path-keyword"
    description: "Test function calls using PATH keyword as argument"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN length(path) AS path_length, upper(path) AS upper_path"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["path_length", "upper_path"]
    tags: ["function", "path", "keyword"]

  - name: "function-calls-with-other-keywords"
    description: "Test function calls using other keywords as arguments"
    args: ["query", 
           "MATCH (n:Person) RETURN length(n.property) AS property_length, upper(n.type) AS upper_type, size(n.count) AS count_size"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["property_length", "upper_type", "count_size"]
    tags: ["function", "keywords", "arguments"]

  - name: "nested-function-calls-with-keywords"
    description: "Test nested function calls with keyword arguments"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN upper(lower(substring(path, 0, length(path)))) AS processed_path"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["processed_path"]
    tags: ["function", "nested", "keywords"]

  # ===============================
  # AGGREGATION WITH KEYWORD ALIASES
  # ===============================

  - name: "aggregation-count-with-keyword-alias"
    description: "Test COUNT aggregation with keyword aliases"
    args: ["query", 
           "MATCH (n:Person) RETURN COUNT(n) AS count, COUNT(n.name) AS property, COUNT(DISTINCT n.type) AS type"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["count", "property", "type"]
    tags: ["aggregation", "count", "alias"]

  - name: "aggregation-math-functions-with-keyword-aliases"
    description: "Test mathematical aggregations with keyword aliases"
    args: ["query", 
           "MATCH (n:Person) RETURN SUM(n.value) AS sum, AVG(n.age) AS avg, MIN(n.count) AS min, MAX(n.value) AS max"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["sum", "avg", "min", "max"]
    tags: ["aggregation", "math", "alias"]

  - name: "aggregation-with-path-keyword-alias"
    description: "Test aggregation functions with PATH keyword as alias"
    args: ["query", 
           "MATCH (n:Person) RETURN COUNT(n) AS path, SUM(n.value) AS value, AVG(n.count) AS property"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["path", "value", "property"]
    tags: ["aggregation", "path", "alias"]

  - name: "complex-aggregation-with-keywords"
    description: "Test complex aggregation with multiple keyword usage"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN COUNT(path) AS count, SUM(length(path)) AS sum, AVG(a.value) AS avg"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["count", "sum", "avg"]
    tags: ["aggregation", "complex", "keywords"]

  # ===============================
  # SET CLAUSE WITH KEYWORD PROPERTIES
  # ===============================

  - name: "set-property-keyword-basic"
    description: "Test SET clause with PROPERTY keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Alice'}) SET n.property = 'updated_senior' RETURN n.name AS name, n.property AS property"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "property"]
    tags: ["set", "property", "keyword"]

  - name: "set-type-keyword-property"
    description: "Test SET clause with TYPE keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Bob'}) SET n.type = 'senior_developer' RETURN n.name AS name, n.type AS type"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "type"]
    tags: ["set", "type", "keyword"]

  - name: "set-path-keyword-property"
    description: "Test SET clause with PATH keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Charlie'}) SET n.path = '/updated/home/charlie' RETURN n.name AS name, n.path AS path"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "path"]
    tags: ["set", "path", "keyword"]

  - name: "set-count-keyword-property"
    description: "Test SET clause with COUNT keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Alice'}) SET n.count = n.count + 1 RETURN n.name AS name, n.count AS count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "count"]
    tags: ["set", "count", "keyword"]

  - name: "set-multiple-keyword-properties"
    description: "Test SET clause with multiple keyword properties"
    args: ["query", 
           "MATCH (n:Person {name: 'Bob'}) SET n.property = 'multi_update', n.count = 99, n.path = '/new/path' RETURN n.name AS name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name"]
    tags: ["set", "multiple", "keywords"]

  - name: "set-without-return-property-keyword"
    description: "Test SET clause without RETURN using keyword properties"
    args: ["query", 
           "MATCH (n:Person {name: 'Charlie'}) SET n.property = 'no_return_test', n.type = 'updated_lead'"]
    expect:
      exit_code: 0
    tags: ["set", "no-return", "keywords"]

  # ===============================
  # REMOVE CLAUSE WITH KEYWORD PROPERTIES
  # ===============================

  - name: "remove-property-keyword-basic"
    description: "Test REMOVE clause with PROPERTY keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Alice'}) REMOVE n.property RETURN n.name AS name, n.property AS property"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "property"]
    tags: ["remove", "property", "keyword"]

  - name: "remove-type-keyword-property"
    description: "Test REMOVE clause with TYPE keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Bob'}) REMOVE n.type RETURN n.name AS name, n.type AS type"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "type"]
    tags: ["remove", "type", "keyword"]

  - name: "remove-path-keyword-property"
    description: "Test REMOVE clause with PATH keyword as property name"
    args: ["query", 
           "MATCH (n:Person {name: 'Charlie'}) REMOVE n.path RETURN n.name AS name, n.path AS path"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "path"]
    tags: ["remove", "path", "keyword"]

  - name: "remove-multiple-keyword-properties"
    description: "Test REMOVE clause with multiple keyword properties"
    args: ["query", 
           "MATCH (n:Person {name: 'Bob'}) REMOVE n.property, n.count RETURN n.name AS name, n.property AS property, n.count AS count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["name", "property", "count"]
    tags: ["remove", "multiple", "keywords"]

  - name: "remove-without-return-property-keyword"
    description: "Test REMOVE clause without RETURN using keyword properties"
    args: ["query", 
           "MATCH (n:Person {name: 'Charlie'}) REMOVE n.property, n.type"]
    expect:
      exit_code: 0
    tags: ["remove", "no-return", "keywords"]

  # ===============================
  # PARAMETER PARSING WITH KEYWORDS
  # ===============================

  - name: "parameter-parsing-with-count-keyword"
    description: "Test parameter parsing with COUNT keyword"
    args: ["query", 
           "MATCH (n:Person) WHERE n.count > $count RETURN n.name AS name", 
           "--param", "count=4"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["name"]
    tags: ["parameter", "count", "keyword"]

  - name: "parameter-parsing-with-path-keyword"
    description: "Test parameter parsing with PATH keyword"
    args: ["query", 
           "MATCH (n:Person) WHERE n.path STARTS WITH $path RETURN n.name AS name", 
           "--param", "path=/home"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["name"]
    tags: ["parameter", "path", "keyword"]

  - name: "parameter-parsing-with-property-keyword"
    description: "Test parameter parsing with PROPERTY keyword"
    args: ["query", 
           "MATCH (n:Person) WHERE n.property = $property RETURN n.name AS name", 
           "--param", "property=manager"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["name"]
    tags: ["parameter", "property", "keyword"]

  # ===============================
  # KEYWORDS AS IDENTIFIERS IN VARIOUS CONTEXTS
  # ===============================

  - name: "keywords-as-node-variables"
    description: "Test keywords used as node variable names"
    args: ["query", 
           "MATCH (path:Person), (count:Person) WHERE path.name = 'Alice' AND count.name = 'Bob' RETURN path.name AS person1, count.name AS person2"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["person1", "person2"]
    tags: ["keywords", "node", "variables"]

  - name: "keywords-as-relationship-variables"
    description: "Test keywords used as relationship variable names"
    args: ["query", 
           "MATCH (a:Person)-[property:KNOWS]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, property.since AS since"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "since"]
    tags: ["keywords", "relationship", "variables"]

  - name: "keywords-in-where-clauses"
    description: "Test keywords used in WHERE clause property access"
    args: ["query", 
           "MATCH (n:Person) WHERE n.type IN ['engineer', 'developer'] AND n.property IS NOT NULL RETURN n.name AS name, n.type AS type, n.property AS property"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["name", "type", "property"]
    tags: ["keywords", "where", "properties"]

  - name: "keywords-in-order-by-clauses"
    description: "Test keywords used in ORDER BY clauses"
    args: ["query", 
           "MATCH (n:Person) RETURN n.name AS name, n.count AS count, n.property AS property ORDER BY n.count DESC, n.property ASC"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["name", "count", "property"]
    tags: ["keywords", "order", "clauses"]

  # ===============================
  # COMPLEX INTEGRATION SCENARIOS
  # ===============================

  - name: "complex-path-aggregation-keywords"
    description: "Test complex scenario: path variables + aggregation + keyword aliases"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN COUNT(path) AS count, AVG(length(path)) AS avg, SUM(a.value) AS sum"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["count", "avg", "sum"]
    tags: ["complex", "path", "aggregation"]

  - name: "complex-set-remove-with-keywords"
    description: "Test complex scenario: SET/REMOVE + aggregation + keyword properties"
    args: ["query", 
           "MATCH (n:Person) SET n.property = 'batch_update' REMOVE n.count RETURN COUNT(n) AS count, SUM(n.value) AS sum"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["count", "sum"]
    tags: ["complex", "set", "remove"]

  - name: "complex-multiple-path-variables-with-functions"
    description: "Test complex scenario: multiple path variables + functions + keywords"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person), route = (b)-[:KNOWS]->(c:Person) RETURN length(path) + length(route) AS total, upper(a.property) AS property"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["total", "property"]
    tags: ["complex", "multiple", "paths"]

  - name: "complex-merge-with-keyword-properties"
    description: "Test complex MERGE with keyword properties and aggregation"
    args: ["query", 
           "MERGE (n:Person {type: 'test'}) ON CREATE SET n.property = 'created', n.count = 1 ON MATCH SET n.property = 'matched', n.count = n.count + 1 RETURN n.property AS property, n.count AS count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["property", "count"]
    tags: ["complex", "merge", "keywords"]

  - name: "complex-nested-function-calls-keywords"
    description: "Test complex nested function calls with multiple keywords"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN upper(lower(substring(a.property, 0, length(a.property)))) AS processed, length(path) AS path_length"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["processed", "path_length"]
    tags: ["complex", "nested", "functions"]

  - name: "complex-where-with-set-remove-keywords"
    description: "Test complex WHERE with SET/REMOVE using keywords"
    args: ["query", 
           "MATCH (n:Person) WHERE n.type IN ['engineer', 'developer'] SET n.property = n.count || '_processed' REMOVE n.path RETURN COUNT(n) AS count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["count"]
    tags: ["complex", "where", "modification"]

  # ===============================
  # REGRESSION VALIDATION TESTS
  # ===============================

  - name: "regression-original-failing-case"
    description: "Test the exact original failing case that triggered all fixes"
    args: ["query", 
           "MATCH path = (a:Person)-[:KNOWS*2..4]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS path_length"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "path_length"]
    tags: ["regression", "original", "failing"]

  - name: "regression-string-concatenation"
    description: "Test string concatenation still works after keyword fixes"
    args: ["query", 
           "RETURN 'hello' || ' world' AS concatenated, 'test' || ' string' AS test_concat"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["concatenated", "test_concat"]
    tags: ["regression", "string", "concatenation"]

  - name: "regression-built-in-functions"
    description: "Test built-in functions still work after keyword fixes"
    args: ["query", 
           "RETURN upper('hello') AS upper_case, lower('WORLD') AS lower_case, length('test') AS string_length, abs(-5) AS absolute"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["upper_case", "lower_case", "string_length", "absolute"]
    tags: ["regression", "builtin", "functions"]

  - name: "regression-variable-length-paths"
    description: "Test variable-length paths still work after keyword fixes"
    args: ["query", 
           "MATCH (a:Person)-[*1..2]->(b:Person) RETURN count(*) AS path_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["path_count"]
    tags: ["regression", "variable", "paths"]

  # ===============================
  # ERROR CASES SHOULD STILL FAIL
  # ===============================

  - name: "error-missing-label-name"
    description: "Test that syntax errors still fail correctly (missing label)"
    args: ["query", "MATCH (n:) RETURN n"]
    expect:
      exit_code: 1
    tags: ["error", "syntax", "validation"]

  - name: "error-unclosed-parenthesis"
    description: "Test that syntax errors still fail correctly (unclosed paren)"
    args: ["query", "RETURN (1 + 2"]
    expect:
      exit_code: 1
    tags: ["error", "syntax", "validation"]

  - name: "error-missing-property-in-set"
    description: "Test that SET errors still fail correctly (missing property)"
    args: ["query", "MATCH (n) SET = value"]
    expect:
      exit_code: 1
    tags: ["error", "set", "validation"]

  - name: "error-incomplete-remove"
    description: "Test that REMOVE errors still fail correctly (incomplete)"
    args: ["query", "MATCH (n) REMOVE"]
    expect:
      exit_code: 1
    tags: ["error", "remove", "validation"]

  # ===============================
  # CLEANUP
  # ===============================

  - name: "cleanup-keyword-test-data"
    description: "Clean up all keyword test data"
    args: ["query", "MATCH (n) DETACH DELETE n"]
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "verify-keyword-cleanup"
    description: "Verify all keyword test data is cleaned up"
    args: ["query", "MATCH (n) RETURN count(n) AS remaining_nodes"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["remaining_nodes"]
    tags: ["cleanup", "verify"]

invariants:
  - type: "server_running"

tags: ["keywords", "gql", "compliance", "fixes", "path", "aggregation", "set", "remove", "regression"]
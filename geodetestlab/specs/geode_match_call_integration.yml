  description: MATCH + CALL with ORDER BY on results
  args:
  - query
  - --embedded
  - 'CREATE (a:Node {name: ''A'', id: 1}), (b:Node {name: ''B'', id: 2}), (c:Node {name: ''C'', id: 3}), (d:Node {name: ''D'', id: 4}), (e:Node {name: ''E'', id: 5}), (a)-[:ROAD {weight: 1.0}]->(b), (b)-[:ROAD {weight: 2.0}]->(c), (a)-[:ROAD {weight: 5.0}]->(c), (c)-[:ROAD {weight: 1.0}]->(d), (b)-[:ROAD {weight: 3.0}]->(d), (d)-[:ROAD {weight: 2.0}]->(e); MATCH (start:Node {name: ''A''}) CALL algo.bfs.stream(start, {maxDepth: 3}) YIELD path RETURN length(path) AS depth ORDER BY depth'
  expect:
    exit_code: 0
    stdout_contains:
    - depth

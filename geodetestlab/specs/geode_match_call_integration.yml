version: '1.0'
name: geode-match-call-integration
description: Comprehensive integration tests for MATCH + CALL pattern with node binding resolution (embedded mode due to QUIC instability)
tests:
- name: match-call-bfs-basic
  description: MATCH + CALL BFS with single node binding
  args:
  - query
  - --embedded
  - 'CREATE (a:Node {name: ''A'', id: 1}), (b:Node {name: ''B'', id: 2}), (c:Node {name: ''C'', id: 3}), (d:Node {name: ''D'', id: 4}), (e:Node {name: ''E'', id: 5}), (a)-[:ROAD {weight: 1.0}]->(b), (b)-[:ROAD {weight: 2.0}]->(c), (a)-[:ROAD {weight: 5.0}]->(c), (c)-[:ROAD {weight: 1.0}]->(d), (b)-[:ROAD {weight: 3.0}]->(d), (d)-[:ROAD {weight: 2.0}]->(e); MATCH (start:Node {name: ''A''}) CALL algo.bfs.stream(start, {maxDepth: 2}) YIELD path RETURN path'
  expect:
    exit_code: 0
    stdout_contains:
    - path
- name: match-call-with-properties
  description: MATCH with property filter + CALL
  args:
  - query
  - --embedded
  - 'CREATE (a:Node {name: ''A'', id: 1}), (b:Node {name: ''B'', id: 2}), (c:Node {name: ''C'', id: 3}), (d:Node {name: ''D'', id: 4}), (e:Node {name: ''E'', id: 5}), (a)-[:ROAD {weight: 1.0}]->(b), (b)-[:ROAD {weight: 2.0}]->(c), (a)-[:ROAD {weight: 5.0}]->(c), (c)-[:ROAD {weight: 1.0}]->(d), (b)-[:ROAD {weight: 3.0}]->(d), (d)-[:ROAD {weight: 2.0}]->(e); MATCH (n:Node {id: 1}) CALL algo.bfs.stream(n, {maxDepth: 3}) YIELD path RETURN length(path) AS depth'
  expect:
    exit_code: 0
    stdout_contains:
    - depth
- name: match-call-dfs
  description: MATCH + CALL DFS traversal
  args:
  - query
  - --embedded
  - 'CREATE (a:Node {name: ''A'', id: 1}), (b:Node {name: ''B'', id: 2}), (c:Node {name: ''C'', id: 3}), (d:Node {name: ''D'', id: 4}), (e:Node {name: ''E'', id: 5}), (a)-[:ROAD {weight: 1.0}]->(b), (b)-[:ROAD {weight: 2.0}]->(c), (a)-[:ROAD {weight: 5.0}]->(c), (c)-[:ROAD {weight: 1.0}]->(d), (b)-[:ROAD {weight: 3.0}]->(d), (d)-[:ROAD {weight: 2.0}]->(e); MATCH (start:Node {name: ''A''}) CALL algo.dfs.stream(start, {maxDepth: 3}) YIELD path RETURN path'
  expect:
    exit_code: 0
    stdout_contains:
    - path
- name: match-call-dijkstra-two-nodes
  description: MATCH two nodes + CALL Dijkstra shortest path
  args:
  - query
  - --embedded
  - 'CREATE (a:Node {name: ''A'', id: 1}), (b:Node {name: ''B'', id: 2}), (c:Node {name: ''C'', id: 3}), (d:Node {name: ''D'', id: 4}), (e:Node {name: ''E'', id: 5}), (a)-[:ROAD {weight: 1.0}]->(b), (b)-[:ROAD {weight: 2.0}]->(c), (a)-[:ROAD {weight: 5.0}]->(c), (c)-[:ROAD {weight: 1.0}]->(d), (b)-[:ROAD {weight: 3.0}]->(d), (d)-[:ROAD {weight: 2.0}]->(e); MATCH (start:Node {name: ''A''}), (end:Node {name: ''D''}) CALL algo.shortestPath.dijkstra(start, end, ''weight'') YIELD path, cost RETURN cost'
  expect:
    exit_code: 0
    stdout_contains:
    - cost
- name: match-call-dijkstra-optimal
  description: Verify Dijkstra finds optimal path (not direct path)
  args:
  - query
  - --embedded
  - 'CREATE (a:Node {name: ''A'', id: 1}), (b:Node {name: ''B'', id: 2}), (c:Node {name: ''C'', id: 3}), (d:Node {name: ''D'', id: 4}), (e:Node {name: ''E'', id: 5}), (a)-[:ROAD {weight: 1.0}]->(b), (b)-[:ROAD {weight: 2.0}]->(c), (a)-[:ROAD {weight: 5.0}]->(c), (c)-[:ROAD {weight: 1.0}]->(d), (b)-[:ROAD {weight: 3.0}]->(d), (d)-[:ROAD {weight: 2.0}]->(e); MATCH (start:Node {name: ''A''}), (end:Node {name: ''C''}) CALL algo.shortestPath.dijkstra(start, end, ''weight'') YIELD cost RETURN cost'
  expect:
    exit_code: 0
    stdout_contains:
    - '3'
  notes: Should return 3.0 (A->B->C) not 5.0 (A->C direct)

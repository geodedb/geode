version: "1.0"
name: "GQL Pattern Matching Comprehensive Tests"
description: "Complete ISO/IEC 39075:2024 pattern matching testing covering graph patterns, paths, labels, properties, and variable-length relationships"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # BASIC NODE PATTERNS
  # ===============================
  
  - name: "node-pattern-simple"
    description: "Test simple node pattern matching"
    setup:
      - "query \"CREATE (a), (b), (c)\""
    args: ["query", "MATCH (n) RETURN count(n) AS node_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["node_count"]
      stdout_json_assert:
        - expression: "results[0].node_count"
          equals: 3
    tags: ["pattern-matching", "node", "simple"]

  - name: "node-pattern-with-variable"
    description: "Test node pattern with variable binding"
    setup:
      - "query \"CREATE (a {id: 1}), (b {id: 2})\""
    args: ["query", "MATCH (node) RETURN node.id AS id ORDER BY id"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 2
        columns: ["id"]
    tags: ["pattern-matching", "node", "variable"]

  - name: "node-pattern-with-label"
    description: "Test node pattern with label matching"
    setup:
      - "query \"CREATE (a:Person), (b:Person), (c:Company)\""
    args: ["query", "MATCH (n:Person) RETURN count(n) AS person_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["person_count"]
      stdout_json_assert:
        - expression: "results[0].person_count"
          equals: 2
    tags: ["pattern-matching", "node", "label"]

  - name: "node-pattern-with-properties"
    description: "Test node pattern with property matching"
    setup:
      - "query \"CREATE (a:User {name: 'Alice', age: 30}), (b:User {name: 'Bob', age: 25}), (c:User {name: 'Charlie', age: 30})\""
    args: ["query", "MATCH (n:User {age: 30}) RETURN count(n) AS age_30_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["age_30_count"]
      stdout_json_assert:
        - expression: "results[0].age_30_count"
          equals: 2
    tags: ["pattern-matching", "node", "properties"]

  - name: "node-pattern-multiple-labels"
    description: "Test node pattern with multiple labels"
    setup:
      - "query \"CREATE (a:Person:Employee), (b:Person), (c:Employee)\""
    args: ["query", "MATCH (n:Person:Employee) RETURN count(n) AS both_labels_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["both_labels_count"]
      stdout_json_assert:
        - expression: "results[0].both_labels_count"
          equals: 1
    tags: ["pattern-matching", "node", "multiple-labels"]

  # ===============================
  # BASIC RELATIONSHIP PATTERNS
  # ===============================
  
  - name: "relationship-pattern-simple"
    description: "Test simple relationship pattern matching"
    setup:
      - "query \"CREATE (a)-[:KNOWS]->(b), (c)-[:LIKES]->(d)\""
    args: ["query", "MATCH ()-[r]->() RETURN count(r) AS rel_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["rel_count"]
      stdout_json_assert:
        - expression: "results[0].rel_count"
          equals: 2
    tags: ["pattern-matching", "relationship", "simple"]

  - name: "relationship-pattern-with-type"
    description: "Test relationship pattern with type matching"
    setup:
      - "query \"CREATE (a)-[:KNOWS]->(b), (c)-[:KNOWS]->(d), (e)-[:LIKES]->(f)\""
    args: ["query", "MATCH ()-[r:KNOWS]->() RETURN count(r) AS knows_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["knows_count"]
      stdout_json_assert:
        - expression: "results[0].knows_count"
          equals: 2
    tags: ["pattern-matching", "relationship", "type"]

  - name: "relationship-pattern-with-properties"
    description: "Test relationship pattern with property matching"
    setup:
      - "query \"CREATE (a)-[:RATED {score: 5}]->(b), (c)-[:RATED {score: 3}]->(d), (e)-[:RATED {score: 5}]->(f)\""
    args: ["query", "MATCH ()-[r:RATED {score: 5}]->() RETURN count(r) AS high_rated_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["high_rated_count"]
      stdout_json_assert:
        - expression: "results[0].high_rated_count"
          equals: 2
    tags: ["pattern-matching", "relationship", "properties"]

  - name: "relationship-pattern-undirected"
    description: "Test undirected relationship pattern matching"
    setup:
      - "query \"CREATE (a)-[:CONNECTED]->(b), (c)-[:CONNECTED]->(d)\""
    args: ["query", "MATCH ()-[r:CONNECTED]-() RETURN count(r) AS connected_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["connected_count"]
      stdout_json_assert:
        - expression: "results[0].connected_count"
          equals: 4
    tags: ["pattern-matching", "relationship", "undirected"]

  - name: "relationship-pattern-reverse-direction"
    description: "Test reverse direction relationship pattern"
    setup:
      - "query \"CREATE (a {name: 'source'})-[:FLOWS_TO]->(b {name: 'target'})\""
    args: ["query", "MATCH (target)<-[:FLOWS_TO]-(source) RETURN source.name AS source_name, target.name AS target_name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["source_name", "target_name"]
      stdout_json_assert:
        - expression: "results[0].source_name"
          equals: "source"
        - expression: "results[0].target_name"
          equals: "target"
    tags: ["pattern-matching", "relationship", "reverse"]

  # ===============================
  # VARIABLE-LENGTH PATTERNS
  # ===============================
  
  - name: "variable-length-any"
    description: "Test variable-length pattern with any length (*)"
    setup:
      - "query \"CREATE (a)-[:NEXT]->(b)-[:NEXT]->(c)-[:NEXT]->(d)\""
    args: ["query", "MATCH (start)-[:NEXT*]->(end) RETURN count(*) AS path_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["path_count"]
      stdout_json_assert:
        - expression: "results[0].path_count"
          equals: 6
    tags: ["pattern-matching", "variable-length", "any"]

  - name: "variable-length-exact"
    description: "Test variable-length pattern with exact length"
    setup:
      - "query \"CREATE (a)-[:STEP]->(b)-[:STEP]->(c)-[:STEP]->(d)\""
    args: ["query", "MATCH (start)-[:STEP*2]->(end) RETURN count(*) AS two_step_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["two_step_count"]
      stdout_json_assert:
        - expression: "results[0].two_step_count"
          equals: 2
    tags: ["pattern-matching", "variable-length", "exact"]

  - name: "variable-length-range"
    description: "Test variable-length pattern with range (min..max)"
    setup:
      - "query \"CREATE (a)-[:LINK]->(b)-[:LINK]->(c)-[:LINK]->(d)-[:LINK]->(e)\""
    args: ["query", "MATCH (start)-[:LINK*2..3]->(end) RETURN count(*) AS range_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["range_count"]
      stdout_json_assert:
        - expression: "results[0].range_count"
          equals: 5
    tags: ["pattern-matching", "variable-length", "range"]

  - name: "variable-length-min-only"
    description: "Test variable-length pattern with minimum only (min..)"
    setup:
      - "query \"CREATE (a)-[:CHAIN]->(b)-[:CHAIN]->(c)-[:CHAIN]->(d)\""
    args: ["query", "MATCH (start)-[:CHAIN*2..]->(end) RETURN count(*) AS min_two_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["min_two_count"]
      stdout_json_assert:
        - expression: "results[0].min_two_count"
          equals: 4
    tags: ["pattern-matching", "variable-length", "min-only"]

  - name: "variable-length-max-only"
    description: "Test variable-length pattern with maximum only (..max)"
    setup:
      - "query \"CREATE (a)-[:PATH]->(b)-[:PATH]->(c)-[:PATH]->(d)\""
    args: ["query", "MATCH (start)-[:PATH*..2]->(end) RETURN count(*) AS max_two_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["max_two_count"]
      stdout_json_assert:
        - expression: "results[0].max_two_count"
          equals: 5
    tags: ["pattern-matching", "variable-length", "max-only"]

  # ===============================
  # PATH VARIABLES
  # ===============================
  
  - name: "path-variable-assignment"
    description: "Test path variable assignment"
    setup:
      - "query \"CREATE (a {name: 'start'})-[:CONNECTS]->(b {name: 'middle'})-[:CONNECTS]->(c {name: 'end'})\""
    args: ["query", "MATCH path = (a)-[:CONNECTS*2]->(c) RETURN length(path) AS path_length"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["path_length"]
      stdout_json_assert:
        - expression: "results[0].path_length"
          equals: 2
    tags: ["pattern-matching", "path-variable", "assignment"]

  - name: "path-variable-nodes"
    description: "Test accessing nodes from path variable"
    setup:
      - "query \"CREATE (a {id: 1})-[:TO]->(b {id: 2})-[:TO]->(c {id: 3})\""
    args: ["query", "MATCH path = (start)-[:TO*2]->(end) RETURN nodes(path)[0].id AS first_id, nodes(path)[2].id AS last_id"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["first_id", "last_id"]
      stdout_json_assert:
        - expression: "results[0].first_id"
          equals: 1
        - expression: "results[0].last_id"
          equals: 3
    tags: ["pattern-matching", "path-variable", "nodes"]

  - name: "path-variable-relationships"
    description: "Test accessing relationships from path variable"
    setup:
      - "query \"CREATE (a)-[:REL {weight: 1.0}]->(b)-[:REL {weight: 2.0}]->(c)\""
    args: ["query", "MATCH path = (a)-[:REL*2]->(c) RETURN relationships(path)[0].weight AS first_weight, relationships(path)[1].weight AS second_weight"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["first_weight", "second_weight"]
      stdout_json_assert:
        - expression: "results[0].first_weight"
          equals: 1.0
        - expression: "results[0].second_weight"
          equals: 2.0
    tags: ["pattern-matching", "path-variable", "relationships"]

  # ===============================
  # COMPLEX PATTERN COMBINATIONS
  # ===============================
  
  - name: "multiple-patterns-in-match"
    description: "Test multiple patterns in single MATCH clause"
    setup:
      - "query \"CREATE (a:Person {name: 'Alice'})-[:KNOWS]->(b:Person {name: 'Bob'}), (c:Person {name: 'Charlie'})-[:LIKES]->(d:Item {name: 'coffee'})\""
    args: ["query", "MATCH (p1:Person)-[:KNOWS]->(p2:Person), (p3:Person)-[:LIKES]->(i:Item) RETURN count(*) AS pattern_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["pattern_count"]
      stdout_json_assert:
        - expression: "results[0].pattern_count"
          equals: 1
    tags: ["pattern-matching", "complex", "multiple-patterns"]

  - name: "connected-patterns"
    description: "Test connected patterns sharing variables"
    setup:
      - "query \"CREATE (a:User {name: 'Alice'})-[:OWNS]->(b:Car {model: 'Toyota'}), (a)-[:LIVES_IN]->(c:City {name: 'Boston'})\""
    args: ["query", "MATCH (u:User)-[:OWNS]->(car:Car), (u)-[:LIVES_IN]->(city:City) RETURN u.name AS user_name, car.model AS car_model, city.name AS city_name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["user_name", "car_model", "city_name"]
      stdout_json_assert:
        - expression: "results[0].user_name"
          equals: "Alice"
        - expression: "results[0].car_model"
          equals: "Toyota"
        - expression: "results[0].city_name"
          equals: "Boston"
    tags: ["pattern-matching", "complex", "connected"]

  - name: "triangular-pattern"
    description: "Test triangular pattern (A->B->C->A)"
    setup:
      - "query \"CREATE (a {name: 'A'})-[:EDGE]->(b {name: 'B'})-[:EDGE]->(c {name: 'C'})-[:EDGE]->(a)\""
    args: ["query", "MATCH (a)-[:EDGE]->(b)-[:EDGE]->(c)-[:EDGE]->(a) RETURN a.name AS node_a, b.name AS node_b, c.name AS node_c"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["node_a", "node_b", "node_c"]
      stdout_json_assert:
        - expression: "results[0].node_a"
          equals: "A"
        - expression: "results[0].node_b"
          equals: "B"
        - expression: "results[0].node_c"
          equals: "C"
    tags: ["pattern-matching", "complex", "triangular"]

  # ===============================
  # PATTERN FILTERS AND WHERE
  # ===============================
  
  - name: "pattern-with-where-clause"
    description: "Test pattern matching with WHERE clause"
    setup:
      - "query \"CREATE (a:Product {name: 'Laptop', price: 1000}), (b:Product {name: 'Mouse', price: 25}), (c:Product {name: 'Keyboard', price: 75})\""
    args: ["query", "MATCH (p:Product) WHERE p.price > 50 RETURN p.name AS expensive_product ORDER BY p.price"]
    expect:
      exit_code: 0
      geode_query:
        min_rows: 2
        columns: ["expensive_product"]
    tags: ["pattern-matching", "filter", "where"]

  - name: "pattern-with-relationship-filter"
    description: "Test pattern matching with relationship property filter"
    setup:
      - "query \"CREATE (a)-[:RATED {score: 9}]->(b), (c)-[:RATED {score: 3}]->(d), (e)-[:RATED {score: 8}]->(f)\""
    args: ["query", "MATCH ()-[r:RATED]->() WHERE r.score >= 8 RETURN count(r) AS high_ratings"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["high_ratings"]
      stdout_json_assert:
        - expression: "results[0].high_ratings"
          equals: 2
    tags: ["pattern-matching", "filter", "relationship"]

  - name: "pattern-with-path-length-filter"
    description: "Test pattern matching with path length filter"
    setup:
      - "query \"CREATE (a)-[:STEP]->(b)-[:STEP]->(c)-[:STEP]->(d)-[:STEP]->(e)\""
    args: ["query", "MATCH path = (start)-[:STEP*]->(end) WHERE length(path) = 3 RETURN count(path) AS three_step_paths"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["three_step_paths"]
      stdout_json_assert:
        - expression: "results[0].three_step_paths"
          equals: 2
    tags: ["pattern-matching", "filter", "path-length"]

  # ===============================
  # OPTIONAL PATTERNS
  # ===============================
  
  - name: "optional-match-basic"
    description: "Test basic OPTIONAL MATCH pattern"
    setup:
      - "query \"CREATE (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'})-[:HAS_EMAIL]->(e:Email {address: 'bob@example.com'})\""
    args: ["query", "MATCH (p:Person) OPTIONAL MATCH (p)-[:HAS_EMAIL]->(email:Email) RETURN p.name AS name, email.address AS email_address ORDER BY name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 2
        columns: ["name", "email_address"]
    tags: ["pattern-matching", "optional", "basic"]

  - name: "optional-match-with-where"
    description: "Test OPTIONAL MATCH with WHERE clause"
    setup:
      - "query \"CREATE (a:User {name: 'Alice', age: 25}), (b:User {name: 'Bob', age: 35})-[:OWNS]->(c:Car {brand: 'Toyota'})\""
    args: ["query", "MATCH (u:User) OPTIONAL MATCH (u)-[:OWNS]->(car:Car) WHERE u.age > 30 RETURN u.name AS name, car.brand AS car_brand ORDER BY name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 2
        columns: ["name", "car_brand"]
    tags: ["pattern-matching", "optional", "where"]

  # ===============================
  # PATTERN COMPREHENSIONS
  # ===============================
  
  - name: "pattern-in-list-comprehension"
    description: "Test pattern within list comprehension"
    setup:
      - "query \"CREATE (a:Person {name: 'Alice'})-[:KNOWS]->(b:Person {name: 'Bob'}), (a)-[:KNOWS]->(c:Person {name: 'Charlie'})\""
    args: ["query", "MATCH (p:Person {name: 'Alice'}) RETURN [(p)-[:KNOWS]->(friend) | friend.name] AS friends"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["friends"]
    tags: ["pattern-matching", "comprehension", "list"]

  # ===============================
  # EDGE CASES AND ERRORS
  # ===============================
  
  - name: "pattern-no-matches"
    description: "Test pattern matching with no results"
    setup:
      - "query \"CREATE (a:TypeA), (b:TypeB)\""
    args: ["query", "MATCH (n:TypeC) RETURN count(n) AS count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["count"]
      stdout_json_assert:
        - expression: "results[0].count"
          equals: 0
    tags: ["pattern-matching", "edge-case", "no-matches"]

  - name: "pattern-variable-reuse"
    description: "Test reusing pattern variables"
    setup:
      - "query \"CREATE (a {name: 'self'})-[:REFLEXIVE]->(a)\""
    args: ["query", "MATCH (n)-[:REFLEXIVE]->(n) RETURN n.name AS self_referencing"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["self_referencing"]
      stdout_json_assert:
        - expression: "results[0].self_referencing"
          equals: "self"
    tags: ["pattern-matching", "edge-case", "variable-reuse"]

  - name: "pattern-invalid-variable-length"
    description: "Test invalid variable-length pattern (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    args: ["query", "MATCH (a)-[:REL*0]->(b) RETURN a, b"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "42000"  # Syntax error
    tags: ["pattern-matching", "error", "invalid-variable-length"]

  # ===============================
  # PERFORMANCE TESTS
  # ===============================
  
  - name: "pattern-performance-large-graph"
    description: "Performance test with larger graph pattern matching"
    timeout_ms: 30000
    setup:
      - "query \"CREATE (n1:Node {id: 1}), (n2:Node {id: 2}), (n3:Node {id: 3}), (n4:Node {id: 4}), (n5:Node {id: 5})\""
      - "query \"MATCH (a:Node), (b:Node) WHERE a.id < b.id CREATE (a)-[:CONNECTS]->(b)\""
    args: ["query", "MATCH (a:Node)-[:CONNECTS*2]->(c:Node) RETURN count(*) AS two_hop_paths"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["two_hop_paths"]
    tags: ["pattern-matching", "performance", "large-graph"]

  # ===============================
  # CLEANUP
  # ===============================
  
  - name: "cleanup-pattern-test-data"
    description: "Clean up all test data created during pattern matching tests"
    args:
      - "query"
      - "MATCH (n) DETACH DELETE n"
    expect:
      exit_code: 0
    tags: ["cleanup", "pattern-matching"]

invariants:
  - type: "server_running"

tags: ["pattern-matching", "graph-patterns", "paths", "relationships", "iso-gql", "comprehensive"]
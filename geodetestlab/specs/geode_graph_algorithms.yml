name: geode-graph-algorithms
description: "Comprehensive test suite for graph algorithms and traversals"

tests:
  # Path Finding Algorithms
  - name: shortest-path-simple
    args: ["query", "--no-quic", "CREATE (a:Node {name: 'A'})-[:EDGE {weight: 1}]->(b:Node {name: 'B'})-[:EDGE {weight: 2}]->(c:Node {name: 'C'}), (a)-[:EDGE {weight: 5}]->(c) WITH a, c MATCH p = shortestPath((a)-[*]-(c)) RETURN length(p)", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["2"]

  - name: all-shortest-paths
    args: ["query", "--no-quic", "MATCH (a:Node {name: 'A'}), (c:Node {name: 'C'}), p = allShortestPaths((a)-[*]-(c)) RETURN count(p)", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["count"]

  - name: dijkstra-weighted-path
    args: ["query", "--no-quic", "MATCH (start:Node {name: 'A'}), (end:Node {name: 'C'}) CALL algo.shortestPath.dijkstra(start, end, 'weight') YIELD path, cost RETURN cost", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["3"]

  # Variable Length Patterns
  - name: variable-length-basic
    args: ["query", "--no-quic", "MATCH p = (:Node {name: 'A'})-[*1..3]->(:Node) RETURN length(p)", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["length"]

  - name: variable-length-with-filter
    args: ["query", "--no-quic", "MATCH p = (:Node {name: 'A'})-[r:EDGE*1..5]->(:Node) WHERE all(x IN r WHERE x.weight < 3) RETURN length(p)", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["length"]

  - name: variable-length-unlimited
    args: ["query", "--no-quic", "MATCH p = (:Node {name: 'A'})-[*]->(:Node {name: 'C'}) RETURN length(p) ORDER BY length(p) LIMIT 1", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["length"]

  # Graph Centrality Algorithms
  - name: degree-centrality
    args: ["query", "--no-quic", "MATCH (n:Node) RETURN n.name, size((n)--()) AS degree ORDER BY degree DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["degree"]

  - name: betweenness-centrality
    args: ["query", "--no-quic", "CALL algo.betweenness.stream() YIELD nodeId, centrality RETURN algo.asNode(nodeId).name AS node, centrality ORDER BY centrality DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["centrality"]

  - name: closeness-centrality
    args: ["query", "--no-quic", "CALL algo.closeness.stream() YIELD nodeId, centrality RETURN algo.asNode(nodeId).name AS node, centrality ORDER BY centrality DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["centrality"]

  - name: pagerank
    args: ["query", "--no-quic", "CALL algo.pageRank.stream({iterations: 20, dampingFactor: 0.85}) YIELD nodeId, score RETURN algo.asNode(nodeId).name AS node, score ORDER BY score DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["score"]

  # Community Detection
  - name: louvain-modularity
    args: ["query", "--no-quic", "CALL algo.louvain.stream() YIELD nodeId, community RETURN community, count(*) AS size ORDER BY size DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["community", "size"]

  - name: label-propagation
    args: ["query", "--no-quic", "CALL algo.labelPropagation.stream() YIELD nodeId, label RETURN label, count(*) AS size ORDER BY size DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["label", "size"]

  - name: connected-components
    args: ["query", "--no-quic", "CALL algo.unionFind.stream() YIELD nodeId, setId RETURN setId AS component, count(*) AS size ORDER BY size DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["component", "size"]

  - name: strongly-connected-components
    args: ["query", "--no-quic", "CALL algo.scc.stream() YIELD nodeId, partition RETURN partition, count(*) AS size ORDER BY size DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["partition", "size"]

  # Graph Traversals
  - name: breadth-first-search
    args: ["query", "--no-quic", "MATCH (start:Node {name: 'A'}) CALL algo.bfs.stream(start, {maxDepth: 3}) YIELD path RETURN length(path) AS depth, count(*) AS count GROUP BY depth ORDER BY depth", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["depth", "count"]

  - name: depth-first-search
    args: ["query", "--no-quic", "MATCH (start:Node {name: 'A'}) CALL algo.dfs.stream(start, {maxDepth: 3}) YIELD path RETURN length(path) AS depth, count(*) AS count GROUP BY depth ORDER BY depth", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["depth", "count"]

  # Cycle Detection
  - name: detect-cycles
    args: ["query", "--no-quic", "MATCH p = (n)-[*]-(n) WHERE length(p) > 0 RETURN p LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["p"]

  - name: find-triangles
    args: ["query", "--no-quic", "MATCH (a)-[:EDGE]-(b)-[:EDGE]-(c)-[:EDGE]-(a) WHERE id(a) < id(b) < id(c) RETURN count(*) AS triangles", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["triangles"]

  # Similarity Algorithms
  - name: jaccard-similarity
    args: ["query", "--no-quic", "MATCH (a:Node), (b:Node) WHERE a <> b WITH a, b, algo.similarity.jaccard([(a)--()], [(b)--()])  AS similarity WHERE similarity > 0.5 RETURN a.name, b.name, similarity ORDER BY similarity DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["similarity"]

  - name: cosine-similarity
    args: ["query", "--no-quic", "MATCH (a:Node), (b:Node) WHERE a <> b AND a.vector IS NOT NULL AND b.vector IS NOT NULL RETURN a.name, b.name, algo.similarity.cosine(a.vector, b.vector) AS similarity ORDER BY similarity DESC LIMIT 5", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["similarity"]

  # Graph Statistics
  - name: graph-density
    args: ["query", "--no-quic", "MATCH (n) WITH count(n) AS nodes MATCH ()-[r]->() WITH nodes, count(r) AS edges RETURN toFloat(edges) / (nodes * (nodes - 1)) AS density", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["density"]

  - name: average-path-length
    args: ["query", "--no-quic", "MATCH p = shortestPath((a)-[*]-(b)) WHERE a <> b WITH length(p) AS len RETURN avg(len) AS avgPathLength", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["avgPathLength"]

  - name: clustering-coefficient
    args: ["query", "--no-quic", "MATCH (n) WITH n, size((n)--()) AS degree MATCH (n)--(neighbor1)--(neighbor2)--(n) WHERE neighbor1 <> neighbor2 WITH n, degree, count(DISTINCT [neighbor1, neighbor2]) AS triangles RETURN avg(CASE WHEN degree > 1 THEN 2.0 * triangles / (degree * (degree - 1)) ELSE 0 END) AS clusteringCoeff", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["clusteringCoeff"]

  # Minimum Spanning Tree
  - name: minimum-spanning-tree
    args: ["query", "--no-quic", "CALL algo.spanningTree.minimum('Node', 'EDGE', 'weight') YIELD effectiveNodeCount RETURN effectiveNodeCount", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["effectiveNodeCount"]

  # Max Flow
  - name: max-flow
    args: ["query", "--no-quic", "MATCH (source:Node {name: 'A'}), (sink:Node {name: 'C'}) CALL algo.maxFlow(source, sink, 'capacity') YIELD maxFlow RETURN maxFlow", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["maxFlow"]

  # Graph Matching
  - name: subgraph-isomorphism
    args: ["query", "--no-quic", "MATCH pattern = (:Node)-[:EDGE]->(:Node)-[:EDGE]->(:Node) WITH pattern MATCH graph = (:Node)-[*2]->(:Node) WHERE nodes(pattern) = nodes(graph) RETURN count(graph)", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["count"]

  # Temporal Graph Queries
  - name: temporal-path-within-timeframe
    args: ["query", "--no-quic", "MATCH p = (a)-[r*]->(b) WHERE all(rel IN r WHERE rel.timestamp >= datetime('2024-01-01') AND rel.timestamp <= datetime('2024-12-31')) RETURN length(p)", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["length"]

  - name: evolving-graph-snapshot
    args: ["query", "--no-quic", "MATCH (n)-[r]-(m) WHERE r.validFrom <= datetime('2024-06-01') AND (r.validTo IS NULL OR r.validTo > datetime('2024-06-01')) RETURN count(DISTINCT n) AS activeNodes", "--format", "json"]
    expect:
      exit_code: 0
      stdout_contains: ["activeNodes"]
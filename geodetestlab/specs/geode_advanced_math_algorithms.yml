name: "Geode Advanced Math and Graph Algorithms"
description: "Advanced mathematical functions, graph algorithms, and complex query patterns"
version: "1.0.0"
provider: "cli"

setup:
  - command: "query"
    args: ["-"]
    stdin: |
      CREATE SCHEMA IF NOT EXISTS test_algorithms_schema;
      USE test_algorithms_schema;
      CREATE NODE City {name: STRING, population: INTEGER, lat: DOUBLE, lon: DOUBLE};
      CREATE NODE Person {name: STRING, age: INTEGER, income: DECIMAL(12,2)};
      CREATE EDGE ROAD {distance: DOUBLE, travel_time: INTEGER};
      CREATE EDGE KNOWS {since: DATE, strength: DOUBLE};
    expected_output:
      contains: []

tests:
  # Advanced Math Functions
  - name: "ATAN2 Function"
    command: "query"
    args: ["RETURN atan2(1, 1) AS result"]
    expected_output:
      contains:
        - "0.785"  # approximately PI/4
  
  - name: "ASIN Function"
    command: "query"
    args: ["RETURN asin(0.5) AS result"]
    expected_output:
      contains:
        - "0.523"  # approximately PI/6
  
  - name: "ACOS Function"
    command: "query"
    args: ["RETURN acos(0.5) AS result"]
    expected_output:
      contains:
        - "1.047"  # approximately PI/3
  
  - name: "ATAN Function"
    command: "query"
    args: ["RETURN atan(1) AS result"]
    expected_output:
      contains:
        - "0.785"  # approximately PI/4
  
  - name: "DEGREES Function"
    command: "query"
    args: ["RETURN degrees(3.14159) AS result"]
    expected_output:
      contains:
        - "180"
  
  - name: "RADIANS Function"
    command: "query"
    args: ["RETURN radians(180) AS result"]
    expected_output:
      contains:
        - "3.14"
  
  - name: "SIGN Function"
    command: "query"
    args: ["RETURN sign(-42) AS neg, sign(0) AS zero, sign(42) AS pos"]
    expected_output:
      contains:
        - "-1"
        - "0"
        - "1"
  
  - name: "MOD Function"
    command: "query"
    args: ["RETURN mod(10, 3) AS result"]
    expected_output:
      contains:
        - "1"
  
  # Statistical Functions
  - name: "STDDEV Function"
    command: "query"
    args: ["-"]
    stdin: |
      CREATE (p1:Person {name: 'Alice', income: 50000.00})
      CREATE (p2:Person {name: 'Bob', income: 60000.00})
      CREATE (p3:Person {name: 'Charlie', income: 70000.00})
      MATCH (p:Person) RETURN stddev(p.income) AS std_deviation
    expected_output:
      contains:
        - "10000"  # Standard deviation
  
  - name: "VARIANCE Function"
    command: "query"
    args: ["MATCH (p:Person) RETURN variance(p.income) AS variance"]
    expected_output:
      contains:
        - "100000000"  # Variance
  
  # Graph Setup for Algorithms
  - name: "Create Graph for Algorithms"
    command: "query"
    args: ["-"]
    stdin: |
      CREATE (ny:City {name: 'New York', population: 8000000, lat: 40.7128, lon: -74.0060})
      CREATE (la:City {name: 'Los Angeles', population: 4000000, lat: 34.0522, lon: -118.2437})
      CREATE (chi:City {name: 'Chicago', population: 2700000, lat: 41.8781, lon: -87.6298})
      CREATE (hou:City {name: 'Houston', population: 2300000, lat: 29.7604, lon: -95.3698})
      CREATE (phx:City {name: 'Phoenix', population: 1700000, lat: 33.4484, lon: -112.0740})
      
      MATCH (ny:City {name: 'New York'}), (chi:City {name: 'Chicago'})
      CREATE (ny)-[:ROAD {distance: 790, travel_time: 12}]->(chi)
      
      MATCH (chi:City {name: 'Chicago'}), (la:City {name: 'Los Angeles'})
      CREATE (chi)-[:ROAD {distance: 2015, travel_time: 30}]->(la)
      
      MATCH (ny:City {name: 'New York'}), (hou:City {name: 'Houston'})
      CREATE (ny)-[:ROAD {distance: 1628, travel_time: 24}]->(hou)
      
      MATCH (hou:City {name: 'Houston'}), (la:City {name: 'Los Angeles'})
      CREATE (hou)-[:ROAD {distance: 1556, travel_time: 22}]->(la)
      
      MATCH (chi:City {name: 'Chicago'}), (phx:City {name: 'Phoenix'})
      CREATE (chi)-[:ROAD {distance: 1745, travel_time: 25}]->(phx)
      
      MATCH (phx:City {name: 'Phoenix'}), (la:City {name: 'Los Angeles'})
      CREATE (phx)-[:ROAD {distance: 372, travel_time: 6}]->(la)
    expected_output:
      contains: []
  
  # Graph Algorithm Functions
  - name: "Degree Centrality Calculation"
    command: "query"
    args: ["MATCH (c:City)-[r:ROAD]-() RETURN c.name, count(r) AS degree GROUP BY c.name ORDER BY degree DESC LIMIT 3"]
    expected_output:
      contains:
        - "Los Angeles"
        - "3"
  
  - name: "Shortest Path Length"
    command: "query"
    args: ["MATCH p = shortestPath((ny:City {name: 'New York'})-[:ROAD*]-(la:City {name: 'Los Angeles'})) RETURN length(p) AS path_length"]
    expected_output:
      contains:
        - "2"
  
  - name: "All Paths with Distance Sum"
    command: "query"
    args: ["MATCH p = (ny:City {name: 'New York'})-[:ROAD*1..3]-(la:City {name: 'Los Angeles'}) RETURN length(p) AS hops, reduce(s = 0, r IN relationships(p) | s + r.distance) AS total_distance ORDER BY total_distance"]
    expected_output:
      contains:
        - "3184"  # NY->HOU->LA path
  
  # Geographic Functions
  - name: "Haversine Distance Calculation"
    command: "query"
    args: ["MATCH (ny:City {name: 'New York'}), (la:City {name: 'Los Angeles'}) RETURN 2 * 6371 * asin(sqrt(pow(sin(radians((la.lat - ny.lat) / 2)), 2) + cos(radians(ny.lat)) * cos(radians(la.lat)) * pow(sin(radians((la.lon - ny.lon) / 2)), 2))) AS distance_km"]
    expected_output:
      contains:
        - "3935"  # Approximate distance in km
  
  # Social Network Analysis
  - name: "Create Social Network"
    command: "query"
    args: ["-"]
    stdin: |
      CREATE (alice:Person {name: 'Alice', age: 30})
      CREATE (bob:Person {name: 'Bob', age: 25})
      CREATE (charlie:Person {name: 'Charlie', age: 35})
      CREATE (diana:Person {name: 'Diana', age: 28})
      CREATE (eve:Person {name: 'Eve', age: 32})
      
      MATCH (alice:Person {name: 'Alice'}), (bob:Person {name: 'Bob'})
      CREATE (alice)-[:KNOWS {since: DATE '2020-01-01', strength: 0.9}]->(bob)
      
      MATCH (bob:Person {name: 'Bob'}), (charlie:Person {name: 'Charlie'})
      CREATE (bob)-[:KNOWS {since: DATE '2019-06-15', strength: 0.7}]->(charlie)
      
      MATCH (alice:Person {name: 'Alice'}), (diana:Person {name: 'Diana'})
      CREATE (alice)-[:KNOWS {since: DATE '2021-03-20', strength: 0.8}]->(diana)
      
      MATCH (diana:Person {name: 'Diana'}), (eve:Person {name: 'Eve'})
      CREATE (diana)-[:KNOWS {since: DATE '2022-01-10', strength: 0.6}]->(eve)
      
      MATCH (charlie:Person {name: 'Charlie'}), (eve:Person {name: 'Eve'})
      CREATE (charlie)-[:KNOWS {since: DATE '2020-11-30', strength: 0.5}]->(eve)
    expected_output:
      contains: []
  
  - name: "Common Neighbors"
    command: "query"
    args: ["MATCH (alice:Person {name: 'Alice'})-[:KNOWS]->(common)<-[:KNOWS]-(charlie:Person {name: 'Charlie'}) RETURN common.name"]
    expected_output:
      contains:
        - "Bob"
  
  - name: "Clustering Coefficient"
    command: "query"
    args: ["MATCH (p:Person)-[:KNOWS]-(neighbor) WITH p, count(DISTINCT neighbor) AS degree MATCH (p)-[:KNOWS]-(n1)-[:KNOWS]-(n2) WHERE n1 <> n2 AND (n1)-[:KNOWS]-(n2) WITH p, degree, count(DISTINCT [n1, n2]) AS triangles RETURN p.name, 2.0 * triangles / (degree * (degree - 1)) AS clustering_coefficient WHERE degree > 1"]
    expected_output:
      pattern: "\\d+\\.\\d+"
  
  # PageRank Simulation (simplified)
  - name: "PageRank Initialization"
    command: "query"
    args: ["MATCH (p:Person) SET p.pagerank = 1.0 / 5.0 RETURN count(p) AS initialized"]
    expected_output:
      contains:
        - "5"
  
  - name: "PageRank Iteration"
    command: "query"
    args: ["MATCH (p:Person)-[:KNOWS]->(neighbor) WITH neighbor, sum(p.pagerank / count{(p)-[:KNOWS]->()}) AS rank_contribution SET neighbor.pagerank = 0.15 / 5.0 + 0.85 * rank_contribution RETURN count(DISTINCT neighbor) AS updated"]
    expected_output:
      pattern: "\\d+"
  
  # Complex Mathematical Expressions
  # REMOVED: Fibonacci Calculation test - uses UNWIND which is not in ISO/IEC 39075:2024 GQL
  # Original: WITH [0, 1] AS fib UNWIND range(2, 10) AS i WITH fib + [fib[i-1] + fib[i-2]] AS fib RETURN fib[10] AS fibonacci_10
  # UNWIND and range() are Cypher-specific, not GQL-compliant
  
  - name: "Factorial Using Reduce"
    command: "query"
    args: ["WITH range(1, 5) AS nums RETURN reduce(fact = 1, n IN nums | fact * n) AS factorial_5"]
    expected_output:
      contains:
        - "120"
  
  - name: "Prime Number Check"
    command: "query"
    args: ["WITH 17 AS n RETURN n AS number, CASE WHEN n <= 1 THEN false WHEN n = 2 THEN true ELSE NOT any(x IN range(2, sqrt(n)) WHERE n % x = 0) END AS is_prime"]
    expected_output:
      contains:
        - "17"
        - "true"
  
  # Advanced Aggregations
  - name: "Percentile Calculation"
    command: "query"
    args: ["MATCH (c:City) RETURN percentile(c.population, 0.5) AS median_population"]
    expected_output:
      contains:
        - "2700000"
  
  - name: "Collect with Distinct"
    command: "query"
    args: ["MATCH (c:City)-[:ROAD]->(dest:City) RETURN c.name, collect(DISTINCT dest.name) AS destinations ORDER BY c.name"]
    expected_output:
      contains:
        - "New York"
        - "Chicago"
        - "Houston"
  
  # Window Functions (if supported)
  - name: "Rank Cities by Population"
    command: "query"
    args: ["MATCH (c:City) RETURN c.name, c.population, rank() OVER (ORDER BY c.population DESC) AS rank"]
    expected_output:
      contains:
        - "New York"
        - "1"
  
  - name: "Running Total"
    command: "query"
    args: ["MATCH (c:City) WITH c ORDER BY c.population DESC RETURN c.name, c.population, sum(c.population) OVER (ORDER BY c.population DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total"]
    expected_output:
      pattern: "\\d+"
  
  # Error Cases for Math Functions
  - name: "ASIN Out of Range"
    command: "query"
    args: ["RETURN asin(2) AS result"]
    expected_error:
      contains:
        - "error"
  
  - name: "LOG of Negative"
    command: "query"
    args: ["RETURN log(-1) AS result"]
    expected_error:
      contains:
        - "error"
  
  - name: "Division in MOD by Zero"
    command: "query"
    args: ["RETURN mod(10, 0) AS result"]
    expected_error:
      contains:
        - "error"

cleanup:
  - command: "query"
    args: ["-"]
    stdin: "DROP SCHEMA test_algorithms_schema CASCADE;"
    expected_output:
      contains: []
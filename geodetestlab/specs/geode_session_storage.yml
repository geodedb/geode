version: "1.0"
name: "Geode Session Storage Tests"
description: "Comprehensive testing of Geode's token-based session storage system with local credential management"

cli:
  binary: "/home/benji/src/spyder/geode/zig-out/bin/geode"
  server:
    enabled: false  # Session tests use --no-quic mode
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
  client:
    timeout_ms: 10000
    format: "json"

invariants:
  - type: "exit_code"
    equals: 0

tests:
  - name: "auth-login-help"
    description: "Display auth login help"
    cmd: ["auth", "login", "--help"]
    expect:
      exit_code: 0
      stderr_contains: ["--save-session"]

  - name: "auth-login-save-session"
    description: "Login with --save-session flag creates credentials file"
    setup:
      - cmd: ["auth", "logout"]  # Clear any existing session
        ignore_failure: true
    cmd: ["auth", "login", "-U", "session_test_alice", "-P", "testpass123", "--save-session"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Login successful"
        - "Session token saved to ~/.geode/credentials.json"
        - "Token expires in 1 hour"
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "auth-login-without-save-session"
    description: "Login without --save-session displays token but doesn't save"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
    cmd: ["auth", "login", "-U", "session_test_bob", "-P", "testpass456"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Login successful"
        - "Session token:"
        - "Use --save-session to save credentials locally"
      stdout_not_contains:
        - "saved to ~/.geode/credentials.json"

  - name: "auth-logout-success"
    description: "Logout clears saved credentials"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "logout_test_user", "-P", "testpass789", "--save-session"]
    cmd: ["auth", "logout"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Logout successful"
        - "Credentials cleared from ~/.geode/credentials.json"

  - name: "query-auto-load-session"
    description: "Query command auto-loads saved session credentials"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "autoload_test_user", "-P", "autoloadpass", "--save-session"]
    cmd: ["query", "--no-quic", "RETURN 'auto-loaded-session' AS session_test"]
    expect:
      exit_code: 0
      stdout_contains:
        - "auto-loaded-session"
        - "session_test"
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "query-no-saved-session-flag"
    description: "Query with --no-saved-session ignores saved credentials"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "nosave_test_user", "-P", "nosavepass", "--save-session"]
    cmd: ["query", "--no-quic", "--no-saved-session", "RETURN 'no-session-flag' AS test"]
    expect:
      exit_code: 0
      stdout_contains:
        - "no-session-flag"
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "query-without-session"
    description: "Query works in --no-quic mode without any session"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
    cmd: ["query", "--no-quic", "RETURN 42 AS answer"]
    expect:
      exit_code: 0
      stdout_contains:
        - "42"
        - "answer"

  - name: "session-token-format"
    description: "Session token is 64 hex characters"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
    cmd: ["auth", "login", "-U", "token_format_user", "-P", "tokenpass"]
    expect:
      exit_code: 0
      stdout_regex: "Session token: [0-9a-f]{64}"

  - name: "session-file-permissions"
    description: "Credentials file has restrictive 600 permissions"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "perms_user", "-P", "permspass", "--save-session"]
    cmd: ["bash", "-c", "stat -c %a ~/.geode/credentials.json"]
    expect:
      exit_code: 0
      stdout_contains: ["600"]
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "session-system-fingerprint-binding"
    description: "Session tokens are bound to system fingerprint"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "fingerprint_user", "-P", "fppass", "--save-session"]
    cmd: ["bash", "-c", "cat ~/.geode/credentials.json | grep system_fingerprint"]
    expect:
      exit_code: 0
      stdout_regex: "system_fingerprint.*:.*:"  # Should match hostname:username:uid format
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "session-multiple-logins"
    description: "Multiple logins overwrite previous session"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "first_user", "-P", "firstpass", "--save-session"]
    cmd: ["auth", "login", "-U", "second_user", "-P", "secondpass", "--save-session"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Login successful for user 'second_user'"
    verify:
      - cmd: ["bash", "-c", "cat ~/.geode/credentials.json | grep username"]
        expect:
          stdout_contains: ["second_user"]
          stdout_not_contains: ["first_user"]
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "session-credentials-json-structure"
    description: "Credentials file contains required JSON fields"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
      - cmd: ["auth", "login", "-U", "json_test_user", "-P", "jsonpass", "--save-session"]
    cmd: ["bash", "-c", "cat ~/.geode/credentials.json"]
    expect:
      exit_code: 0
      stdout_contains:
        - '"token":'
        - '"username":'
        - '"server":'
        - '"created_at":'
        - '"system_fingerprint":'
    cleanup:
      - cmd: ["auth", "logout"]

  - name: "session-logout-nonexistent-session"
    description: "Logout succeeds even without saved session"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
    cmd: ["auth", "logout"]
    expect:
      exit_code: 0

  - name: "session-token-crypto-random"
    description: "Multiple sessions generate different tokens"
    setup:
      - cmd: ["auth", "logout"]
        ignore_failure: true
    tests:
      - cmd: ["auth", "login", "-U", "random_test_1", "-P", "pass1"]
        save_output: "token1"
      - cmd: ["auth", "login", "-U", "random_test_2", "-P", "pass2"]
        save_output: "token2"
    expect:
      outputs_not_equal: ["token1", "token2"]

statistics:
  track:
    - "exit_code"
    - "execution_time_ms"
    - "stdout_length"
    - "stderr_length"

fuzz:
  enabled: false  # Session storage is deterministic, not suitable for fuzzing

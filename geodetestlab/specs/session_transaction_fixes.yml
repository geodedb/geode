---
# Test specification for SESSION and TRANSACTION command fixes
# These tests verify the implementation of session management and transaction control

tests:
  # SESSION SET TIME ZONE tests
  - name: session-set-timezone-utc
    description: Test SESSION SET TIME ZONE with UTC string literal
    args:
      - query
      - --no-quic
      - "SESSION SET TIME ZONE 'UTC'"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, timezone, fixed]

  - name: session-set-timezone-local
    description: Test SESSION SET TIME ZONE with LOCAL keyword
    args:
      - query
      - --no-quic
      - "SESSION SET TIME ZONE LOCAL"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, timezone, fixed]

  - name: session-set-timezone-offset
    description: Test SESSION SET TIME ZONE with offset
    args:
      - query
      - --no-quic
      - "SESSION SET TIME ZONE '+00:00'"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, timezone, fixed]

  # SESSION SET SCHEMA tests
  - name: session-set-schema
    description: Test SESSION SET SCHEMA command
    args:
      - query
      - --no-quic
      - "SESSION SET SCHEMA test_schema"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, schema, fixed]

  # SESSION SET PROPERTY GRAPH tests
  - name: session-set-graph-g1
    description: Test SESSION SET PROPERTY GRAPH with G1
    args:
      - query
      - --no-quic
      - "SESSION SET PROPERTY GRAPH G1"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, graph, fixed]

  - name: session-set-graph-g2
    description: Test SESSION SET PROPERTY GRAPH with G2
    args:
      - query
      - --no-quic
      - "SESSION SET PROPERTY GRAPH G2"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, graph, fixed]

  - name: session-set-graph-custom
    description: Test SESSION SET PROPERTY GRAPH with custom graph name
    args:
      - query
      - --no-quic
      - "SESSION SET PROPERTY GRAPH CustomGraph"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, graph, fixed]

  # SESSION RESET tests
  - name: session-reset-no-args
    description: Test SESSION RESET without arguments (resets all)
    args:
      - query
      - --no-quic
      - "SESSION RESET"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, reset, fixed]

  - name: session-reset-after-set
    description: Test SESSION RESET after SESSION SET
    setup:
      - query
      - --no-quic
      - "SESSION SET TIME ZONE 'UTC'"
    args:
      - query
      - --no-quic
      - "SESSION RESET"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, reset, fixed]

  # SESSION CLOSE tests
  - name: session-close
    description: Test SESSION CLOSE command
    args:
      - query
      - --no-quic
      - "SESSION CLOSE"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [session, close, fixed]

  # Transaction control tests
  - name: start-transaction
    description: Test START TRANSACTION command
    args:
      - query
      - --no-quic
      - "START TRANSACTION"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [transaction, start, fixed]

  - name: commit-transaction
    description: Test COMMIT command
    args:
      - query
      - --no-quic
      - "COMMIT"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [transaction, commit, fixed]

  - name: rollback-transaction
    description: Test ROLLBACK command
    args:
      - query
      - --no-quic
      - "ROLLBACK"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [transaction, rollback, fixed]

  - name: transaction-basic-flow
    description: Test basic transaction flow START -> operation -> COMMIT
    args:
      - query
      - --no-quic
      - "START TRANSACTION; CREATE (n:TestNode {id: 1}); COMMIT"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [transaction, flow, fixed]

  - name: transaction-rollback-flow
    description: Test transaction rollback flow START -> operation -> ROLLBACK
    args:
      - query
      - --no-quic
      - "START TRANSACTION; CREATE (n:TestNode {id: 2}); ROLLBACK"
    expect:
      exit_code: 0
      stdout_contains: '{"status_class":"00000"'
    tags: [transaction, rollback-flow, fixed]

  # Combined SESSION and TRANSACTION tests
  - name: session-and-transaction-combined
    description: Test SESSION SET followed by transaction
    args:
      - query
      - --no-quic
      - "SESSION SET PROPERTY GRAPH G1; START TRANSACTION; RETURN 1 AS x; COMMIT"
    expect:
      exit_code: 0
      stdout_contains: '"x"'
    tags: [session, transaction, combined, fixed]

  # Nested function call tests (from previous fixes)
  - name: nested-math-functions
    description: Test deeply nested mathematical functions
    args:
      - query
      - --no-quic
      - "RETURN abs(sqrt(pow(2, 2))) AS result"
    expect:
      exit_code: 0
      stdout_contains: '"result"'
    tags: [functions, nested, math, fixed]

  - name: nested-string-functions
    description: Test nested string manipulation functions
    args:
      - query
      - --no-quic
      - "RETURN substring(upper(lower(trim('  hello  '))), 0, 5) AS result"
    expect:
      exit_code: 0
      stdout_contains: '"result"'
      stdout_contains: 'HELLO'
    tags: [functions, nested, string, fixed]

  - name: overflow-protection-exp
    description: Test overflow protection in exp() function
    args:
      - query
      - --no-quic
      - "RETURN exp(1000) AS result"
    expect:
      exit_code: 0
      stdout_contains: 'null'
    tags: [functions, overflow, protection, fixed]

  - name: overflow-protection-pow
    description: Test overflow protection in pow() function
    args:
      - query
      - --no-quic
      - "RETURN pow(10, 100) AS result"
    expect:
      exit_code: 0
      stdout_contains: 'null'
    tags: [functions, overflow, protection, fixed]

  # Map literal tests
  - name: map-literal-simple
    description: Test simple map literal creation
    args:
      - query
      - --no-quic
      - "RETURN {name: 'Alice', age: 30} AS person"
    expect:
      exit_code: 0
      stdout_contains: '"person"'
      stdout_contains: '"name":"Alice"'
    tags: [map, literal, fixed]

  - name: map-literal-nested
    description: Test nested map literals
    args:
      - query
      - --no-quic
      - "RETURN {person: {name: 'Bob', age: 25}, city: 'NYC'} AS data"
    expect:
      exit_code: 0
      stdout_contains: '"data"'
    tags: [map, literal, nested, fixed]

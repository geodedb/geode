stages:
  - build
  - release

variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: "0.15.2"
  ZIG_ARCH: "x86_64"
  GORELEASER_VERSION: "latest"
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}.insteadOf"
  GIT_CONFIG_VALUE_0: "https://gitlab.com"

.build-binaries:
  stage: build
  image: debian:bookworm-slim
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - apt-get update
    - apt-get install -y curl xz-utils ca-certificates build-essential pkg-config git libssl-dev
    - update-ca-certificates
    - |
      set -euo pipefail
      DETECTED_ARCH="${ZIG_ARCH:-$(uname -m)}"
      case "$DETECTED_ARCH" in
        x86_64|amd64) ZIG_DL_ARCH="x86_64" ;;
        aarch64|arm64) ZIG_DL_ARCH="aarch64" ;;
        *) echo "Unsupported architecture: $DETECTED_ARCH" >&2; exit 1 ;;
      esac
      ZIG_TARBALL="zig-${ZIG_DL_ARCH}-linux-${ZIG_VERSION}.tar.xz"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}" -o "${ZIG_TARBALL}"
      tar -xf "${ZIG_TARBALL}"
      mv "zig-${ZIG_DL_ARCH}-linux-${ZIG_VERSION}" /opt/zig
      export PATH="/opt/zig:$PATH"
      zig version
  script:
    - export PATH="/opt/zig:$PATH"
    - zig build -Doptimize=ReleaseSafe
    - mkdir -p dist
    - cp -r zig-out/bin/* dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:
  extends: .build-binaries

release:
  stage: release
  image: docker:stable
  services:
    - docker:dind
  needs:
    - job: build
      artifacts: true
  variables:
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    # Disable shallow cloning so that goreleaser can diff between tags to generate a changelog
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script: |
    # Run goreleaser in a container with Docker-in-Docker support
    # GITLAB_TOKEN is needed to create GitLab releases
    # GORELEASER_KEY is needed for GoReleaser Pro features
    # CI_JOB_TOKEN is available automatically for GitLab API access
    # DOCKER_* are needed to push Docker images
    docker run --rm --privileged \
      -v $PWD:/workspace \
      -w /workspace \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -e DOCKER_REGISTRY \
      -e DOCKER_USERNAME \
      -e DOCKER_PASSWORD \
      -e GITLAB_TOKEN \
      -e GORELEASER_KEY \
      -e CI_JOB_TOKEN \
      -e CI_REGISTRY_IMAGE \
      -e CI_COMMIT_TAG \
      -e CI_COMMIT_BRANCH \
      -e CI_DEFAULT_BRANCH \
      goreleaser/goreleaser-pro:${GORELEASER_VERSION} release --clean
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

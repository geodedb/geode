# =============================================================================
# Geode CI/CD Pipeline
# Multi-language build with DevNW CI/CD Catalog
# =============================================================================

include:
  # Zig code formatting and quality check
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1
    inputs:
      zig_version: "0.15.2"
      paths: "src/"
      stage: lint
      allow_failure: true  # TODO: Fix formatting issues then remove this

stages:
  - lint
  - build
  - test
  - release

variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: "0.15.2"
  GORELEASER_VERSION: "latest"
  # Git config to rewrite URLs for CI authentication
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/.insteadOf"
  GIT_CONFIG_VALUE_0: "https://gitlab.com/"
  # Rewrite SSH URLs to HTTPS for submodule compatibility
  GIT_CONFIG_KEY_1: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf"
  GIT_CONFIG_VALUE_1: "git@gitlab.com:"

# =============================================================================
# Build Stage
# =============================================================================

build-zig:
  stage: build
  image: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - zig build -Doptimize=ReleaseSafe
    - mkdir -p dist
    - cp -r zig-out/bin/* dist/
  artifacts:
    paths:
      - dist/
      - zig-out/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# =============================================================================
# Test Stage - Optional Client Tests
# =============================================================================

.test-template:
  stage: test
  needs:
    - job: build-zig
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: never

test-go-client:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/go:1.24
  script:
    - cd clients/go/geode
    - go mod download
    - go build ./...
    - go test -v -race ./... || true

test-rust-client:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/rust:stable
  script:
    - cd clients/rust
    - cargo build --release
    - cargo test --release || true

test-python-client:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  script:
    - cd clients/python
    - pip install -r requirements.txt
    - pip install -e .
    - python -c "from geode_client import Client; print('Python client OK')"

test-geodetestlab:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  script:
    - cd geodetestlab
    - pip install -e ".[dev]"
    - pytest tests/ -v --tb=short || true

test-zig-unit:
  stage: test
  image: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  needs:
    - job: build-zig
      artifacts: false
  script:
    - zig build test --summary all
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# Release Stage - GoReleaser
# =============================================================================

release:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-zig
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_DEPTH: 0
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - |
      # Prepare artifacts for GoReleaser
      # GoReleaser expects binaries in dist/ and zig-out/bin/
      ls -la dist/ || true
      ls -la zig-out/bin/ || true

      # Run GoReleaser Pro
      GORELEASER_IMAGE="goreleaser/goreleaser-pro:${GORELEASER_VERSION}"

      docker run --rm --privileged \
        -v "$PWD:/workspace" \
        -w /workspace \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e DOCKER_REGISTRY \
        -e DOCKER_USERNAME \
        -e DOCKER_PASSWORD \
        -e GITLAB_TOKEN \
        -e GORELEASER_KEY \
        -e CI_JOB_TOKEN \
        -e CI_REGISTRY_IMAGE \
        -e CI_COMMIT_TAG \
        -e CI_COMMIT_BRANCH \
        -e CI_DEFAULT_BRANCH \
        -e CI_PROJECT_URL \
        -e CI_API_V4_URL \
        -e CI_PROJECT_ID \
        "$GORELEASER_IMAGE" release --clean
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        GORELEASER_ARGS: "--snapshot"

# =============================================================================
# Snapshot Release (non-tag builds on main)
# =============================================================================

snapshot:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-zig
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_DEPTH: 0
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - |
      GORELEASER_IMAGE="goreleaser/goreleaser-pro:${GORELEASER_VERSION}"

      docker run --rm --privileged \
        -v "$PWD:/workspace" \
        -w /workspace \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e DOCKER_REGISTRY \
        -e DOCKER_USERNAME \
        -e DOCKER_PASSWORD \
        -e GITLAB_TOKEN \
        -e GORELEASER_KEY \
        -e CI_JOB_TOKEN \
        -e CI_REGISTRY_IMAGE \
        -e CI_COMMIT_TAG \
        -e CI_COMMIT_BRANCH \
        -e CI_DEFAULT_BRANCH \
        -e CI_PROJECT_URL \
        -e CI_API_V4_URL \
        -e CI_PROJECT_ID \
        "$GORELEASER_IMAGE" release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 3 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null'

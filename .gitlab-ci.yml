# Diagnostic only: never merge this reduced configuration.
workflow:
  auto_cancel:
    on_job_failure: all
stages:
- test
default:
  interruptible: true
  after_script:
  - rm -rf .zig-cache/tmp zig-cache/tmp
variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: 0.16.0
  ZIG_GLOBAL_CACHE_DIR: ${CI_PROJECT_DIR}/zig-cache
  ZIG_LOCAL_CACHE_DIR: ${CI_PROJECT_DIR}/.zig-cache
  ZIG_IMAGE: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  GORELEASER_VERSION: v2.13.3
  GEODE_TEST_HARNESS_REF: 4631418f39d07364e72d1422df24bcb060607970
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.com/
  GIT_CONFIG_KEY_1: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
  GIT_CONFIG_VALUE_1: 'git@gitlab.com:'
probe:capability-macos:
  tags:
  - dedicated
  - macos
  - arm
  variables:
    ZIG_BUILD_JOBS: '1'
    GIT_CONFIG_COUNT: 3
    GIT_CONFIG_KEY_0: credential.helper
    GIT_CONFIG_VALUE_0: ''
    GIT_CONFIG_KEY_1: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
    GIT_CONFIG_VALUE_1: https://gitlab.com/
    GIT_CONFIG_KEY_2: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
    GIT_CONFIG_VALUE_2: git+https://gitlab.com/
  before_script:
  - - "# The Ubuntu Zig images do not include Python. Check before the long\n# build so cache maintenance cannot silently\
      \ fail in after_script.\nif ! command -v python3 >/dev/null 2>&1; then\n  command -v apt-get >/dev/null 2>&1 || { echo\
      \ \"Python 3 is required for Zig cache maintenance\" >&2; exit 1; }\n  apt-get update\n  DEBIAN_FRONTEND=noninteractive\
      \ apt-get install -y --no-install-recommends python3\nfi\npython3 --version\n"
  - 'git config --global credential.helper ""

    git config --global "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf" "https://gitlab.com/"

    git config --global "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf" "git+https://gitlab.com/"

    '
  - "if ! command -v jq >/dev/null 2>&1; then\n  if command -v brew >/dev/null 2>&1; then\n    brew install jq\n  else\n \
    \   echo \"jq is required for zvm installation on macOS\"\n    exit 1\n  fi\nfi\nexport ZVM_NO_MODIFY=1\nexport PATH=\"\
    $HOME/bin:$PATH\"\ncurl -fsSL https://zig.sh/install.sh | bash\neval \"$(zvm env)\"\nzvm install \"${ZIG_VERSION}\"\n\
    zvm use \"${ZIG_VERSION}\"\nzig version\n"
  - "# Service accounts can read preinstalled libraries without acquiring\n# Homebrew's administrator-owned metadata locks.\n\
    geode_openssl_prefix=\"\"\nfor geode_openssl_candidate in \"${GEODE_MACOS_OPENSSL_PREFIX:-}\" /opt/homebrew/opt/openssl@3\
    \ /usr/local/opt/openssl@3; do\n  if [ -f \"${geode_openssl_candidate}/include/openssl/ssl.h\" ] &&\n     [ -f \"${geode_openssl_candidate}/lib/libssl.dylib\"\
    \ ] &&\n     [ -f \"${geode_openssl_candidate}/lib/libcrypto.dylib\" ]; then\n    geode_openssl_prefix=\"$geode_openssl_candidate\"\
    \n    break\n  fi\ndone\nif [ -z \"$geode_openssl_prefix\" ]; then\n  command -v brew >/dev/null 2>&1 || { echo \"Homebrew\
    \ is required to install native OpenSSL\" >&2; exit 1; }\n  HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3\n  geode_openssl_prefix=\"\
    $(HOMEBREW_NO_AUTO_UPDATE=1 brew --prefix openssl@3)\"\nfi\nexport GEODE_MACOS_OPENSSL_PREFIX=\"$geode_openssl_prefix\"\
    \ntest -f \"${GEODE_MACOS_OPENSSL_PREFIX}/include/openssl/ssl.h\"\ntest -f \"${GEODE_MACOS_OPENSSL_PREFIX}/lib/libssl.dylib\"\
    \ntest -f \"${GEODE_MACOS_OPENSSL_PREFIX}/lib/libcrypto.dylib\"\nexport PATH=\"${GEODE_MACOS_OPENSSL_PREFIX}/bin:$PATH\"\
    \nexport PKG_CONFIG_PATH=\"${GEODE_MACOS_OPENSSL_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\"\n"
  - "mkdir -p \"${ZIG_GLOBAL_CACHE_DIR}/p\"\nif [ -d \"zig-pkg\" ] && ls zig-pkg/* >/dev/null 2>&1; then\n  cp -rn zig-pkg/*\
    \ \"${ZIG_GLOBAL_CACHE_DIR}/p/\" 2>/dev/null || true\nfi\nif [ -d \"docker/zig-packages\" ] && ls docker/zig-packages/*\
    \ >/dev/null 2>&1; then\n  cp -rn docker/zig-packages/* \"${ZIG_GLOBAL_CACHE_DIR}/p/\" 2>/dev/null || true\nfi\n"
  stage: test
  timeout: 10m
  retry: 0
  needs: []
  rules:
  - when: always
  script:
  - 'export PATH="$HOME/bin:$PATH"

    eval "$(zvm env)"

    zvm use "${ZIG_VERSION}"

    zig version

    '
  - "# macOS SaaS runners' per-session $TMPDIR (/var/folders/.../T) can be\n# rotated/cleaned mid-job, so `zig fetch` failed\
    \ CONSISTENTLY with\n# \"failed to create temporary zip file: FileNotFound\" (distinct from the\n# transient HttpConnectionClosing\
    \ network flakes). Pin TMPDIR + zig's\n# cache tmp to job-local dirs we create here; exported so the later\n# `zig build`\
    \ / `zig build test` steps reuse the same valid temp roots.\nexport TMPDIR=\"${CI_PROJECT_DIR}/.zig-tmp\"\nmkdir -p \"\
    $TMPDIR\" \"${ZIG_GLOBAL_CACHE_DIR}/p\" \"${ZIG_GLOBAL_CACHE_DIR}/tmp\"\nPROTOC_URL=\"https://github.com/protocolbuffers/protobuf/releases/download/v32.1/protoc-32.1-osx-aarch_64.zip\"\
    \necho \"Pre-fetching protoc-osx-aarch_64 via zig fetch with retries (TMPDIR=$TMPDIR)...\"\nfetched=\"\"\nfor i in 1 2\
    \ 3 4 5; do\n  if zig fetch \"$PROTOC_URL\" >/tmp/zig-fetch-protoc.log 2>&1; then\n    echo \"\u2713 protoc pre-fetch\
    \ succeeded on attempt $i (hash=$(cat /tmp/zig-fetch-protoc.log))\"\n    fetched=1\n    break\n  fi\n  echo \"attempt\
    \ $i failed:\"\n  cat /tmp/zig-fetch-protoc.log || true\n  [ \"$i\" -lt 5 ] && { echo \"retrying in 15s...\"; sleep 15;\
    \ }\ndone\nif [ -z \"$fetched\" ]; then\n  echo \"\u26A0 protoc pre-fetch failed after 5 attempts; zig build will retry\
    \ on its own\"\nfi\n"
  - python3 scripts/ci/zig_fail_fast.py --log reports/capability-macos.log -- zig build --search-prefix "$GEODE_MACOS_OPENSSL_PREFIX"
    -j1 test-capability-gate --summary all --error-style verbose
  artifacts:
    when: always
    paths:
    - reports/capability-macos.log
    expire_in: 1 day

# Diagnostic only: do not merge this reduced CI configuration.
workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
  - if: $CI_PIPELINE_SOURCE == "api"
  - when: never
stages:
- test
default:
  interruptible: true
  after_script:
  - rm -rf .zig-cache/tmp zig-cache/tmp
variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: 0.16.0
  ZIG_GLOBAL_CACHE_DIR: ${CI_PROJECT_DIR}/zig-cache
  ZIG_LOCAL_CACHE_DIR: ${CI_PROJECT_DIR}/.zig-cache
  ZIG_IMAGE: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  GORELEASER_VERSION: v2.13.3
  GEODE_TEST_HARNESS_REF: 4631418f39d07364e72d1422df24bcb060607970
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.com/
  GIT_CONFIG_KEY_1: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
  GIT_CONFIG_VALUE_1: 'git@gitlab.com:'
probe:cluster-log-capture:
  cache:
  - key: zig-protoc-v32.1-blob
    paths:
    - zig-cache/p/N-V-__8AAGKbngAmNuaBMSXq_WgmQi6N8WVWVKp0moFSTvoJ.tar.gz
    policy: pull
  stage: test
  image: $ZIG_IMAGE
  tags:
  - company
  - dedicated
  - linux
  - x86
  - aws-spot
  timeout: 45m
  variables:
    ZIG_BUILD_JOBS: '1'
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: '50'
  retry: 0
  before_script:
  - - "# The Ubuntu Zig images do not include Python. Check before the long\n# build so cache maintenance cannot\
      \ silently fail in after_script.\nif ! command -v python3 >/dev/null 2>&1; then\n  command -v apt-get >/dev/null\
      \ 2>&1 || { echo \"Python 3 is required for Zig cache maintenance\" >&2; exit 1; }\n  apt-get update\n  DEBIAN_FRONTEND=noninteractive\
      \ apt-get install -y --no-install-recommends python3\nfi\npython3 --version\n"
  - - "mkdir -p \"${ZIG_GLOBAL_CACHE_DIR}/p\"\npopulated=0\nif [ -d \"zig-pkg\" ] && ls zig-pkg/* >/dev/null 2>&1;\
      \ then\n  cp -rn zig-pkg/* \"${ZIG_GLOBAL_CACHE_DIR}/p/\" 2>/dev/null || true\n  populated=1\nfi\nif [ -d\
      \ \"docker/zig-packages\" ] && ls docker/zig-packages/* >/dev/null 2>&1; then\n  cp -rn docker/zig-packages/*\
      \ \"${ZIG_GLOBAL_CACHE_DIR}/p/\" 2>/dev/null || true\n  populated=1\nfi\nif [ \"$populated\" = \"1\" ]; then\n\
      \  echo \"\u2713 populated cache from vendored packages\"\nelse\n  echo \"\u26A0 no vendored packages present\
      \ \u2014 zig build will fetch from network\"\nfi\n# Resilient protoc pre-fetch (2026-06-05, root-caused +\
      \ reworked 2026-07-13).\n# protobuf's protoc binary is a LAZY network dependency (unconditional\n# `b.lazyDependency(\"\
      protoc-<host>\")`). The in-repo zig-pkg/ vendoring is\n# .gitignored (empty on CI) and the shared k8s runners\
      \ have NO distributed\n# cache backend (\"No URL provided\" in every restore_cache), so without this\n# step\
      \ every dep-building job re-fetches protoc from GitHub and\n# intermittently flakes (\"invalid HTTP response:\
      \ HttpConnectionClosing\").\n#\n# 2026-07-13 \u2014 TWO root causes of the old pre-fetch failing 6/6 (jobs\n\
      # 15304380576 / 15317873774):\n#   (a) the zig CI image ships curl but NO unzip and NO python3, so the\n#\
      \       downloaded zip could never be extracted (the single \"attempt\n#       failed\" message hid which\
      \ leg broke); and\n#   (b) zig 0.16 stores fetched packages as `p/<hash>.tar.gz` BLOBS and\n#       IGNORES\
      \ pre-seeded extracted `p/<hash>/` directories entirely\n#       (verified: with github blackholed, a dir-seeded\
      \ cache still tried\n#       to fetch; a blob-seeded cache resolved offline). So even a\n#       successful\
      \ extraction populated a layout zig never read.\n# Fix: download the blob from the project's generic-package\
      \ mirror and\n# place it DIRECTLY as `p/<hash>.tar.gz` \u2014 no extraction step at all.\n# Fallback: `zig\
      \ fetch <github zip>` (zig natively fetches zips and writes\n# the blob form itself; requires build.zig in\
      \ cwd + cache p/ + tmp/ dirs).\n#\n# One-time mirror upload (repeat when bumping protoc, with key + hash):\n\
      #   tar -czf protoc-32.1-linux-x86_64.pkg.tar.gz \\\n#     -C zig-pkg/N-V-__8AAGKbngAmNuaBMSXq_WgmQi6N8WVWVKp0moFSTvoJ\
      \ bin include readme.txt\n#   glab api --method PUT \"projects/devnw%2Fcodepros%2Fgeode%2Fgeode/packages/generic/protoc/32.1/protoc-32.1-linux-x86_64.pkg.tar.gz\"\
      \ --input <file>\n# (Uploaded 2026-07-13; zig accepts the blob \u2014 it hashes the unpacked\n# CONTENT, and\
      \ this tarball's tree is identical to the GitHub zip's.)\n# Fully non-fatal: on exhausted retries we fall\
      \ through to zig build's own\n# fetch, exactly as before.\nZIG_PROTOC_HASH=\"N-V-__8AAGKbngAmNuaBMSXq_WgmQi6N8WVWVKp0moFSTvoJ\"\
      \nZIG_PROTOC_URL=\"https://github.com/protocolbuffers/protobuf/releases/download/v32.1/protoc-32.1-linux-x86_64.zip\"\
      \n# Same-network GitLab generic-package mirror (uploaded once to this\n# project); tried FIRST so a GitHub-releases\
      \ outage can't red the pipeline.\n# The CI_JOB_TOKEN grants read access to the project's own package registry.\n\
      ZIG_PROTOC_MIRROR_TGZ=\"${CI_API_V4_URL:-}/projects/${CI_PROJECT_ID:-}/packages/generic/protoc/32.1/protoc-32.1-linux-x86_64.pkg.tar.gz\"\
      \nZIG_PROTOC_BLOB=\"${ZIG_GLOBAL_CACHE_DIR}/p/${ZIG_PROTOC_HASH}.tar.gz\"\n# $1=url $2=outfile. Guarded by\
      \ callers' `if` (set-e-safe). On curl\n# failure, logs the HTTP status + curl exit code so a broken mirror\
      \ names\n# itself (2026-07-13: an opaque one-line failure hid the protoc root\n# cause for weeks \u2014 never\
      \ again).\nzig_protoc_dl() {\n  if command -v curl >/dev/null 2>&1; then\n    # --retry-all-errors: plain\
      \ --retry skips SSL-handshake failures\n    # (curl rc=35), which is exactly what the runner pods throw\n\
      \    # transiently (pipeline #2673598759 job 15322783646).\n    dl_code=$(curl -sSL --retry 3 --retry-delay\
      \ 3 --retry-connrefused --retry-all-errors --connect-timeout 20 --header \"JOB-TOKEN: ${CI_JOB_TOKEN:-}\"\
      \ -o \"$2\" -w \"%{http_code}\" \"$1\" 2>/dev/null); dl_rc=$?\n    if [ \"$dl_rc\" = \"0\" ] && [ \"$dl_code\"\
      \ = \"200\" ]; then return 0; fi\n    echo \"  (mirror leg: http_code=${dl_code:-none} curl_rc=${dl_rc})\"\
      \n    # A rejected JOB-TOKEN header 401s even where anonymous access would\n    # succeed (public project\
      \ registry) \u2014 retry once WITHOUT the header.\n    if [ \"$dl_code\" = \"401\" ] || [ \"$dl_code\" = \"\
      403\" ]; then\n      dl_code=$(curl -sSL --retry 2 --retry-delay 3 --retry-connrefused --connect-timeout 20\
      \ -o \"$2\" -w \"%{http_code}\" \"$1\" 2>/dev/null); dl_rc=$?\n      if [ \"$dl_rc\" = \"0\" ] && [ \"$dl_code\"\
      \ = \"200\" ]; then\n        echo \"  (mirror leg: anonymous retry OK)\"\n        return 0\n      fi\n   \
      \   echo \"  (mirror leg anonymous retry: http_code=${dl_code:-none} curl_rc=${dl_rc})\"\n    fi\n    rm -f\
      \ \"$2\"\n    return 1\n  elif command -v wget >/dev/null 2>&1; then\n    wget -q --header \"JOB-TOKEN: ${CI_JOB_TOKEN:-}\"\
      \ -O \"$2\" \"$1\" 2>/dev/null\n  else\n    return 127\n  fi\n}\nif [ ! -e \"${ZIG_PROTOC_BLOB}\" ]; then\n\
      \  mkdir -p \"${ZIG_GLOBAL_CACHE_DIR}/tmp\"\n  protoc_ok=0\n  for attempt in 1 2 3; do\n    # Leg 1: same-network\
      \ mirror -> place the blob directly. gzip -t\n    # sanity-rejects truncated bodies / HTML error pages before\
      \ the mv.\n    if [ -n \"${CI_API_V4_URL:-}\" ] && [ -n \"${CI_JOB_TOKEN:-}\" ]; then\n      if zig_protoc_dl\
      \ \"${ZIG_PROTOC_MIRROR_TGZ}\" /tmp/zig-protoc.pkg.tar.gz; then\n        if gzip -t /tmp/zig-protoc.pkg.tar.gz\
      \ 2>/dev/null; then\n          mv /tmp/zig-protoc.pkg.tar.gz \"${ZIG_PROTOC_BLOB}\"\n          echo \"\u2713\
      \ pre-fetched protoc blob from package-registry mirror (attempt ${attempt})\"\n          protoc_ok=1\n   \
      \     else\n          echo \"\u26A0 protoc mirror body failed gzip sanity check (attempt ${attempt})\"\n \
      \         rm -f /tmp/zig-protoc.pkg.tar.gz\n        fi\n      else\n        echo \"\u26A0 protoc mirror DOWNLOAD\
      \ failed (attempt ${attempt})\"\n      fi\n    fi\n    # Leg 2: zig fetch from GitHub \u2014 zig writes the\
      \ blob itself.\n    if [ \"${protoc_ok}\" != \"1\" ] && command -v zig >/dev/null 2>&1 && [ -f build.zig ];\
      \ then\n      if zig fetch \"${ZIG_PROTOC_URL}\" >/tmp/zig-fetch-protoc.log 2>&1; then\n        echo \"\u2713\
      \ pre-fetched protoc via zig fetch (attempt ${attempt}, hash=$(cat /tmp/zig-fetch-protoc.log))\"\n       \
      \ protoc_ok=1\n      else\n        echo \"\u26A0 zig fetch of protoc failed (attempt ${attempt}): $(tail -1\
      \ /tmp/zig-fetch-protoc.log)\"\n      fi\n    fi\n    if [ \"${protoc_ok}\" = \"1\" ]; then break; fi\n  \
      \  sleep 8\n  done\n  if [ \"${protoc_ok}\" != \"1\" ]; then\n    echo \"\u26A0 protoc pre-fetch exhausted\
      \ all legs; zig build will fetch from GitHub on its own\"\n  fi\nfi\n"
  script:
  - mkdir -p reports
  - python3 scripts/ci/zig_fail_fast.py --log reports/cluster-build.log -- zig build -j1 --summary all --error-style
    verbose
  - "test -x zig-out/bin/geode\ngit show 9f758f03d08c45db72c57dc39d8e755dd7c879a6:tests/test_cluster_3node_steady_state.zig\
    \ > reports/cluster-baseline.zig\ncp tests/test_cluster_3node_steady_state.zig reports/cluster-fixed.zig\nset\
    \ +e\ntimeout --kill-after=10s 6m zig test -lc reports/cluster-baseline.zig > reports/cluster-baseline.log 2>&1\n\
    baseline_rc=$?\nset -e\nprintf 'baseline_exit=%s\n' \"$baseline_rc\"\ntail -60 reports/cluster-baseline.log\n\
    for round in 1 2 3; do\n  echo \"fixed_round=$round\"\n  timeout --kill-after=10s 6m zig test -lc reports/cluster-fixed.zig\
    \ > \"reports/cluster-fixed-$round.log\" 2>&1 || { cat \"reports/cluster-fixed-$round.log\"; exit 1; }\n  cat\
    \ \"reports/cluster-fixed-$round.log\"\n  grep -q 'All 4 tests passed.' \"reports/cluster-fixed-$round.log\"\
    \ndone"
  rules:
  - when: always
  artifacts:
    when: always
    paths:
    - reports/cluster-*.log
    expire_in: 1 day

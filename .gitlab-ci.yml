# Diagnostic branch only. Do not merge this CI configuration.
workflow:
  rules:
  - if: $CI_COMMIT_BRANCH == "ci/macos-shard7-diagnostic-20261026"
stages:
- test
variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: 0.16.0
  ZIG_GLOBAL_CACHE_DIR: ${CI_PROJECT_DIR}/zig-cache
  ZIG_LOCAL_CACHE_DIR: ${CI_PROJECT_DIR}/.zig-cache
  ZIG_IMAGE: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  GORELEASER_VERSION: v2.13.3
  GEODE_TEST_HARNESS_REF: 4631418f39d07364e72d1422df24bcb060607970
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.com/
  GIT_CONFIG_KEY_1: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
  GIT_CONFIG_VALUE_1: 'git@gitlab.com:'
test-macos-shard7-diagnostic:
  stage: test
  needs: []
  timeout: 70m
  tags:
  - saas-macos-medium-m1
  retry: 0
  cache:
    key:
      prefix: geode-zig-macos-aarch64-v4-${ZIG_VERSION}-${TEST_SHARD_INDEX}
      files:
      - build.zig.zon
    paths:
    - .zig-cache/
    - zig-cache/
    policy: pull-push
  after_script:
  - python3 scripts/ci/prune_zig_cache.py
  variables:
    TEST_SHARD_TOTAL: '8'
    ZIG_BUILD_JOBS: '2'
    GIT_CONFIG_COUNT: 3
    GIT_CONFIG_KEY_0: credential.helper
    GIT_CONFIG_VALUE_0: ''
    GIT_CONFIG_KEY_1: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
    GIT_CONFIG_VALUE_1: https://gitlab.com/
    GIT_CONFIG_KEY_2: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
    GIT_CONFIG_VALUE_2: git+https://gitlab.com/
    TEST_SHARD_INDEX: '7'
    RUNNER_SCRIPT_TIMEOUT: 60m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  before_script:
  - - "# The Ubuntu Zig images do not include Python. Check before the long\n# build so cache maintenance cannot\
      \ silently fail in after_script.\nif ! command -v python3 >/dev/null 2>&1; then\n  command -v apt-get >/dev/null\
      \ 2>&1 || { echo \"Python 3 is required for Zig cache maintenance\" >&2; exit 1; }\n  apt-get update\n  DEBIAN_FRONTEND=noninteractive\
      \ apt-get install -y --no-install-recommends python3\nfi\npython3 --version\n"
  - 'git config --global credential.helper ""

    git config --global "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf" "https://gitlab.com/"

    git config --global "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf" "git+https://gitlab.com/"

    '
  - "if ! command -v jq >/dev/null 2>&1; then\n  if command -v brew >/dev/null 2>&1; then\n    brew install jq\n\
    \  else\n    echo \"jq is required for zvm installation on macOS\"\n    exit 1\n  fi\nfi\nexport ZVM_NO_MODIFY=1\n\
    export PATH=\"$HOME/bin:$PATH\"\ncurl -fsSL https://zig.sh/install.sh | bash\neval \"$(zvm env)\"\nzvm install\
    \ \"${ZIG_VERSION}\"\nzvm use \"${ZIG_VERSION}\"\nzig version\n"
  - "if command -v docker >/dev/null 2>&1; then for i in $(seq 1 20); do docker info >/dev/null 2>&1 && break; sleep\
    \ 2; done; fi\nif docker info >/dev/null 2>&1; then\n  echo \"=== provisioning OpenSSL FIPS provider from ci-catalog\
    \ zig-fips:${ZIG_VERSION} ===\"\n  echo \"${CI_JOB_TOKEN}\" | docker login -u gitlab-ci-token --password-stdin\
    \ registry.gitlab.com || true\n  docker rm -f \"fipsprov-${CI_JOB_ID:-local}\" 2>/dev/null || true\n  docker\
    \ create --name \"fipsprov-${CI_JOB_ID:-local}\" \"registry.gitlab.com/devnw/ci-catalog/zig-fips:${ZIG_VERSION}\"\
    \n  docker cp \"fipsprov-${CI_JOB_ID:-local}\":/usr/local/ssl /usr/local/ssl\n  docker rm \"fipsprov-${CI_JOB_ID:-local}\"\
    \n  [ -x /usr/local/ssl/bin/openssl ] && echo \"FIPS provider ready at /usr/local/ssl\" || { echo \"ERROR: FIPS\
    \ provider extraction failed\"; exit 1; }\nelse\n  echo \"no docker daemon \u2014 skipping FIPS provider provisioning\
    \ (non-GoReleaser job)\"\nfi\n"
  - "mkdir -p \"${ZIG_GLOBAL_CACHE_DIR}/p\"\nif [ -d \"zig-pkg\" ] && ls zig-pkg/* >/dev/null 2>&1; then\n  cp -rn\
    \ zig-pkg/* \"${ZIG_GLOBAL_CACHE_DIR}/p/\" 2>/dev/null || true\nfi\nif [ -d \"docker/zig-packages\" ] && ls\
    \ docker/zig-packages/* >/dev/null 2>&1; then\n  cp -rn docker/zig-packages/* \"${ZIG_GLOBAL_CACHE_DIR}/p/\"\
    \ 2>/dev/null || true\nfi\n"
  script:
  - 'export PATH="$HOME/bin:$PATH"

    eval "$(zvm env)"

    zvm use "${ZIG_VERSION}"

    zig version

    '
  - "# macOS SaaS runners' per-session $TMPDIR (/var/folders/.../T) can be\n# rotated/cleaned mid-job, so `zig fetch`\
    \ failed CONSISTENTLY with\n# \"failed to create temporary zip file: FileNotFound\" (distinct from the\n# transient\
    \ HttpConnectionClosing network flakes). Pin TMPDIR + zig's\n# cache tmp to job-local dirs we create here; exported\
    \ so the later\n# `zig build` / `zig build test` steps reuse the same valid temp roots.\nexport TMPDIR=\"${CI_PROJECT_DIR}/.zig-tmp\"\
    \nmkdir -p \"$TMPDIR\" \"${ZIG_GLOBAL_CACHE_DIR}/p\" \"${ZIG_GLOBAL_CACHE_DIR}/tmp\"\nPROTOC_URL=\"https://github.com/protocolbuffers/protobuf/releases/download/v32.1/protoc-32.1-osx-aarch_64.zip\"\
    \necho \"Pre-fetching protoc-osx-aarch_64 via zig fetch with retries (TMPDIR=$TMPDIR)...\"\nfetched=\"\"\nfor\
    \ i in 1 2 3 4 5; do\n  if zig fetch \"$PROTOC_URL\" >/tmp/zig-fetch-protoc.log 2>&1; then\n    echo \"\u2713\
    \ protoc pre-fetch succeeded on attempt $i (hash=$(cat /tmp/zig-fetch-protoc.log))\"\n    fetched=1\n    break\n\
    \  fi\n  echo \"attempt $i failed:\"\n  cat /tmp/zig-fetch-protoc.log || true\n  [ \"$i\" -lt 5 ] && { echo\
    \ \"retrying in 15s...\"; sleep 15; }\ndone\nif [ -z \"$fetched\" ]; then\n  echo \"\u26A0 protoc pre-fetch\
    \ failed after 5 attempts; zig build will retry on its own\"\nfi\n"
  - if [ "$TEST_SHARD_INDEX" = "0" ]; then zig build -j${ZIG_BUILD_JOBS} --summary all; fi
  - mkdir -p reports
  - 'bash scripts/test/ci-macos-process-samples.sh &

    monitor_pid=$!

    trap ''kill "$monitor_pid" 2>/dev/null || true'' EXIT'
  - zig build -j${ZIG_BUILD_JOBS} test -Dtest-shard-total=$TEST_SHARD_TOTAL -Dtest-shard-index=$TEST_SHARD_INDEX
    --summary all 2>&1 | tee reports/zig_test_macos_shard_${TEST_SHARD_INDEX}.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - reports/zig_test_macos_shard_*.log
    - reports/macos-process-*
  rules:
  - if: $CI_COMMIT_BRANCH == "ci/macos-shard7-diagnostic-20261026"
  allow_failure: false

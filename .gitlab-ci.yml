# =============================================================================
# Geode CI/CD Pipeline
# Multi-language build with DevNW CI/CD Catalog
# =============================================================================

include:
  # Zig code formatting and quality check
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1
    inputs:
      zig_version: "0.15.2"
      paths: "src/"
      stage: lint
      allow_failure: true  # TODO: Fix formatting issues then remove this

stages:
  - lint
  - build
  - test
  - docker
  - release

variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: "0.15.2"
  GORELEASER_VERSION: "latest"
  # Git config to rewrite URLs for CI authentication
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/.insteadOf"
  GIT_CONFIG_VALUE_0: "https://gitlab.com/"
  # Rewrite SSH URLs to HTTPS for submodule compatibility
  GIT_CONFIG_KEY_1: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf"
  GIT_CONFIG_VALUE_1: "git@gitlab.com:"

# =============================================================================
# Build Stage
# =============================================================================

build-zig:
  stage: build
  image: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - zig build -Doptimize=ReleaseSafe
    - mkdir -p dist
    - cp -r zig-out/bin/* dist/
  artifacts:
    paths:
      - dist/
      - zig-out/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# =============================================================================
# Test Stage - Optional Client Tests
# =============================================================================

.test-template:
  stage: test
  needs:
    - job: build-zig
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: never

test-go-client:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/go:1.24
  script:
    - cd clients/go/geode
    - go mod download
    - go build ./...
    - go test -v -race ./... || true

test-rust-client:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/rust:stable
  script:
    - cd clients/rust
    - cargo build --release
    - cargo test --release || true

test-python-client:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  script:
    - cd clients/python
    - pip install -r requirements.txt
    - pip install -e .
    - python -c "from geode_client import Client; print('Python client OK')"

test-geodetestlab:
  extends: .test-template
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  script:
    - cd geodetestlab
    - pip install -e ".[dev]"
    - pytest tests/ -v --tb=short || true

test-zig-unit:
  stage: test
  image: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  needs:
    - job: build-zig
      artifacts: false
  script:
    - zig build test --summary all
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: true  # Tests may have known issues

# =============================================================================
# Docker Stage - Build and Push Container Images
# =============================================================================

.docker-build-template:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-zig
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# Debian-based image (default)
docker-debian:
  extends: .docker-build-template
  script:
    - |
      echo "=== Debug: Current directory ==="
      pwd
      echo "=== Debug: Directory contents ==="
      ls -la
      echo "=== Debug: zig-out contents ==="
      ls -laR zig-out/ || echo "zig-out directory not found"
      echo "=== Debug: dist contents ==="
      ls -la dist/ || echo "dist directory not found"

      # Verify binaries exist
      if [ ! -d "zig-out/bin" ] || [ -z "$(ls -A zig-out/bin 2>/dev/null)" ]; then
        echo "ERROR: zig-out/bin is missing or empty"
        exit 1
      fi

      echo "=== Building Debian-based Docker image ==="

      # Determine image tags based on context
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tagged release - use version tags
        VERSION="${CI_COMMIT_TAG#v}"
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        docker build \
          -t "$CI_REGISTRY_IMAGE:$VERSION" \
          -t "$CI_REGISTRY_IMAGE:$MAJOR.$MINOR" \
          -t "$CI_REGISTRY_IMAGE:$MAJOR" \
          -t "$CI_REGISTRY_IMAGE:latest" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "org.opencontainers.image.version=$VERSION" \
          --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
          --label "org.opencontainers.image.title=geode" \
          --label "org.opencontainers.image.description=Geode Graph Database - GQL-compliant property-graph database" \
          -f Dockerfile.ci .
        docker push "$CI_REGISTRY_IMAGE:$VERSION"
        docker push "$CI_REGISTRY_IMAGE:$MAJOR.$MINOR"
        docker push "$CI_REGISTRY_IMAGE:$MAJOR"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        # Snapshot build - use commit-based tags
        docker build \
          -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" \
          -t "$CI_REGISTRY_IMAGE:snapshot" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "org.opencontainers.image.version=${CI_COMMIT_SHORT_SHA}" \
          --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
          --label "org.opencontainers.image.title=geode" \
          --label "org.opencontainers.image.description=Geode Graph Database - GQL-compliant property-graph database" \
          -f Dockerfile.ci .
        docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
        docker push "$CI_REGISTRY_IMAGE:snapshot"
      fi

      echo "=== Docker images pushed successfully ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/'

# Alpine-based image (smaller)
docker-alpine:
  extends: .docker-build-template
  script:
    - |
      echo "=== Debug: zig-out contents ==="
      ls -laR zig-out/ || echo "zig-out directory not found"

      # Verify binaries exist
      if [ ! -d "zig-out/bin" ] || [ -z "$(ls -A zig-out/bin 2>/dev/null)" ]; then
        echo "ERROR: zig-out/bin is missing or empty"
        exit 1
      fi

      echo "=== Building Alpine-based Docker image ==="

      # Determine image tags based on context
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        docker build \
          -t "$CI_REGISTRY_IMAGE:$VERSION-alpine" \
          -t "$CI_REGISTRY_IMAGE:alpine" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "org.opencontainers.image.version=$VERSION" \
          --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
          --label "org.opencontainers.image.title=geode" \
          --label "org.opencontainers.image.description=Geode Graph Database (Alpine) - GQL-compliant property-graph database" \
          -f Dockerfile.ci.alpine .
        docker push "$CI_REGISTRY_IMAGE:$VERSION-alpine"
        docker push "$CI_REGISTRY_IMAGE:alpine"
      else
        docker build \
          -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}-alpine" \
          -t "$CI_REGISTRY_IMAGE:snapshot-alpine" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "org.opencontainers.image.version=${CI_COMMIT_SHORT_SHA}" \
          --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
          --label "org.opencontainers.image.title=geode" \
          --label "org.opencontainers.image.description=Geode Graph Database (Alpine) - GQL-compliant property-graph database" \
          -f Dockerfile.ci.alpine .
        docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}-alpine"
        docker push "$CI_REGISTRY_IMAGE:snapshot-alpine"
      fi

      echo "=== Docker Alpine images pushed successfully ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/'

# =============================================================================
# Release Stage - GoReleaser
# =============================================================================

release:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-zig
      artifacts: true
    - job: docker-debian
      artifacts: false
    - job: docker-alpine
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_DEPTH: 0
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - |
      # Prepare artifacts for GoReleaser
      ls -la dist/ || true
      ls -la zig-out/bin/ || true

      # Run GoReleaser Pro
      GORELEASER_IMAGE="goreleaser/goreleaser-pro:${GORELEASER_VERSION}"

      docker run --rm --privileged \
        -v "$PWD:/workspace" \
        -w /workspace \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e DOCKER_REGISTRY \
        -e DOCKER_USERNAME \
        -e DOCKER_PASSWORD \
        -e GITLAB_TOKEN \
        -e GORELEASER_KEY \
        -e CI_JOB_TOKEN \
        -e CI_REGISTRY_IMAGE \
        -e CI_COMMIT_TAG \
        -e CI_COMMIT_BRANCH \
        -e CI_DEFAULT_BRANCH \
        -e CI_PROJECT_URL \
        -e CI_API_V4_URL \
        -e CI_PROJECT_ID \
        "$GORELEASER_IMAGE" release --clean
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    # Only run on semantic version tags
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/'

# =============================================================================
# Snapshot Release (non-tag builds on main)
# =============================================================================

snapshot:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-zig
      artifacts: true
    - job: docker-debian
      artifacts: false
    - job: docker-alpine
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_DEPTH: 0
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - |
      GORELEASER_IMAGE="goreleaser/goreleaser-pro:${GORELEASER_VERSION}"

      docker run --rm --privileged \
        -v "$PWD:/workspace" \
        -w /workspace \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e DOCKER_REGISTRY \
        -e DOCKER_USERNAME \
        -e DOCKER_PASSWORD \
        -e GITLAB_TOKEN \
        -e GORELEASER_KEY \
        -e CI_JOB_TOKEN \
        -e CI_REGISTRY_IMAGE \
        -e CI_COMMIT_TAG \
        -e CI_COMMIT_BRANCH \
        -e CI_DEFAULT_BRANCH \
        -e CI_PROJECT_URL \
        -e CI_API_V4_URL \
        -e CI_PROJECT_ID \
        "$GORELEASER_IMAGE" release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 3 days
  rules:
    # Run on main branch when there's no tag
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
  allow_failure: true  # GoReleaser may fail due to Go vendor issues

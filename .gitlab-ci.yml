# Diagnostic branch only. Do not merge this CI configuration.
workflow:
  rules:
  - if: $CI_COMMIT_BRANCH == "ci/macos-cluster-tls-turn89"
  auto_cancel:
    on_new_commit: interruptible
stages:
- test
variables:
  DOCKER_BUILDKIT: 1
  ZIG_VERSION: 0.16.0
  ZIG_GLOBAL_CACHE_DIR: ${CI_PROJECT_DIR}/zig-cache
  ZIG_LOCAL_CACHE_DIR: ${CI_PROJECT_DIR}/.zig-cache
  ZIG_IMAGE: registry.gitlab.com/devnw/ci-catalog/zig:${ZIG_VERSION}
  GORELEASER_VERSION: v2.13.3
  GEODE_TEST_HARNESS_REF: 4631418f39d07364e72d1422df24bcb060607970
  # Git config for CI authentication
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0:
    url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.com/
  GIT_CONFIG_KEY_1:
    url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
  GIT_CONFIG_VALUE_1: 'git@gitlab.com:'
  # =============================================================================
  # Docker Hub Configuration (required for release builds)
  # Set these as CI/CD variables in GitLab project settings:
  #   DOCKERHUB_USERNAME - Docker Hub username (e.g., "geodedb")
  #   DOCKERHUB_TOKEN    - Docker Hub access token (NOT password)
  # When set, GoReleaser will push images to docker.io/geodedb/geode
  # Reference: https://goreleaser.com/customization/docker/
  # =============================================================================

# Pre-populate Zig package cache from vendored packages to avoid network
# fetches that can fail with transient GitHub 502 errors.
# Use vendored package cache if present, otherwise fetch dependencies from network.
# Checks both legacy (docker/zig-packages) and current (zig-pkg) vendor paths.
default:
  # SRE-173 follow-up (2026-10-14): runners now share an S3 cache, so the
  # pull-push zig cache below really round-trips. `.zig-cache/tmp` holds the
  # tests' scratch databases (std.testing.tmpDir), which then got archived and
  # restored by every job until test-zig-unit pods were evicted at the 20Gi
  # ephemeral-storage limit. GitLab's cache has no `exclude`, but after_script
  # runs before the cache is archived, so drop the scratch dirs here. Jobs
  # without a bounded writer hook inherit this cleanup.
  after_script:
  - rm -rf .zig-cache/tmp zig-cache/tmp
  # 2026-10-10: `x86` matched no k8s runner after the Company Cluster Runner
  # was recreated on 2026-09-27 with [company, k8s, linux, amd64, ubuntu,
  # docker]; every default-tagged job sat in stuck_pending_no_matching_runners.
  # The k8s pool's arch tag is `amd64` (the `x86` tag belongs to the OVH and
  # AWS-spot dedicated pools, which jobs select with `dedicated`).
  tags: [company, k8s, linux, amd64]
  interruptible: true  # Allow auto-cancel of redundant pipelines on push
  # GLOBAL transient-infra retry: the shared kubernetes runners intermittently
  # fail jobs at POD SETUP with `system failure: etcdserver: leader changed`
  # (and pod-scheduling / API flakes), which killed whole pipelines at random
  # (e.g. governance-conformance-sync / -release-manifests, security-secrets in
  # #2671104674 / #2670033275). Only ~13 of 41 jobs previously set their own
  # retry, so the rest died permanently on a brief control-plane hiccup. This
  # default retries EVERY job on transient/system failure classes ONLY (never
  # script_failure -- a real test failure must not be masked). Jobs that declare
  # their own `retry:` override this and keep their `script_failure` coverage.
  retry:
    max: 2
    when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - api_failure
    - scheduler_failure
    - unknown_failure

# Cache only jobs that consume Zig outputs. Publishing and report jobs have
# no compiler work and must not download or upload compiler archives.
test-macos-cluster-tls-diagnostic:
  stage: test
  # This job builds from source and fetches its own dependencies. Start native
  # portability validation without waiting for the Linux governance queue.
  needs: []
  timeout: 30m
  tags:
  - saas-macos-medium-m1
  retry: 0
  cache:
    <<:
      key:
        prefix: geode-zig-native-v3-${ZIG_VERSION}
        files: [build.zig.zon]
      paths:
      - .zig-cache/
      - zig-cache/
      policy: pull
    key:
      prefix: geode-zig-macos-aarch64-v4-${ZIG_VERSION}-${TEST_SHARD_INDEX}
      files: [build.zig.zon]
    # Instrumented dependency sources must never be uploaded to shared caches.
    policy: pull
    paths:
    - .zig-cache/
    - zig-cache/
  after_script:
  - python3 scripts/ci/prune_zig_cache.py

  variables:
    TEST_SHARD_TOTAL: '8'
    ZIG_BUILD_JOBS: '2'
    # Disable git credential storage to avoid Keychain errors on macOS runners
    GIT_CONFIG_COUNT: 3
    GIT_CONFIG_KEY_0: credential.helper
    GIT_CONFIG_VALUE_0: ''
    GIT_CONFIG_KEY_1:
      url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
    GIT_CONFIG_VALUE_1: https://gitlab.com/
    GIT_CONFIG_KEY_2:
      url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf
    GIT_CONFIG_VALUE_2: git+https://gitlab.com/
    TEST_SHARD_INDEX: '7'
    RUNNER_SCRIPT_TIMEOUT: 25m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  before_script:
  - - |
      # The Ubuntu Zig images do not include Python. Check before the long
      # build so cache maintenance cannot silently fail in after_script.
      if ! command -v python3 >/dev/null 2>&1; then
        command -v apt-get >/dev/null 2>&1 || { echo "Python 3 is required for Zig cache maintenance" >&2; exit 1; }
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
      fi
      python3 --version
  # Match the catalog's 2 GiB bound. Keep recent compiler outputs and package
  # downloads instead of spending minutes compressing an archive S3 rejects.
  # CANARY: REQ=REQ-CI-CACHE-001; FEATURE="BoundedZigCache"; ASPECT=CI; STATUS=TESTED; TEST=scripts/ci/test_prune_zig_cache.py; OWNER=ci; UPDATED=2026-10-24
    # Configure git to use CI token for gitlab.com and disable credential storage
  - |
    git config --global credential.helper ""
    git config --global "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf" "https://gitlab.com/"
    git config --global "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/.insteadOf" "git+https://gitlab.com/"
   # Install Zig via zvm (https://zig.sh)
  - |
    if ! command -v jq >/dev/null 2>&1; then
      if command -v brew >/dev/null 2>&1; then
        brew install jq
      else
        echo "jq is required for zvm installation on macOS"
        exit 1
      fi
    fi
    export ZVM_NO_MODIFY=1
    export PATH="$HOME/bin:$PATH"
    curl -fsSL https://zig.sh/install.sh | bash
    eval "$(zvm env)"
    zvm install "${ZIG_VERSION}"
    zvm use "${ZIG_VERSION}"
    zig version
   # Provision the validated OpenSSL FIPS provider for the geode-fips build
    # (-Dopenssl_path=/usr/local/ssl): extract /usr/local/ssl (libs + headers +
    # fips.so + openssl.cnf) from the ci-catalog zig-fips image into this build
    # container. Cross-project pull uses the CI job token.
  - |
    if command -v docker >/dev/null 2>&1; then for i in $(seq 1 20); do docker info >/dev/null 2>&1 && break; sleep 2; done; fi
    if docker info >/dev/null 2>&1; then
      echo "=== provisioning OpenSSL FIPS provider from ci-catalog zig-fips:${ZIG_VERSION} ==="
      echo "${CI_JOB_TOKEN}" | docker login -u gitlab-ci-token --password-stdin registry.gitlab.com || true
      docker rm -f "fipsprov-${CI_JOB_ID:-local}" 2>/dev/null || true
      docker create --name "fipsprov-${CI_JOB_ID:-local}" "registry.gitlab.com/devnw/ci-catalog/zig-fips:${ZIG_VERSION}"
      docker cp "fipsprov-${CI_JOB_ID:-local}":/usr/local/ssl /usr/local/ssl
      docker rm "fipsprov-${CI_JOB_ID:-local}"
      [ -x /usr/local/ssl/bin/openssl ] && echo "FIPS provider ready at /usr/local/ssl" || { echo "ERROR: FIPS provider extraction failed"; exit 1; }
    else
      echo "no docker daemon — skipping FIPS provider provisioning (non-GoReleaser job)"
    fi
   # Use vendored cache if present, otherwise zig build fetches from network.
    # Check current (zig-pkg) and legacy (docker/zig-packages) vendor paths.
  - |
    mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/p"
    if [ -d "zig-pkg" ] && ls zig-pkg/* >/dev/null 2>&1; then
      cp -rn zig-pkg/* "${ZIG_GLOBAL_CACHE_DIR}/p/" 2>/dev/null || true
    fi
    if [ -d "docker/zig-packages" ] && ls docker/zig-packages/* >/dev/null 2>&1; then
      cp -rn docker/zig-packages/* "${ZIG_GLOBAL_CACHE_DIR}/p/" 2>/dev/null || true
    fi
  script:
  - |
    export PATH="$HOME/bin:$PATH"
    eval "$(zvm env)"
    zvm use "${ZIG_VERSION}"
    zig version
  - |
    # macOS SaaS runners' per-session $TMPDIR (/var/folders/.../T) can be
    # rotated/cleaned mid-job, so `zig fetch` failed CONSISTENTLY with
    # "failed to create temporary zip file: FileNotFound" (distinct from the
    # transient HttpConnectionClosing network flakes). Pin TMPDIR + zig's
    # cache tmp to job-local dirs we create here; exported so the later
    # `zig build` / `zig build test` steps reuse the same valid temp roots.
    export TMPDIR="${CI_PROJECT_DIR}/.zig-tmp"
    mkdir -p "$TMPDIR" "${ZIG_GLOBAL_CACHE_DIR}/p" "${ZIG_GLOBAL_CACHE_DIR}/tmp"
    PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v32.1/protoc-32.1-osx-aarch_64.zip"
    echo "Pre-fetching protoc-osx-aarch_64 via zig fetch with retries (TMPDIR=$TMPDIR)..."
    fetched=""
    for i in 1 2 3 4 5; do
      if zig fetch "$PROTOC_URL" >/tmp/zig-fetch-protoc.log 2>&1; then
        echo "✓ protoc pre-fetch succeeded on attempt $i (hash=$(cat /tmp/zig-fetch-protoc.log))"
        fetched=1
        break
      fi
      echo "attempt $i failed:"
      cat /tmp/zig-fetch-protoc.log || true
      [ "$i" -lt 5 ] && { echo "retrying in 15s..."; sleep 15; }
    done
    if [ -z "$fetched" ]; then
      echo "⚠ protoc pre-fetch failed after 5 attempts; zig build will retry on its own"
    fi
   # Native Debug coverage uses the same complete weighted partition as Linux.
    # The single aggregate run exceeded two hours before reaching every test.
    # ReleaseSafe target compilation remains in test-cross-build.
    #
    # Pre-fetch the lazy protoc binary via `zig fetch` so Zig's content-addressed
    # cache (`${ZIG_GLOBAL_CACHE_DIR}/p/<hash>/`) is primed before `zig build`
    # traverses protobuf's `.lazy = true` protoc dep. Writing the zip to a flat
    # path under `p/` (as the old curl-based pre-fetch did) doesn't actually
    # populate Zig's hash tree, so `zig build` would retry the network fetch
    # and hit the same "HttpConnectionClosing" flakes on GitHub releases from
    # SaaS M1 runners (pipelines #883/#885/#886/#888/#910/#911).
  - if [ "$TEST_SHARD_INDEX" = "0" ]; then zig build -j${ZIG_BUILD_JOBS}
    --summary all; fi # Build all installed targets once; each test shard also builds its own
    # declared executable dependencies through build.zig.
  - mkdir -p reports
  - "bash scripts/test/ci-macos-process-samples.sh &\nmonitor_pid=$!\ntrap 'kill \"\
    $monitor_pid\" 2>/dev/null || true' EXIT"
  - openssl version
  - zig build -j${ZIG_BUILD_JOBS} test-cluster-3node-subprocess --summary all 2>&1 | tee reports/zig_test_macos_cluster.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - reports/zig_test_macos_cluster.log
    - reports/macos-process-*
  rules:
  - if: $CI_COMMIT_BRANCH == "ci/macos-cluster-tls-turn89"
  allow_failure: false

# Windows unit tests removed — intermittent TLS/network failures on SaaS runners
# made the job unreliable (allow_failure: true). Cross-platform coverage is provided
# by test-cross-build which cross-compiles for windows-x86_64 and windows-aarch64.

# =============================================================================
# Test Stage - ReleaseSafe Build and Test (REQ-0008 enforcement)
# CANARY: REQ=REQ-0008; FEATURE="Platform Build Requirements"; ASPECT=ReleaseSafe; STATUS=TESTED; TEST=test-zig-release-safe; OWNER=ci; UPDATED=2026-01-16
# GAP-0183: Enforces ReleaseSafe build requirements per REQ-0008
# =============================================================================

  interruptible: true

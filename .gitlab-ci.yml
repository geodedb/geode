# Note: Client libraries have moved to separate repositories:
#   - Go: https://gitlab.com/devnw/codepros/geode/geode-client-go
#   - Python: https://gitlab.com/devnw/codepros/geode/geode-client-python
#   - Rust: https://gitlab.com/devnw/codepros/geode/geode-client-rust
#   - Test Harness: https://gitlab.com/devnw/codepros/geode/geode-test-harness
# =============================================================================

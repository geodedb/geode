global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'geode-cluster'
    static_configs:
      - targets: ['geode-leader:9090']
        labels:
          node: 'leader'
          node_id: 'node-1'
      - targets: ['geode-follower-1:9090']
        labels:
          node: 'follower'
          node_id: 'node-2'
      - targets: ['geode-follower-2:9090']
        labels:
          node: 'follower'
          node_id: 'node-3'

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8404']
        labels:
          service: 'load-balancer'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
# Geode Graph Database Configuration File
# This file contains default configuration options for Geode

# Server Configuration
[server]
# Address to bind to (default: 0.0.0.0:8443)
listen = "0.0.0.0:8443"

# Data directory (default: /var/lib/geode)
data_dir = "/var/lib/geode"

# Log level: trace, debug, info, warn, error, critical (default: error for production)
# Use "info" or "debug" for development and troubleshooting
log_level = "error"

# Log directory (default: /var/log/geode)
log_dir = "/var/log/geode"

# TLS/QUIC Configuration
[tls]
# Certificate directory (default: /etc/geode/certs)
cert_dir = "/etc/geode/certs"

# Certificate file (relative to cert_dir)
cert_file = "server.crt"

# Private key file (relative to cert_dir)
key_file = "server.key"

# Enable QUIC transport (default: true)
enable_quic = true

# Security Configuration
[security]
# Enable authentication (default: true)
auth_enabled = true

# Enable audit logging (default: true)
audit_enabled = true

# Enable transparent data encryption (default: true)
tde_enabled = true

# Row-level security (default: true)
rls_enabled = true

# Performance Configuration
[performance]
# Maximum connections (default: 10000)
max_connections = 10000

# Worker threads (default: auto-detect)
# workers = 8

# Query timeout in seconds (default: 300)
query_timeout = 300

# Cache size in MB (default: 1024)
cache_size_mb = 1024

# Storage Configuration
[storage]
# Page size in bytes (default: 8192)
page_size = 8192

# WAL (Write-Ahead Log) configuration
wal_enabled = true
wal_sync_interval_ms = 100

# Checkpoint interval in seconds (default: 600)
checkpoint_interval = 600

# Features Configuration
[features]
# Enable vector similarity search (default: true)
vector_search_enabled = true

# Enable full-text search (default: true)
fulltext_search_enabled = true

# Enable materialized views (default: true)
materialized_views_enabled = true

# Enable real-time analytics (default: true)
realtime_analytics_enabled = true

# Backup Configuration
[backup]
# S3-compatible backup endpoint (optional)
# s3_endpoint = "https://s3.amazonaws.com"
# s3_bucket = "geode-backups"
# s3_access_key = ""
# s3_secret_key = ""

# Distributed Configuration
[distributed]
# Enable distributed mode (default: false)
enabled = false

# Federation nodes (comma-separated)
# federation_nodes = "node1:8443,node2:8443,node3:8443"

# Telemetry Configuration
[telemetry]
# Enable metrics collection (default: true)
metrics_enabled = true

# Metrics port (default: 9090)
metrics_port = 9090

# Enable tracing (default: false)
tracing_enabled = false

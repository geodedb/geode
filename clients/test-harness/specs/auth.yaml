version: "1.0"
name: "Authentication and Authorization Tests"
description: "Test user authentication, RBAC, and RLS features"

tests:
  - name: "create-user"
    description: "Create a new user account"
    steps:
      - type: query
        text: |
          CREATE USER testuser WITH PASSWORD 'testpass123'
        expect_error: false
    timeout_ms: 10000

  - name: "login-user"
    description: "Authenticate with username and password"
    query: "SELECT auth.login('testuser', 'testpass123') AS session"
    params: {}
    expect:
      rows: 1
      columns: ["session"]
    timeout_ms: 10000

  - name: "login-invalid-password"
    description: "Login with invalid password should fail"
    query: "SELECT auth.login('testuser', 'wrongpass') AS session"
    params: {}
    expect_error: true
    timeout_ms: 10000

  - name: "create-role"
    description: "Create a new role"
    query: |
      CREATE ROLE data_reader
      WITH PERMISSIONS ['read:data']
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000

  - name: "assign-role"
    description: "Assign role to user"
    query: |
      GRANT ROLE data_reader TO USER testuser
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000

  - name: "check-permission"
    description: "Check if user has permission"
    query: |
      SELECT auth.has_permission(
        auth.current_user_id(),
        'read:data'
      ) AS has_perm
    params: {}
    expect:
      rows: 1
      columns: ["has_perm"]
      values:
        - has_perm: true
    timeout_ms: 10000

  - name: "create-rls-policy"
    description: "Create row-level security policy"
    query: |
      CREATE POLICY user_data_policy
      ON user_data
      FOR SELECT
      USING (owner_id = auth.current_user_id())
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000

  - name: "rls-filter-test"
    description: "Verify RLS filters rows correctly"
    steps:
      - type: query
        text: |
          CREATE (u:UserData {owner_id: 1, data: 'user1 data'})
        expect:
          rows: 1
      - type: query
        text: |
          CREATE (u:UserData {owner_id: 2, data: 'user2 data'})
        expect:
          rows: 1
      - type: query
        text: |
          MATCH (u:UserData) RETURN count(u) AS total
        expect:
          rows: 1
    timeout_ms: 15000

  - name: "session-timeout"
    description: "Test session expiration"
    query: |
      SELECT auth.session_valid($token) AS valid
    params:
      token: "expired_token"
    expect:
      rows: 1
      columns: ["valid"]
      values:
        - valid: false
    timeout_ms: 10000

  - name: "logout"
    description: "Logout and invalidate session"
    query: |
      SELECT auth.logout(auth.current_session()) AS logged_out
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000

cleanup:
  - type: query
    text: "DROP USER IF EXISTS testuser"
  - type: query
    text: "DROP ROLE IF EXISTS data_reader"
  - type: query
    text: "MATCH (u:UserData) DELETE u"

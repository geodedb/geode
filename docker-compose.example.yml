# Docker Compose for Geode with Example Dataset
# Usage: docker compose -f docker-compose.example.yml up

services:
  geode:
    image: geode:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geode-example
    ports:
      - "3141:3141"  # QUIC+TLS
    volumes:
      - geode-data:/data
      - ./migrations:/migrations:ro
      - ./certs:/certs
    environment:
      - GEODE_DATA_DIR=/data
      # geode reads no LOG_LEVEL, GEODE_LOG_JSON or GEODE_CERT_PATH: the log
      # level is `--log-level`, the certificate `--cert` / `--key` (or the
      # config file's log_level, cert_path and key_path). SONNY-6435.
      # Extended type system is enabled by default
      # All indexes (Patricia, R-tree, HNSW) are automatically available
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096
    healthcheck:
      # SONNY-6442: the image's shared probe (GET /health on
      # GEODE_METRICS_PORT). The exec-form program used to be the one string
      # "/usr/local/bin/geode query", which does not exist.
      test: ["CMD", "/usr/local/bin/health-check.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geode-network

  # One-time container to load the example dataset
  dataset-loader:
    image: geode:latest
    container_name: geode-dataset-loader
    depends_on:
      geode:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: |
      sh -c "
        echo 'Waiting for Geode to be ready...'
        sleep 5
        echo 'Loading example dataset...'
        for file in /migrations/*.gql; do
          echo \"Loading $$file...\"
          geode query --host geode --port 3141 < $$file || exit 1
        done
        echo 'Dataset loaded successfully!'
        echo 'Verifying data...'
        geode query --host geode --port 3141 'MATCH (n) RETURN count(n) AS nodes'
        geode query --host geode --port 3141 'MATCH ()-[r]->() RETURN count(r) AS edges'
        echo 'Example queries you can try:'
        echo '  geode query --host localhost --port 3141 \"MATCH (u:User) WHERE u.verified = true RETURN u.username\"'
        echo '  geode query --host localhost --port 3141 \"MATCH (d:Device) WHERE ip_is_private(d.ip_address) RETURN d.id, d.ip_address\"'
        echo 'Dataset loading complete!'
      "
    networks:
      - geode-network

  # Optional: Grafana for monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: geode-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
    depends_on:
      - prometheus
    networks:
      - geode-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: geode-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    depends_on:
      - geode
    networks:
      - geode-network

volumes:
  geode-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  geode-network:
    driver: bridge

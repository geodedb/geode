# Homebrew formula (CLI tool)
# Disabled for local testing and GitLab - GitHub only
brews: []

release:
  gitlab:
    owner: devnw
    name: spyder/geode

  name_template: "Geode v{{ .Version }}"

  prerelease: auto
  draft: false

  header: |
    ## Geode v{{ .Version }}

    ISO/IEC 39075:2024 GQL-compliant property-graph database.

    ### Highlights

    <!-- Add release highlights here -->

  footer: |
    ---

    ### Installation

    **Linux (Debian/Ubuntu)**
    ```bash
    wget {{ .Env.CI_API_V4_URL }}/projects/{{ .Env.CI_PROJECT_ID }}/packages/generic/geode/{{ .Version }}/geode_{{ .Version }}_Linux_x86_64.deb
    sudo dpkg -i geode_{{ .Version }}_Linux_x86_64.deb
    ```

    **Docker**
    ```bash
    docker pull {{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}
    docker run -p 8443:8443/udp {{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}
    ```

    **Manual Installation**
    Download the appropriate archive for your platform from the assets below.

  disable: false

# Announce releases (disabled for GitLab)
announce:
  skip: true


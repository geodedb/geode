# =============================================================================
# Docker Manifests - Multi-arch tags
# =============================================================================
# Creates multi-architecture manifest lists for both registries.
# Tags follow semantic versioning with major/minor tracking for updates.
# Reference: https://goreleaser.com/customization/docker/#keeping-docker-images-updated-for-current-major

docker_manifests:
  # GitLab Registry manifests
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:latest'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

  # Major.Minor tag (e.g., v0.18 for v0.18.1)
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:v{{ .Major }}.{{ .Minor }}'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

  # Major tag (e.g., v0 for v0.18.1)
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:v{{ .Major }}'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:alpine'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64'

  # Docker Hub manifests - pushed on tag releases only
- name_template: docker.io/geodedb/geode:{{ .Version }}
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-amd64
  - docker.io/geodedb/geode:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode:latest
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-amd64
  - docker.io/geodedb/geode:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

  # Major.Minor tag for Docker Hub (e.g., v0.18 for v0.18.1)
- name_template: docker.io/geodedb/geode:v{{ .Major }}.{{ .Minor }}
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-amd64
  - docker.io/geodedb/geode:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

  # Major tag for Docker Hub (e.g., v0 for v0.18.1)
- name_template: docker.io/geodedb/geode:v{{ .Major }}
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-amd64
  - docker.io/geodedb/geode:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode:alpine
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-alpine-amd64
  - docker.io/geodedb/geode:{{ .Version }}-alpine-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode:{{ .Version }}-alpine
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-alpine-amd64
  - docker.io/geodedb/geode:{{ .Version }}-alpine-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

  # GPU tags - x86_64 only (NVIDIA CUDA doesn't support ARM64 cross-compilation)
  # Note: GPU images don't need manifests since they're single-arch (amd64 only)
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:gpu'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-gpu'

- name_template: docker.io/geodedb/geode:gpu
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-gpu
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode:v{{ .Major }}.{{ .Minor }}-gpu
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-gpu
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:v{{ .Major }}.{{ .Minor }}-gpu'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-gpu'

  # FIPS manifests (amd64 single-arch — no multi-arch, amd64-only validated provider)
  # GitLab Registry FIPS manifests
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-fips'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-fips-amd64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:latest-fips'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-fips-amd64'

  # Docker Hub FIPS manifests
- name_template: docker.io/geodedb/geode:{{ .Version }}-fips
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-fips-amd64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode:latest-fips
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-fips-amd64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

# =============================================================================
# System Packages - nFPM (deb, rpm, apk)
# =============================================================================

nfpms:
- id: geode-packages
  package_name: geode
  ids:
  - geode
  vendor: CodePros
  homepage: https://gitlab.com/devnw/codepros/geode/geode
  maintainer: Geode Team <geode@codepros.dev>
  description: |-
    Geode Graph Database - ISO/IEC 39075:2024 GQL-compliant property-graph database.

    Geode is a high-performance graph database implementing the GQL standard
    with ACID guarantees, QUIC/TLS transport, and enterprise security features.
  license: Apache-2.0
  formats:
  - deb
  - rpm
  - apk
  bindir: /usr/bin
  section: database
  priority: optional
  provides:
  - geode
  dependencies:
  - ca-certificates
  recommends:
  - openssl
  file_name_template: >-
    {{ .ProjectName }}_{{ .Version }}_
    {{- if eq .Os "linux" }}Linux{{- else }}{{ title .Os }}{{ end }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else if eq .Arch "386" }}i386
    {{- else if eq .Arch "arm" }}armv{{ .Arm }}
    {{- else if eq .Arch "arm64" }}arm64
    {{- else if eq .Arch "riscv64" }}riscv64
    {{- else }}{{ .Arch }}{{ end }}
  contents:
      # Documentation
  - src: README.md
    dst: /usr/share/doc/geode/README.md
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/geode/LICENSE
    file_info:
      mode: 0644

  - src: docs/QUICK_REFERENCE.md
    dst: /usr/share/doc/geode/QUICK_REFERENCE.md
    file_info:
      mode: 0644

      # Data directory
  - dst: /var/lib/geode
    type: dir
    file_info:
      mode: 0750

      # Log directory
  - dst: /var/log/geode
    type: dir
    file_info:
      mode: 0750

      # Certificate directory — world-traversable so system users can read
      # the public cert (server.crt 0644); private key remains 0600
  - dst: /etc/geode/certs
    type: dir
    file_info:
      mode: 0755

      # Systemd service file
  - src: deployment/systemd/geode.service
    dst: /lib/systemd/system/geode.service
    file_info:
      mode: 0644

      # Systemd template service (for multi-instance)
  - src: deployment/systemd/geode@.service
    dst: /lib/systemd/system/geode@.service
    file_info:
      mode: 0644

      # Default configuration directory
  - dst: /etc/geode
    type: dir
    file_info:
      mode: 0755

      # QUIC/UDP system tuning helper + canonical sysctl drop-in.
      # Invoked by scripts/packaging/postinstall.sh at install time and available
      # to operators for apply/revert/check. Source of truth:
      # devnw/zig/quic docs/SYSTEM_TUNING.md.
  - src: deployment/scripts/tune-system.sh
    dst: /usr/share/geode/deployment/scripts/tune-system.sh
    file_info:
      mode: 0755

  - src: deployment/sysctl.d/99-geode-quic.conf
    dst: /usr/share/geode/deployment/sysctl.d/99-geode-quic.conf
    file_info:
      mode: 0644

  # Issue #379: Use xz compression for .deb packages (supported everywhere,
  # standard for modern dpkg). Previously used zstd but GoReleaser v2.13.3/nfpm
  # has a bug where the AR archive member offset can be misaligned by 2 bytes,
  # producing a corrupt .deb (bad archive header magic). xz avoids this.
  deb:
    compression: xz

  rpm:
    compression: xz

  overrides:
    deb:
      dependencies:
      - ca-certificates
      - libssl3
      recommends:
      - libvulkan1
    rpm:
      dependencies:
      - ca-certificates
      - openssl-libs
    apk:
      dependencies:
      - ca-certificates
      - libssl3

  scripts:
    preinstall: scripts/packaging/preinstall.sh
    postinstall: scripts/packaging/postinstall.sh
    preremove: scripts/packaging/preremove.sh
    postremove: scripts/packaging/postremove.sh

# =============================================================================
# GitLab Release
# =============================================================================

release:
  # Disable GoReleaser's release publishing - CI_JOB_TOKEN lacks API permissions
  # GitLab's native release: keyword in .gitlab-ci.yml handles release creation instead
  disable: true

  name_template: Geode v{{ .Version }}

  prerelease: auto
  draft: false

  header: |
    ## Geode v{{ .Version }}

    **ISO/IEC 39075:2024 GQL-compliant property-graph database.**

    ### Highlights

    - 98.6% GQL Compliance
    - Enterprise Security (TDE, RLS, Audit Logging)
    - QUIC/TLS Transport
    - Multi-platform Support

  footer: |
    ---

    ### Installation

    **Linux (Debian/Ubuntu)**
    ```bash
    # Download and install (requires dpkg 1.21.18+ / Ubuntu 22.04+ / Debian 12+)
    curl -fLO https://gitlab.com/devnw/codepros/geode/geode/-/releases/v{{ .Version }}/downloads/geode_{{ .Version }}_Linux_x86_64.deb
    sudo dpkg -i geode_{{ .Version }}_Linux_x86_64.deb
    ```

    **Linux (RHEL/Fedora)**
    ```bash
    curl -fLO https://gitlab.com/devnw/codepros/geode/geode/-/releases/v{{ .Version }}/downloads/geode_{{ .Version }}_Linux_x86_64.rpm
    sudo rpm -i geode_{{ .Version }}_Linux_x86_64.rpm
    ```

    **Docker (Docker Hub)**
    ```bash
    docker pull geodedb/geode:{{ .Version }}
    docker run -p 3141:3141/udp geodedb/geode:{{ .Version }}
    ```

    **Docker (GPU-enabled)**
    ```bash
    docker pull geodedb/geode:{{ .Version }}-gpu
    docker run --gpus all -p 3141:3141/udp geodedb/geode:{{ .Version }}-gpu
    ```

    **Docker (GitLab Registry)**
    ```bash
    docker pull {{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}
    docker run -p 3141:3141/udp {{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}
    ```

    **macOS (Homebrew)**
    ```bash
    brew install geodedb/geode/geode
    ```

    **Binary Download**
    Download the appropriate archive for your platform from the assets below.

  extra_files:
  - glob: ./dist/*.deb
  - glob: ./dist/*.rpm
  - glob: ./dist/*.apk

# =============================================================================
# Homebrew Tap
# =============================================================================
# Publishes to geodedb/homebrew-geode on GitHub.
# Requires HOMEBREW_TAP_TOKEN (GitHub PAT) with write access to the repo.
# Note: Uses the macOS universal binary created by universal_binaries section.
# Install: brew install geodedb/geode/geode

brews:
- name: geode
  ids:
  - geode-universal-archive
  repository:
    owner: geodedb
    name: homebrew-geode
    token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
  # URL points to GitLab Generic Package Registry (permanent, does not expire)
  url_template: https://gitlab.com/api/v4/projects/devnw%2Fcodepros%2Fgeode%2Fgeode/packages/generic/geode/{{ .Version }}/{{ .ArtifactName }}
  commit_author:
    name: geode-bot
    email: geode-bot@codepros.dev
  commit_msg_template: Brew formula update for {{ .ProjectName }} version {{ .Tag }}
  directory: Formula
  homepage: https://geodedb.com
  description: ISO/IEC 39075:2024 GQL-compliant property-graph database
  license: Apache-2.0
  skip_upload: auto
  dependencies:
  - name: openssl@3
  caveats: |
    Geode Graph Database has been installed!

    Note: This is Geode Graph Database (geodedb.com), not Apache Geode.

    To start the server:
      geode serve --listen 0.0.0.0:3141

    To use the interactive shell:
      geode shell

    To run as a service:
      brew services start geode

    Data: #{var}/lib/geode
    Logs: #{var}/log/geode

    Documentation: https://geodedb.com/docs
  test: |
    system "#{bin}/geode", "--version"
  install: |
    bin.install "geode"
    (var/"lib/geode").mkpath
    (var/"log/geode").mkpath
    (etc/"geode").mkpath
    (etc/"geode/certs").mkpath
  service: |
    run [opt_bin/"geode", "serve", "--listen", "0.0.0.0:3141", "--data-dir", var/"lib/geode"]
    keep_alive true
    working_dir var/"lib/geode"
    log_path var/"log/geode/geode.log"
    error_log_path var/"log/geode/geode.error.log"

# =============================================================================
# Universal Binaries (macOS)
# =============================================================================

universal_binaries:
- id: geode-universal
  ids:
  - geode
  name_template: geode
  replace: true


    ids:
      - geode
    name_template: "geode"
    replace: true

# =============================================================================
# Announce (disabled - configure webhooks in GitLab)
# =============================================================================

announce:
  skip: true

# =============================================================================
# Metadata
# =============================================================================

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"


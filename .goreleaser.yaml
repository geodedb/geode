version: 2

project_name: geode

# Both GITHUB_TOKEN and GITLAB_TOKEN exist in the CI environment; GoReleaser
# refuses to guess ("multiple tokens found, but only one is allowed" —
# pipeline #1518 snapshot). This project releases to GitLab.
force_token: gitlab

# Note: GoReleaser Pro features may be enabled via CI/CD with GORELEASER_KEY
# This configuration works with both free and Pro versions

before:
  hooks:
    # Ensure clean state
  - rm -rf dist/

# =============================================================================
# Zig Cross-Compilation Builds
# =============================================================================
# Using GoReleaser's native Zig builder for cross-compilation
# Reference: https://goreleaser.com/customization/builds/zig/

builds:
- id: geode
  builder: zig
  binary: geode
  dir: .
  command: build
  flags:
  - -Doptimize=ReleaseSafe
  targets:
    # BEGIN GENERATED ZIG TARGETS (tools/release_target_manifest.py)
  - x86_64-linux-gnu
  - x86_64-linux-musl
  - aarch64-linux-gnu
  - aarch64-linux-musl
  - riscv64-linux-gnu
  - x86_64-macos
  - aarch64-macos
    # END GENERATED ZIG TARGETS
    # Windows targets are intentionally excluded due to QUIC library socket type incompatibilities.
    # Re-enable once vendor/quic Windows socket support is available.

  # FIPS-validated build: amd64-only, dynamically links the validated OpenSSL
  # FIPS provider. The provider must be present at /usr/local/ssl on the BUILD
  # host (see GoReleaser build-env concern in release notes / CI design).
  # NOTE: GoReleaser's zig builder runs inside the build-release docker:dind
  # container which uses docker:latest + zig installed via zvm — that image does
  # NOT include the FIPS provider. As a result, this build will fail in the
  # standard build-release job unless the job image is changed to one that has
  # /usr/local/ssl (e.g. the ci-catalog/zig-fips image, or a pre-install step).
  # The CI gap is documented; a follow-up job override or image change is needed.
- id: geode-fips
  builder: zig
  binary: geode
  dir: .
  command: build
  flags:
  - -Doptimize=ReleaseSafe
  - -Dfips=true
  - -Dopenssl_path=/usr/local/ssl
  targets:
  - x86_64-linux-gnu

# =============================================================================
# Archives - Binary Distribution
# =============================================================================

archives:
- id: geode-archives
  ids:
  - geode
    # Use Target directly which contains the full Zig target string
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Target }}'
  format_overrides:
  - goos: windows
    formats: [zip]
  files:
  - README.md
  - LICENSE
  - docs/QUICK_REFERENCE.md
  - docs/API_REFERENCE.md

  # FIPS binary archive (amd64/x86_64-linux-gnu only)
- id: geode-fips-archives
  ids:
  - geode-fips
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Target }}-fips'
  files:
  - README.md
  - LICENSE
  - docs/QUICK_REFERENCE.md
  - docs/API_REFERENCE.md

  # Archive for macOS universal binary (used by Homebrew)
- id: geode-universal-archive
  ids:
  - geode-universal
  name_template: '{{ .ProjectName }}_{{ .Version }}_darwin_universal'
  files:
  - README.md
  - LICENSE
  - docs/QUICK_REFERENCE.md
  - docs/API_REFERENCE.md


# =============================================================================
# Checksums
# =============================================================================

checksum:
  name_template: checksums.txt
  algorithm: sha256

# =============================================================================
# Snapshots
# =============================================================================

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

# =============================================================================
# Changelog Generation
# =============================================================================

changelog:
  sort: asc
  use: git
  groups:
  - title: Breaking Changes
    regexp: ^.*!:.*$
    order: 0
  - title: Features
    regexp: ^.*feat(\(.+\))?:.*$
    order: 1
  - title: Bug Fixes
    regexp: ^.*fix(\(.+\))?:.*$
    order: 2
  - title: Security
    regexp: ^.*sec(\(.+\))?:.*$
    order: 3
  - title: Performance
    regexp: ^.*perf(\(.+\))?:.*$
    order: 4
  - title: Documentation
    regexp: ^.*docs(\(.+\))?:.*$
    order: 5
  - title: Other
    order: 999
  filters:
    exclude:
    - '^chore:'
    - '^style:'
    - Merge pull request
    - Merge branch

# =============================================================================
# Docker Images - Multi-Architecture
# =============================================================================
# Publishes to both GitLab Container Registry and Docker Hub.
# Docker Hub push requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN CI variables.
# Reference: https://goreleaser.com/customization/docker/#keeping-docker-images-updated-for-current-major

dockers:
  # Debian-based images - GitLab Registry
- id: geode-debian-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  dockerfile: Dockerfile.release
  extra_files:
  - docker
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source={{.GitURL}}
  - --label=org.opencontainers.image.description=Geode Graph Database - GQL-compliant property-graph database
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-debian-arm64
  ids:
  - geode
  goos: linux
  goarch: arm64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'
  dockerfile: Dockerfile.release
  extra_files:
  - docker
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

  # Alpine-based images (smaller, musl-linked) - GitLab Registry
- id: geode-alpine-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  dockerfile: Dockerfile.release.alpine
  extra_files:
  - docker
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

- id: geode-alpine-arm64
  ids:
  - geode
  goos: linux
  goarch: arm64
  image_templates:

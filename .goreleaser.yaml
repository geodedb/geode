version: 2

project_name: geode

# Note: GoReleaser Pro features enabled via CI/CD with GORELEASER_KEY
# Pro features used: GitHub attestations, enhanced caching, improved performance

before:
  hooks:
    # Binaries are built separately by GitLab CI with Zig
    # They are placed in dist/ directory before GoReleaser runs
    # No need to rebuild here - just package what's already built

# Zig builds are handled separately (make release or GitLab CI)
# GoReleaser is used only for packaging, not building
builds:
  - id: geode
    skip: true

# Create archives from pre-built binaries
archives:
  - id: geode-archives
    # Package pre-built binaries into versioned archives
    # Use meta mode since we're packaging without GoReleaser builds
    meta: true
    name_template: "geode_{{ .Version }}"
    formats:
      - tar.gz
      - zip
    files:
      # Include binaries from Zig build output
      # Local builds: zig-out/bin/*
      # CI builds: dist/*
      - "zig-out/bin/*"
      # Include documentation
      - README.md
      - LICENSE
      - "docs/**/*"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Branch }}-{{ .ShortCommit }}-snapshot"

# Nightly builds (GoReleaser Pro feature)
# Automatic nightly releases for development/testing
# Triggered via GitHub Actions workflow (.github/workflows/nightly.yml) on schedule
# Note: This configuration is handled by the nightly workflow with --nightly flag
# The workflow uses: goreleaser release --nightly --clean
# Features:
# - Automatic nightly releases at 2 AM UTC
# - Only builds if commits in last 24 hours
# - Names: geode-nightly-YYYYMMDD
# - Publishes as pre-release
# - Docker images tagged as :nightly
# - Keeps last 7 nightly releases

changelog:
  sort: asc
  use: github
  groups:
    - title: "Breaking Changes"
      regexp: '^.*!:.*$'
      order: 0
    - title: "Features"
      regexp: '^.*feat(\(.+\))?:.*$'
      order: 1
    - title: "Bug Fixes"
      regexp: '^.*fix(\(.+\))?:.*$'
      order: 2
    - title: "Security"
      regexp: '^.*sec(\(.+\))?:.*$'
      order: 3
    - title: "Performance"
      regexp: '^.*perf(\(.+\))?:.*$'
      order: 4
    - title: "Documentation"
      regexp: '^.*docs(\(.+\))?:.*$'
      order: 5
    - title: "Refactor"
      regexp: '^.*refactor(\(.+\))?:.*$'
      order: 6
    - title: "Tests"
      regexp: '^.*test(\(.+\))?:.*$'
      order: 7
    - title: "CI/CD"
      regexp: '^.*ci(\(.+\))?:.*$'
      order: 8
    - title: "Build System"
      regexp: '^.*build(\(.+\))?:.*$'
      order: 9
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^style:'
      - 'Merge pull request'
      - 'Merge branch'


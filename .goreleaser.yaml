version: 2

project_name: geode

# Note: GoReleaser Pro features may be enabled via CI/CD with GORELEASER_KEY
# This configuration works with both free and Pro versions

before:
  hooks:
    # Ensure clean state
  - rm -rf dist/

# =============================================================================
# Zig Cross-Compilation Builds
# =============================================================================
# Using GoReleaser's native Zig builder for cross-compilation
# Reference: https://goreleaser.com/customization/builds/zig/

builds:
- id: geode
  builder: zig
  binary: geode
  dir: .
  command: build
  flags:
  - -Doptimize=ReleaseSafe
  targets:
      # Linux targets
  - x86_64-linux-gnu
  - x86_64-linux-musl
  - aarch64-linux-gnu
  - aarch64-linux-musl
  - arm-linux-gnueabihf
  - riscv64-linux-gnu
      # macOS targets
  - x86_64-macos
  - aarch64-macos
      # Windows targets - currently disabled due to QUIC library socket type incompatibilities
      # TODO: Re-enable when vendor/quic adds Windows socket support
      # - x86_64-windows
      # - aarch64-windows

# =============================================================================
# Archives - Binary Distribution
# =============================================================================

archives:
- id: geode-archives
  ids:
  - geode
    # Use Target directly which contains the full Zig target string
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Target }}'
  format_overrides:
  - goos: windows
    formats: [zip]
  files:
  - README.md
  - LICENSE
  - docs/QUICK_REFERENCE.md
  - docs/API_REFERENCE.md

# =============================================================================
# Checksums
# =============================================================================

checksum:
  name_template: checksums.txt
  algorithm: sha256

# =============================================================================
# Snapshots
# =============================================================================

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

# =============================================================================
# Changelog Generation
# =============================================================================

changelog:
  sort: asc
  use: git
  groups:
  - title: Breaking Changes
    regexp: ^.*!:.*$
    order: 0
  - title: Features
    regexp: ^.*feat(\(.+\))?:.*$
    order: 1
  - title: Bug Fixes
    regexp: ^.*fix(\(.+\))?:.*$
    order: 2
  - title: Security
    regexp: ^.*sec(\(.+\))?:.*$
    order: 3
  - title: Performance
    regexp: ^.*perf(\(.+\))?:.*$
    order: 4
  - title: Documentation
    regexp: ^.*docs(\(.+\))?:.*$
    order: 5
  - title: Other
    order: 999
  filters:
    exclude:
    - '^chore:'
    - '^style:'
    - Merge pull request
    - Merge branch

# =============================================================================
# Docker Images - Multi-Architecture
# =============================================================================
# Publishes to both GitLab Container Registry and Docker Hub.
# Docker Hub push requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN CI variables.
# Reference: https://goreleaser.com/customization/docker/#keeping-docker-images-updated-for-current-major

dockers:
  # Debian-based images - GitLab Registry
- id: geode-debian-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  dockerfile: Dockerfile.release
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source={{.GitURL}}
  - --label=org.opencontainers.image.description=Geode Graph Database - GQL-compliant property-graph database
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-debian-arm64
  ids:
  - geode
  goos: linux
  goarch: arm64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'
  dockerfile: Dockerfile.release
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

  # Alpine-based images (smaller, musl-linked) - GitLab Registry
- id: geode-alpine-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  dockerfile: Dockerfile.release.alpine
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

- id: geode-alpine-arm64
  ids:
  - geode
  goos: linux
  goarch: arm64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64'
  dockerfile: Dockerfile.release.alpine
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

  # Docker Hub images - Debian-based
  # Requires: docker login docker.io before running goreleaser
- id: geode-dockerhub-debian-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-amd64
  dockerfile: Dockerfile.release
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source=https://gitlab.com/devnw/codepros/geode/geode
  - --label=org.opencontainers.image.description=Geode Graph Database - GQL-compliant property-graph database
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-dockerhub-debian-arm64
  ids:
  - geode
  goos: linux
  goarch: arm64
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-arm64
  dockerfile: Dockerfile.release
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

  # Docker Hub images - Alpine-based
- id: geode-dockerhub-alpine-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-alpine-amd64
  dockerfile: Dockerfile.release.alpine
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

- id: geode-dockerhub-alpine-arm64
  ids:
  - geode
  goos: linux
  goarch: arm64
  image_templates:
  - docker.io/geodedb/geode:{{ .Version }}-alpine-arm64
  dockerfile: Dockerfile.release.alpine
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}

  # GPU-enabled images (NVIDIA CUDA) - GitLab Registry
  # Note: GPU images are x86_64 only - NVIDIA CUDA doesn't support ARM64 well under QEMU
- id: geode-gpu-amd64
  ids:
  - geode
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-gpu'
  dockerfile: Dockerfile.release.gpu
  use: buildx

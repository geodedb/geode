version: 2

project_name: geode

# Note: GoReleaser Pro features may be enabled via CI/CD with GORELEASER_KEY
# This configuration works with both free and Pro versions

before:
  hooks:
    # Ensure clean state
    - rm -rf dist/

# =============================================================================
# Zig Cross-Compilation Builds
# =============================================================================
# Using GoReleaser's native Zig builder for cross-compilation
# Reference: https://goreleaser.com/customization/builds/zig/

builds:
  - id: geode
    builder: zig
    binary: geode
    dir: .
    command: build
    flags:
      - "-Doptimize=ReleaseSafe"
    targets:
      # Linux targets
      - x86_64-linux-gnu
      - x86_64-linux-musl
      - aarch64-linux-gnu
      - aarch64-linux-musl
      - arm-linux-gnueabihf
      - riscv64-linux-gnu
      # macOS targets
      - x86_64-macos
      - aarch64-macos
      # Windows targets - currently disabled due to QUIC library socket type incompatibilities
      # TODO: Re-enable when vendor/quic adds Windows socket support
      # - x86_64-windows
      # - aarch64-windows

# =============================================================================
# Archives - Binary Distribution
# =============================================================================

archives:
  - id: geode-archives
    ids:
      - geode
    # Use Target directly which contains the full Zig target string
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Target }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/QUICK_REFERENCE.md
      - docs/API_REFERENCE.md

# =============================================================================
# Checksums
# =============================================================================

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# =============================================================================
# Snapshots
# =============================================================================

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# =============================================================================
# Changelog Generation
# =============================================================================

changelog:
  sort: asc
  use: git
  groups:
    - title: "Breaking Changes"
      regexp: '^.*!:.*$'
      order: 0
    - title: "Features"
      regexp: '^.*feat(\(.+\))?:.*$'
      order: 1
    - title: "Bug Fixes"
      regexp: '^.*fix(\(.+\))?:.*$'
      order: 2
    - title: "Security"
      regexp: '^.*sec(\(.+\))?:.*$'
      order: 3
    - title: "Performance"
      regexp: '^.*perf(\(.+\))?:.*$'
      order: 4
    - title: "Documentation"
      regexp: '^.*docs(\(.+\))?:.*$'
      order: 5
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^style:'
      - 'Merge pull request'
      - 'Merge branch'

# =============================================================================
# Docker Images - Multi-Architecture
# =============================================================================

dockers:
  # Debian-based images
  - id: geode-debian-amd64
    ids:
      - geode
    goos: linux
    goarch: amd64
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64"
    dockerfile: Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.description=Geode Graph Database - GQL-compliant property-graph database"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: geode-debian-arm64
    ids:
      - geode
    goos: linux
    goarch: arm64
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64"
    dockerfile: Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  # Alpine-based images (smaller)
  - id: geode-alpine-amd64
    ids:
      - geode
    goos: linux
    goarch: amd64
    goamd64: v1
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64"
    dockerfile: Dockerfile.release.alpine
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}-alpine"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  - id: geode-alpine-arm64
    ids:
      - geode
    goos: linux
    goarch: arm64
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64"
    dockerfile: Dockerfile.release.alpine
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}-alpine"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

# =============================================================================
# Docker Manifests - Multi-arch tags
# =============================================================================

docker_manifests:
  - name_template: "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}"
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64"

  - name_template: "{{ .Env.CI_REGISTRY_IMAGE }}:latest"
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64"

  - name_template: "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64"

  - name_template: "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Major }}"
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64"

  - name_template: "{{ .Env.CI_REGISTRY_IMAGE }}:alpine"
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64"
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64"

  - name_template: "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine"
    image_templates:
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64"
      - "{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64"

# =============================================================================
# System Packages - nFPM (deb, rpm, apk)
# =============================================================================

nfpms:
  - id: geode-packages
    package_name: geode
    ids:
      - geode
    vendor: Spyder
    homepage: https://gitlab.com/devnw/geode/geode
    maintainer: Geode Team <geode@devnw.com>
    description: |-
      Geode Graph Database - ISO/IEC 39075:2024 GQL-compliant property-graph database.

      Geode is a high-performance graph database implementing the GQL standard
      with ACID guarantees, QUIC/TLS transport, and enterprise security features.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: database
    priority: optional
    provides:
      - geode
    dependencies:
      - ca-certificates
    recommends:
      - openssl
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "linux" }}Linux{{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else if eq .Arch "arm64" }}arm64
      {{- else if eq .Arch "riscv64" }}riscv64
      {{- else }}{{ .Arch }}{{ end }}
    contents:
      # Documentation
      - src: README.md
        dst: /usr/share/doc/geode/README.md
        file_info:
          mode: 0644

      - src: LICENSE
        dst: /usr/share/doc/geode/LICENSE
        file_info:
          mode: 0644

      - src: docs/QUICK_REFERENCE.md
        dst: /usr/share/doc/geode/QUICK_REFERENCE.md
        file_info:
          mode: 0644

      # Data directory
      - dst: /var/lib/geode
        type: dir
        file_info:
          mode: 0750

      # Log directory
      - dst: /var/log/geode
        type: dir
        file_info:
          mode: 0750

      # Certificate directory
      - dst: /etc/geode/certs
        type: dir
        file_info:
          mode: 0700

      # Systemd service file
      - src: deployment/systemd/geode.service
        dst: /lib/systemd/system/geode.service
        file_info:
          mode: 0644

      # Systemd template service (for multi-instance)
      - src: deployment/systemd/geode@.service
        dst: /lib/systemd/system/geode@.service
        file_info:
          mode: 0644

      # Default configuration directory
      - dst: /etc/geode
        type: dir
        file_info:
          mode: 0755

    overrides:
      deb:
        dependencies:
          - ca-certificates
          - libssl3
        recommends:
          - libvulkan1
      rpm:
        dependencies:
          - ca-certificates
          - openssl-libs
      apk:
        dependencies:
          - ca-certificates
          - libssl3

    scripts:
      postinstall: scripts/packaging/postinstall.sh
      preremove: scripts/packaging/preremove.sh
      postremove: scripts/packaging/postremove.sh

# =============================================================================
# GitLab Release
# =============================================================================

release:
  gitlab:
    owner: devnw
    name: geode/geode

  name_template: "Geode v{{ .Version }}"

  prerelease: auto
  draft: false

  header: |
    ## Geode v{{ .Version }}

    **ISO/IEC 39075:2024 GQL-compliant property-graph database.**

    ### Highlights

    - 98.6% GQL Compliance
    - Enterprise Security (TDE, RLS, Audit Logging)
    - QUIC/TLS Transport
    - Multi-platform Support

  footer: |
    ---

    ### Installation

    **Linux (Debian/Ubuntu)**
    ```bash
    # Download and install
    wget https://gitlab.com/devnw/geode/geode/-/releases/v{{ .Version }}/downloads/geode_{{ .Version }}_Linux_x86_64.deb
    sudo dpkg -i geode_{{ .Version }}_Linux_x86_64.deb
    ```

    **Linux (RHEL/Fedora)**
    ```bash
    wget https://gitlab.com/devnw/geode/geode/-/releases/v{{ .Version }}/downloads/geode_{{ .Version }}_Linux_x86_64.rpm
    sudo rpm -i geode_{{ .Version }}_Linux_x86_64.rpm
    ```

    **Docker**
    ```bash
    docker pull {{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}
    docker run -p 8443:8443/udp {{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}
    ```

    **macOS (Homebrew)**
    ```bash
    brew tap devnw/geode
    brew install geode
    ```

    **Binary Download**
    Download the appropriate archive for your platform from the assets below.

  disable: false

  extra_files:
    - glob: ./dist/*.deb
    - glob: ./dist/*.rpm
    - glob: ./dist/*.apk


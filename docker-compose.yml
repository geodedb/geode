# Geode Graph Database - Production Deployment Stack
# Complete infrastructure with monitoring, logging, secrets management, and storage

services:
  # HashiCorp Vault - Secrets Management
  vault:
    image: hashicorp/vault:1.15
    container_name: geode-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: 'http://0.0.0.0:8200'
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-geode-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - geode-network

  # MinIO - S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: geode-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-geode-minio-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-CHANGE-ME-minio-secret-key-12345}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - geode-network

  # Redis - Caching Layer
  redis:
    image: redis:7-alpine
    container_name: geode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE-ME-redis-password-12345}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - geode-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: geode-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geode-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: geode-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-CHANGE-ME-grafana-admin-12345}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geode-network
    depends_on:
      - prometheus

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: geode-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geode-network

  # Promtail - Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: geode-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - geode-logs:/var/log/geode:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - geode-network
    depends_on:
      - loki

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: geode-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geode-network
    depends_on:
      - grafana
      - prometheus
      - minio
      - vault

  # Geode Database - Main Service
  geode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ZIG_VERSION: "0.15.1"
        TARGETARCH: amd64
    image: geode:latest
    container_name: geode-db
    restart: unless-stopped
    ports:
      - "8443:8443/udp"  # QUIC protocol
      - "9091:9091/tcp"  # Metrics endpoint
    environment:
      - LOG_LEVEL=${GEODE_LOG_LEVEL:-info}
      - GEODE_DATA_DIR=${GEODE_DATA_DIR:-/data}
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-geode-dev-token}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-CHANGE-ME-redis-password-12345}@redis:6379
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-geode-minio-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-CHANGE-ME-minio-secret-key-12345}
      - S3_BUCKET=${S3_BUCKET:-geode-backups}
      - FIPS_MODE=enabled
      - OPENSSL_CONF=/opt/openssl-fips/ssl/openssl.cnf
    volumes:
      - geode-data:/data
      - geode-logs:/var/log/geode
      - ./certs:/certs:ro
    command:
      - "serve"
      - "--data-dir"
      - "/data"
      - "--listen"
      - "0.0.0.0:8443"
      - "--cert"
      - "/certs/server.crt"
      - "--key"
      - "/certs/server.key"
    healthcheck:
      test: ["CMD", "geode", "query", "RETURN 1 AS health", "--server", "127.0.0.1:8443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - geode-network
    depends_on:
      vault:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Geode CLI - Debug/Admin Container
  geode-cli:
    image: geode:latest
    container_name: geode-cli
    entrypoint: ["/bin/sh"]
    command: ["-c", "sleep infinity"]
    volumes:
      - ./certs:/certs:ro
    networks:
      - geode-network
    profiles:
      - debug

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  geode-data:
    driver: local
  geode-logs:
    driver: local
  nginx-logs:
    driver: local
  geode-certs:
    driver: local

networks:
  geode-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${GEODE_NETWORK_SUBNET:-172.28.0.0/16}

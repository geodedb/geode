# Docker Compose for Geode - Singleton Deployment

services:
  geode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geode-singleton
    hostname: geode-node
    ports:
      - "7567:7567/udp"  # QUIC
      - "7568:7568/tcp"  # TCP (legacy)
      - "9090:9090"      # Metrics
    volumes:
      - geode-data:/data
      - geode-certs:/certs
      - ./certs:/certs:ro  # Mount local certs if available
    environment:
      - GEODE_LOG_LEVEL=info
      - GEODE_MAX_CONNECTIONS=1000
      - GEODE_CACHE_SIZE=1GB
      - GEODE_WAL_SIZE_LIMIT=10GB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "geodec", "RETURN 1 AS health", "--server", "127.0.0.1:7567"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - geode-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Optional: Geode CLI client for testing
  geode-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: geode-cli
    entrypoint: /bin/sh
    command: -c "sleep infinity"
    volumes:
      - geode-certs:/certs:ro
    networks:
      - geode-net
    profiles:
      - debug

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: geode-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9091:9090"
    networks:
      - geode-net
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: geode-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    networks:
      - geode-net
    profiles:
      - monitoring

volumes:
  geode-data:
    driver: local
  geode-certs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  geode-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
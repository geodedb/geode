services:
  geode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geode-singleton
    hostname: geode-node
    ports:
      - '3141:3141/udp'
      - '9090:9090'
    volumes:
      - geode-data:/data
      - geode-certs:/certs
      - ./certs:/certs:ro
    environment:
      - GEODE_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'geode', 'query', 'RETURN 1 AS health', '--server', '127.0.0.1:3141']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - geode-net
    entrypoint: ["/usr/local/bin/geode", "serve"]
    command: ["--data-dir", "/data", "--listen", "0.0.0.0:3141", "--log-level", "info"]

  geode-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: geode-cli
    entrypoint: [/bin/sh]
    command: -c "sleep infinity"
    volumes:
      - geode-certs:/certs:ro
    networks:
      - geode-net
    profiles:
      - debug

  prometheus:
    image: prom/prometheus:latest
    container_name: geode-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9091:9090'
    networks:
      - geode-net
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: geode-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - '3000:3000'
    networks:
      - geode-net
    profiles:
      - monitoring

volumes:
  geode-data: {driver: local}
  geode-certs: {driver: local}
  prometheus-data: {driver: local}
  grafana-data: {driver: local}

networks:
  geode-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

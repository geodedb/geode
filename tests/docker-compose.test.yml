services:
  geode:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: geode-test
    ports:
    - 7567:7567/udp
    volumes:
    - ./data:/data
    environment:
    - GEODE_LOG_LEVEL=debug
    entrypoint: [/usr/local/bin/geode, serve]
    command: [--listen, 0.0.0.0:7567, --data-dir, /data, --log-level, debug]
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        limits:
          pids: 4096  # SONNY-6453: not pids_limit (Compose refuses both)
    healthcheck:
      # SONNY-6453: a release `geode query` with no --ca-cert is refused.
      test: [CMD, /usr/local/bin/health-check.sh]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

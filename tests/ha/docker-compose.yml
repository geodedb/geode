version: '3.8'

services:
  # Base Geode Nodes
  node-1:
    image: geode:test
    hostname: node-1
    container_name: ha-node-1
    environment:
      - NODE_ID=node-1
      - NODE_ROLE=leader
      - CLUSTER_NAME=ha-test-cluster
      - RAFT_PORT=6282
      - RAFT_PEERS=node-2:6282,node-3:6282
      - LOG_LEVEL=info
      - GEODE_DISTRIBUTED=true
    command: >
      --listen 0.0.0.0:3141
      --data-dir /data
      --node-id node-1
      --raft-bind 0.0.0.0:6282
      --raft-advertise node-1:6282
      --bootstrap-expect 3
      --log-json
    volumes:
      - node1-data:/data
    networks:
      - ha-net
    healthcheck:
      test: ["CMD", "geode", "query", "RETURN 1", "--server", "127.0.0.1:3141", "--insecure"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    privileged: true

  node-2:
    image: geode:test
    hostname: node-2
    container_name: ha-node-2
    environment:
      - NODE_ID=node-2
      - NODE_ROLE=follower
      - CLUSTER_NAME=ha-test-cluster
      - RAFT_PORT=6282
      - RAFT_JOIN=node-1:6282
      - LOG_LEVEL=info
      - GEODE_DISTRIBUTED=true
    command: >
      --listen 0.0.0.0:3141
      --data-dir /data
      --node-id node-2
      --raft-bind 0.0.0.0:6282
      --raft-advertise node-2:6282
      --raft-join node-1:6282
      --log-json
    volumes:
      - node2-data:/data
    networks:
      - ha-net
    depends_on:
      - node-1
    healthcheck:
      test: ["CMD", "geode", "query", "RETURN 1", "--server", "127.0.0.1:3141", "--insecure"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    privileged: true

  node-3:
    image: geode:test
    hostname: node-3
    container_name: ha-node-3
    environment:
      - NODE_ID=node-3
      - NODE_ROLE=follower
      - CLUSTER_NAME=ha-test-cluster
      - RAFT_PORT=6282
      - RAFT_JOIN=node-1:6282
      - LOG_LEVEL=info
      - GEODE_DISTRIBUTED=true
    command: >
      --listen 0.0.0.0:3141
      --data-dir /data
      --node-id node-3
      --raft-bind 0.0.0.0:6282
      --raft-advertise node-3:6282
      --raft-join node-1:6282
      --log-json
    volumes:
      - node3-data:/data
    networks:
      - ha-net
    depends_on:
      - node-1
    healthcheck:
      test: ["CMD", "geode", "query", "RETURN 1", "--server", "127.0.0.1:3141", "--insecure"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    privileged: true

  # Test Runner
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: ha-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./suite.yaml:/app/suite.yaml
      - .:/app/tests
    environment:
      - GEODE_NODES=node-1:3141,node-2:3141,node-3:3141
    networks:
      - ha-net
    depends_on:
      - node-1
      - node-2
      - node-3

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  ha-net:
    driver: bridge

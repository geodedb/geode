-- Internet-Scale Load Testing Schema
-- Simulates a social network with content sharing at internet scale
--
-- Target Scale:
--   - 100M+ User nodes
--   - 500M+ Post nodes
--   - 50B+ edges (FOLLOWS, LIKES, etc.)
--
-- See docs/loadtest/DATA_MODEL.md for complete documentation

-- ============================================================================
-- CONSTRAINT DEFINITIONS
-- ============================================================================

-- Unique constraints for User
CREATE CONSTRAINT user_username_unique FOR (u:User) REQUIRE u.username IS UNIQUE
CREATE CONSTRAINT user_email_unique FOR (u:User) REQUIRE u.email IS UNIQUE

-- Unique constraints for Topic
CREATE CONSTRAINT topic_name_unique FOR (t:Topic) REQUIRE t.name IS UNIQUE

-- ============================================================================
-- INDEX DEFINITIONS
-- ============================================================================

-- User indexes
CREATE INDEX idx_user_created FOR (u:User) ON u.created_at
CREATE INDEX idx_user_last_active FOR (u:User) ON u.last_active
CREATE INDEX idx_user_verified FOR (u:User) ON u.verified

-- Post indexes
CREATE INDEX idx_post_created FOR (p:Post) ON p.created_at
CREATE INDEX idx_post_language FOR (p:Post) ON p.language

-- Topic indexes
CREATE INDEX idx_topic_trending FOR (t:Topic) ON t.trending_score

-- Message indexes
CREATE INDEX idx_message_created FOR (m:Message) ON m.created_at

-- Conversation indexes
CREATE INDEX idx_conversation_last_message FOR (c:Conversation) ON c.last_message_at

-- Group indexes
CREATE INDEX idx_group_name FOR (g:UserGroup) ON g.name

-- ============================================================================
-- SAMPLE DATA CREATION
-- ============================================================================

-- Sample users
CREATE (u1:User {
    id: 1,
    username: 'alice',
    email: 'alice@example.com',
    display_name: 'Alice Smith',
    bio: 'Graph database enthusiast',
    verified: true,
    follower_count: 1500,
    following_count: 200
})

CREATE (u2:User {
    id: 2,
    username: 'bob',
    email: 'bob@example.com',
    display_name: 'Bob Johnson',
    bio: 'Software engineer',
    verified: false,
    follower_count: 500,
    following_count: 150
})

-- Sample posts
CREATE (p1:Post {
    id: 1,
    content: 'Hello world! First post on the platform.',
    like_count: 42,
    reply_count: 5,
    repost_count: 3,
    sensitive: false
})

CREATE (p2:Post {
    id: 2,
    content: 'Graph databases are amazing for social networks!',
    like_count: 128,
    reply_count: 12,
    repost_count: 8,
    sensitive: false
})

-- Sample topic
CREATE (t1:Topic {
    id: 1,
    name: 'technology',
    description: 'All things tech',
    post_count: 50000,
    trending_score: 0.85
})

-- Sample relationships
MATCH (a:User {id: 1}), (b:User {id: 2})
CREATE (a)-[:FOLLOWS {notifications: true}]->(b)

MATCH (u:User {id: 1}), (p:Post {id: 1})
CREATE (u)-[:AUTHORED {via: 'web'}]->(p)

MATCH (u:User {id: 2}), (p:Post {id: 2})
CREATE (u)-[:AUTHORED {via: 'mobile'}]->(p)

MATCH (u:User {id: 2}), (p:Post {id: 1})
CREATE (u)-[:LIKES]->(p)

MATCH (p:Post {id: 2}), (t:Topic {id: 1})
CREATE (p)-[:TAGGED_WITH {position: 0}]->(t)


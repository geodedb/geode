-- ============================================================================
-- SCHEMA DOCUMENTATION
-- ============================================================================

-- Node Types:
--   User: Platform users (id, username, email, display_name, bio, verified, follower_count, following_count)
--   Post: Content items (id, content, like_count, reply_count, repost_count, sensitive, language)
--   Topic: Tags/categories (id, name, description, post_count, trending_score)
--   Media: Attachments (id, url, media_type, width, height, file_size)
--   Conversation: DM threads (id, message_count, participant_count)
--   Message: Individual messages (id, content, read, edited)
--   UserGroup: Community groups (id, name, description, privacy, member_count)

-- Edge Types:
--   FOLLOWS: User -> User (notifications)
--   AUTHORED: User -> Post (via)
--   LIKES: User -> Post
--   REPLIED_TO: Post -> Post (depth)
--   REPOSTED: User -> Post (quote)
--   TAGGED_WITH: Post -> Topic (position)
--   MENTIONS: Post -> User (position)
--   ATTACHED: Post -> Media (position)
--   PARTICIPATES_IN: User -> Conversation (muted)
--   SENT: User -> Message
--   IN_CONVERSATION: Message -> Conversation
--   MEMBER_OF: User -> UserGroup (role)
--   BLOCKS: User -> User (reason)
--   SIMILAR_TO: Post -> Post (score, algorithm)

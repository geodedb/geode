CREATE (c2:FamilyMember {id: 8, name: 'Child-2', generation: 4, birth_year: 1998});
CREATE (c3:FamilyMember {id: 9, name: 'Child-3', generation: 4, birth_year: 2000});
CREATE (gc1:FamilyMember {id: 10, name: 'Grandchild-1', generation: 5, birth_year: 2020});

-- 36.2 Create Family Relationships
MATCH (ggp:FamilyMember {id: 1}), (gp1:FamilyMember {id: 2}), (gp2:FamilyMember {id: 3})
CREATE (ggp)-[:PARENT_OF]->(gp1), (ggp)-[:PARENT_OF]->(gp2);

MATCH (gp1:FamilyMember {id: 2}), (p1:FamilyMember {id: 4}), (p2:FamilyMember {id: 5})
CREATE (gp1)-[:PARENT_OF]->(p1), (gp1)-[:PARENT_OF]->(p2);

MATCH (gp2:FamilyMember {id: 3}), (p3:FamilyMember {id: 6})
CREATE (gp2)-[:PARENT_OF]->(p3);

MATCH (p1:FamilyMember {id: 4}), (c1:FamilyMember {id: 7}), (c2:FamilyMember {id: 8})
CREATE (p1)-[:PARENT_OF]->(c1), (p1)-[:PARENT_OF]->(c2);

MATCH (p2:FamilyMember {id: 5}), (c3:FamilyMember {id: 9})
CREATE (p2)-[:PARENT_OF]->(c3);

MATCH (c1:FamilyMember {id: 7}), (gc1:FamilyMember {id: 10})
CREATE (c1)-[:PARENT_OF]->(gc1);

-- 36.3 Variable-Length Ancestor Query
MATCH (ancestor:FamilyMember {name: 'Great-Grandparent'})-[:PARENT_OF*]->(descendant:FamilyMember)
RETURN count(DISTINCT descendant) AS total_descendants;

-- 36.4 Specific Depth Traversal
MATCH (ancestor:FamilyMember {name: 'Great-Grandparent'})-[:PARENT_OF*2]->(grandchild:FamilyMember)
RETURN grandchild.name AS two_generations_down ORDER BY grandchild.name;

-- 36.5 Path with Range
MATCH path = (start:FamilyMember {name: 'Great-Grandparent'})-[:PARENT_OF*2..4]->(end:FamilyMember)
RETURN end.name AS reachable, length(path) AS hops ORDER BY hops, reachable;

-- 36.6 Reverse Ancestry Query
MATCH (child:FamilyMember {name: 'Grandchild-1'})<-[:PARENT_OF*]-(ancestor:FamilyMember)
RETURN ancestor.name AS ancestor_name, ancestor.generation ORDER BY ancestor.generation;


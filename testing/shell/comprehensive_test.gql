-- ============================================================================
-- SECTION 11: CONDITIONAL EXPRESSIONS
-- ============================================================================

-- 11.1 CASE Expression
RETURN CASE WHEN 5 > 3 THEN 'greater' ELSE 'less' END AS simple_case;
RETURN CASE 5 WHEN 1 THEN 'one' WHEN 5 THEN 'five' ELSE 'other' END AS value_case;

-- 11.2 Nested CASE
RETURN CASE
    WHEN 10 > 20 THEN 'a'
    WHEN 10 > 5 THEN 'b'
    ELSE 'c'
END AS nested_case;

-- 11.3 CASE with Multiple Conditions
RETURN CASE
    WHEN 5 > 10 THEN 'too high'
    WHEN 5 < 0 THEN 'negative'
    WHEN 5 >= 0 AND 5 <= 10 THEN 'in range'
    ELSE 'unknown'
END AS range_case;

-- ============================================================================
-- SECTION 12: GRAPH MANAGEMENT
-- ============================================================================

-- 12.1 Show Available Graphs
SHOW GRAPHS;

-- 12.2 Create New Graph
CREATE GRAPH IF NOT EXISTS test_comprehensive;

-- 12.3 Switch to Graph
USE GRAPH test_comprehensive;

-- 12.4 Create Another Graph for Isolation Test
CREATE GRAPH IF NOT EXISTS test_secondary;

-- ============================================================================
-- SECTION 13: NODE OPERATIONS
-- ============================================================================

-- 13.1 Create Nodes with Labels
CREATE (p:Person {name: 'Alice', age: 30, email: 'alice@example.com'});
CREATE (p:Person {name: 'Bob', age: 25, email: 'bob@example.com'});
CREATE (p:Person {name: 'Charlie', age: 35, email: 'charlie@example.com'});
CREATE (p:Person {name: 'Diana', age: 28, email: 'diana@example.com'});
CREATE (p:Person {name: 'Eve', age: 32});

-- 13.2 Create Nodes with Multiple Labels
CREATE (e:Person:Employee {name: 'Frank', employeeId: 'E001'});

-- 13.3 Create Company Nodes
CREATE (c:Company {name: 'TechCorp', founded: 2010, industry: 'Technology'});
CREATE (c:Company {name: 'DataInc', founded: 2015, industry: 'Data'});
CREATE (c:Company {name: 'StartupXYZ', founded: 2020, industry: 'Fintech'});

-- 13.4 Create Product Nodes
CREATE (p:Product {name: 'Widget', price: 29.99, stock: 100});
CREATE (p:Product {name: 'Gadget', price: 49.99, stock: 50});
CREATE (p:Product {name: 'Gizmo', price: 19.99, stock: 200});

-- 13.5 Return Created Nodes
-- NOTE: Cannot mix non-aggregated labels(n) with count(n) without GROUP BY
-- Separate queries to verify nodes created
MATCH (n) RETURN count(n) AS total_nodes;

-- ============================================================================
-- SECTION 14: RELATIONSHIP OPERATIONS
-- ============================================================================

-- 14.1 Create Relationships
MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'})
CREATE (a)-[:KNOWS {since: 2020}]->(b);

MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Charlie'})
CREATE (a)-[:KNOWS {since: 2019}]->(b);

MATCH (b:Person {name: 'Bob'}), (c:Person {name: 'Diana'})
CREATE (b)-[:KNOWS {since: 2021}]->(c);

-- 14.2 Create Employment Relationships
MATCH (p:Person {name: 'Alice'}), (c:Company {name: 'TechCorp'})
CREATE (p)-[:WORKS_FOR {since: 2018, role: 'Engineer'}]->(c);

MATCH (p:Person {name: 'Bob'}), (c:Company {name: 'TechCorp'})
CREATE (p)-[:WORKS_FOR {since: 2020, role: 'Designer'}]->(c);

MATCH (p:Person {name: 'Charlie'}), (c:Company {name: 'DataInc'})
CREATE (p)-[:WORKS_FOR {since: 2017, role: 'Manager'}]->(c);

MATCH (p:Person {name: 'Diana'}), (c:Company {name: 'StartupXYZ'})
CREATE (p)-[:WORKS_FOR {since: 2021, role: 'CTO'}]->(c);

-- 14.3 Create Purchase Relationships
MATCH (p:Person {name: 'Alice'}), (pr:Product {name: 'Widget'})
CREATE (p)-[:PURCHASED {date: '2024-01-15', quantity: 2}]->(pr);

MATCH (p:Person {name: 'Bob'}), (pr:Product {name: 'Gadget'})
CREATE (p)-[:PURCHASED {date: '2024-02-20', quantity: 1}]->(pr);

-- 14.4 Count Relationships
-- NOTE: type(r) function not yet implemented; count all relationships instead
MATCH ()-[r]->() RETURN count(r) AS relationship_count;

-- ============================================================================
-- SECTION 15: PATTERN MATCHING
-- ============================================================================

-- 15.1 Simple Node Match
MATCH (p:Person) RETURN p.name AS name, p.age AS age ORDER BY p.name;

-- 15.2 Match with Properties
MATCH (p:Person {age: 30}) RETURN p.name AS name;

-- 15.3 Match with WHERE
MATCH (p:Person) WHERE p.age > 30 RETURN p.name AS name, p.age AS age;

-- 15.4 Match Relationships
MATCH (a:Person)-[:KNOWS]->(b:Person) RETURN a.name AS from, b.name AS to;

-- 15.5 Match with Relationship Properties
MATCH (a:Person)-[r:KNOWS]->(b:Person) WHERE r.since > 2019 RETURN a.name AS from, b.name AS to, r.since AS since;

-- 15.6 Match Paths
MATCH path = (a:Person)-[:KNOWS*1..3]->(b:Person)
WHERE a.name = 'Alice'
RETURN a.name AS start, b.name AS end, length(path) AS hops;

-- 15.7 Variable Length Patterns
MATCH (a:Person)-[:KNOWS*2]->(c:Person)
RETURN DISTINCT a.name AS start, c.name AS two_hops_away;

-- 15.8 Optional Match
MATCH (p:Person)
OPTIONAL MATCH (p)-[:WORKS_FOR]->(c:Company)
RETURN p.name AS person, c.name AS company;

-- 15.9 Multiple Patterns
MATCH (p:Person)-[:WORKS_FOR]->(c:Company), (p)-[:PURCHASED]->(pr:Product)
RETURN p.name AS person, c.name AS employer, pr.name AS purchased;

-- ============================================================================
-- SECTION 16: FILTERING AND PREDICATES
-- ============================================================================

-- 16.1 Comparison Predicates
MATCH (p:Person) WHERE p.age >= 28 AND p.age <= 32 RETURN p.name, p.age;

-- 16.2 String Predicates
MATCH (p:Person) WHERE p.name STARTS WITH 'A' RETURN p.name;
MATCH (p:Person) WHERE p.name ENDS WITH 'e' RETURN p.name;
MATCH (p:Person) WHERE p.name CONTAINS 'li' RETURN p.name;

-- 16.3 List Predicates
MATCH (p:Person) WHERE p.age IN [25, 30, 35] RETURN p.name, p.age;

-- 16.4 Null Predicates
MATCH (p:Person) WHERE p.email IS NOT NULL RETURN p.name, p.email;
MATCH (p:Person) WHERE p.email IS NULL RETURN p.name;

-- 16.5 Pattern Predicates (EXISTS)
-- NOTE: EXISTS subquery syntax not yet implemented
-- MATCH (p:Person) WHERE EXISTS { (p)-[:WORKS_FOR]->(:Company) } RETURN p.name AS employed;
-- Alternative: Use pattern matching directly
MATCH (p:Person)-[:WORKS_FOR]->(:Company) RETURN DISTINCT p.name AS employed;

-- 16.6 NOT Predicates
MATCH (p:Person) WHERE NOT p.age > 30 RETURN p.name, p.age;

-- 16.7 Complex Predicates
MATCH (p:Person)-[:WORKS_FOR]->(c:Company)
WHERE (p.age > 25 AND c.founded > 2010) OR p.name = 'Alice'
RETURN p.name, c.name;

-- ============================================================================
-- SECTION 17: ORDERING AND PAGINATION
-- ============================================================================

-- 17.1 Order By Single Column
MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age;

-- 17.2 Order By Descending
MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age DESC;

-- 17.3 Order By Multiple Columns
MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age DESC, p.name ASC;

-- 17.4 LIMIT
MATCH (p:Person) RETURN p.name ORDER BY p.name LIMIT 3;

-- 17.5 SKIP
MATCH (p:Person) RETURN p.name ORDER BY p.name SKIP 2;

-- 17.6 SKIP and LIMIT Combined
MATCH (p:Person) RETURN p.name ORDER BY p.name SKIP 1 LIMIT 2;

-- ============================================================================
-- SECTION 18: AGGREGATION
-- ============================================================================

-- 18.1 Count
MATCH (p:Person) RETURN count(p) AS total_people;

-- 18.2 Count with Grouping (GQL requires explicit GROUP BY)
MATCH (p:Person)-[:WORKS_FOR]->(c:Company)
RETURN c.name AS company, count(p) AS employees
GROUP BY c.name
ORDER BY employees DESC;

-- 18.3 Sum
MATCH (pr:Product) RETURN sum(pr.price) AS total_value;

-- 18.4 Average
MATCH (p:Person) RETURN avg(p.age) AS average_age;

-- 18.5 Min/Max
MATCH (p:Person) RETURN min(p.age) AS youngest, max(p.age) AS oldest;

-- 18.6 Collect (GQL requires explicit GROUP BY)
MATCH (p:Person)-[:WORKS_FOR]->(c:Company {name: 'TechCorp'})
RETURN c.name AS company, collect(p.name) AS employees
GROUP BY c.name;

-- 18.7 DISTINCT
MATCH (p:Person)-[:WORKS_FOR]->(c:Company)
RETURN DISTINCT c.industry AS industries;

-- ============================================================================
-- SECTION 19: UNION OPERATIONS
-- ============================================================================

-- 19.1 UNION (removes duplicates)
MATCH (p:Person) WHERE p.age < 30 RETURN p.name AS name
UNION
MATCH (p:Person) WHERE p.name STARTS WITH 'A' RETURN p.name AS name;

-- 19.2 UNION ALL (keeps duplicates)
MATCH (p:Person) WHERE p.age < 30 RETURN p.name AS name
UNION ALL
MATCH (p:Person) WHERE p.name STARTS WITH 'A' RETURN p.name AS name;


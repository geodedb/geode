-- ============================================================================
-- SECTION 26: VECTOR OPERATIONS (if supported)
-- ============================================================================

-- 26.1 Create Vector
RETURN vectorf32('[1.0, 2.0, 3.0]') AS vec;

-- 26.2 Vector Distance
RETURN vector_l2(vectorf32('[1.0, 0.0]'), vectorf32('[0.0, 1.0]')) AS l2_distance;

-- 26.3 Cosine Similarity
RETURN vector_cosine(vectorf32('[1.0, 0.0]'), vectorf32('[1.0, 0.0]')) AS similarity;

-- 26.4 Dot Product
RETURN vector_dot(vectorf32('[1.0, 2.0, 3.0]'), vectorf32('[4.0, 5.0, 6.0]')) AS dot_product;

-- 26.5 Create Node with Vector
CREATE (doc:Document {title: 'Vector Test', embedding: vectorf32('[0.1, 0.2, 0.3, 0.4]')});

-- 26.6 Query by Vector Similarity
MATCH (d:Document)
WHERE vector_cosine(d.embedding, vectorf32('[0.1, 0.2, 0.3, 0.4]')) > 0.9
RETURN d.title;

-- ============================================================================
-- SECTION 27: PATH FUNCTIONS
-- ============================================================================

-- 27.1 Path Length
MATCH path = (a:Person {name: 'Alice'})-[:KNOWS*1..3]->(b:Person)
RETURN length(path) AS path_length, b.name AS destination;

-- 27.2 Nodes in Path
MATCH path = (a:Person {name: 'Alice'})-[:KNOWS*1..2]->(b:Person)
RETURN nodes(path) AS path_nodes;

-- 27.3 Relationships in Path
MATCH path = (a:Person {name: 'Alice'})-[:KNOWS*1..2]->(b:Person)

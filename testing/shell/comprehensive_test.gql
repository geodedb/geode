-- This file contains extensive GQL queries for testing in the geode shell.
-- Can be run as: geode query < comprehensive_test.gql
-- Or use individual lines for manual testing in: geode shell
-- ============================================================================

-- ============================================================================
-- SECTION 1: BASIC EXPRESSIONS AND LITERALS
-- ============================================================================

-- 1.1 Numeric Literals
RETURN 42 AS integer_literal;
RETURN -17 AS negative_integer;
RETURN 3.14159 AS float_literal;
RETURN -0.001 AS negative_float;
RETURN 1e10 AS scientific_notation;
RETURN 2.5e-3 AS scientific_small;

-- 1.2 String Literals
RETURN 'hello world' AS single_quoted;
RETURN "double quoted" AS double_quoted;
RETURN 'it''s escaped' AS escaped_quote;
RETURN '' AS empty_string;

-- 1.3 Boolean Literals
RETURN true AS bool_true;
RETURN false AS bool_false;

-- 1.4 Null Literal
RETURN null AS null_value;

-- 1.5 List Literals
RETURN [1, 2, 3, 4, 5] AS number_list;
RETURN ['a', 'b', 'c'] AS string_list;
RETURN [1, 'mixed', true, null] AS mixed_list;
RETURN [] AS empty_list;
RETURN [[1, 2], [3, 4]] AS nested_list;

-- 1.6 Map Literals
RETURN {name: 'Alice', age: 30} AS simple_map;
RETURN {nested: {inner: 'value'}} AS nested_map;
RETURN {} AS empty_map;

-- ============================================================================
-- SECTION 2: ARITHMETIC OPERATIONS
-- ============================================================================

-- 2.1 Basic Arithmetic
RETURN 5 + 3 AS addition;
RETURN 10 - 4 AS subtraction;
RETURN 6 * 7 AS multiplication;
RETURN 15 / 3 AS division;
RETURN 17 % 5 AS modulo;

-- 2.2 Operator Precedence
RETURN 2 + 3 * 4 AS precedence_mult_first;
RETURN (2 + 3) * 4 AS precedence_parens;
RETURN 10 - 4 + 2 AS left_to_right;
RETURN 100 / 10 / 2 AS division_chain;

-- 2.3 Unary Operators
RETURN -42 AS unary_minus;
RETURN +42 AS unary_plus;
RETURN -(-5) AS double_negative;

-- 2.4 Complex Expressions
RETURN ((10 + 5) * 2 - 8) / 2 AS complex_expr;
RETURN (100 - 20) % 7 + 3 * 2 AS mixed_operators;

-- ============================================================================
-- SECTION 3: COMPARISON OPERATIONS
-- ============================================================================

-- 3.1 Equality
RETURN 5 = 5 AS equal_true;
RETURN 5 = 6 AS equal_false;
RETURN 'hello' = 'hello' AS string_equal;
RETURN null = null AS null_equal;

-- 3.2 Inequality
RETURN 5 <> 6 AS not_equal_true;
RETURN 5 <> 5 AS not_equal_false;
RETURN 5 != 6 AS not_equal_alt;

-- 3.3 Ordering
RETURN 5 < 10 AS less_than;
RETURN 10 > 5 AS greater_than;
RETURN 5 <= 5 AS less_equal;
RETURN 5 >= 5 AS greater_equal;
RETURN 'apple' < 'banana' AS string_compare;

-- 3.4 IS NULL / IS NOT NULL
RETURN null IS NULL AS is_null_true;
RETURN 5 IS NULL AS is_null_false;
RETURN 5 IS NOT NULL AS is_not_null_true;
RETURN null IS NOT NULL AS is_not_null_false;

-- ============================================================================
-- SECTION 4: LOGICAL OPERATIONS
-- ============================================================================

-- 4.1 AND Operations
RETURN true AND true AS and_tt;
RETURN true AND false AS and_tf;
RETURN false AND true AS and_ft;
RETURN false AND false AS and_ff;

-- 4.2 OR Operations
RETURN true OR true AS or_tt;
RETURN true OR false AS or_tf;
RETURN false OR true AS or_ft;
RETURN false OR false AS or_ff;

-- 4.3 NOT Operations
RETURN NOT true AS not_true;
RETURN NOT false AS not_false;
RETURN NOT NOT true AS double_not;

-- 4.4 XOR Operations
RETURN true XOR false AS xor_tf;
RETURN true XOR true AS xor_tt;
RETURN false XOR false AS xor_ff;

-- 4.5 Complex Logical
RETURN (true AND false) OR true AS complex_logic1;
RETURN NOT (true AND false) AS complex_logic2;
RETURN (5 > 3) AND (10 < 20) AS comparison_logic;


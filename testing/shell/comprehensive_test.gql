-- SECTION 34: MULTI-GRAPH ISOLATION TESTS
-- ============================================================================
-- Extended multi-graph testing for data isolation verification

-- 34.1 Create Isolation Test Graphs
CREATE GRAPH IF NOT EXISTS isolation_graph_a;
CREATE GRAPH IF NOT EXISTS isolation_graph_b;

-- 34.2 Populate Graph A
USE GRAPH isolation_graph_a;
CREATE (a:IsolationNode {id: 1, graph: 'A', name: 'Alice'});
CREATE (b:IsolationNode {id: 2, graph: 'A', name: 'Bob'});
CREATE (a)-[:KNOWS_IN_A {since: 2020}]->(b);

-- 34.3 Populate Graph B with Different Data
USE GRAPH isolation_graph_b;
CREATE (x:IsolationNode {id: 100, graph: 'B', name: 'Xavier'});
CREATE (y:IsolationNode {id: 101, graph: 'B', name: 'Yolanda'});
CREATE (z:IsolationNode {id: 102, graph: 'B', name: 'Zach'});
CREATE (x)-[:KNOWS_IN_B]->(y)-[:KNOWS_IN_B]->(z);

-- 34.4 Verify Graph B Only Has Graph B Data
MATCH (n:IsolationNode) RETURN n.id, n.graph, n.name ORDER BY n.id;
MATCH (n:IsolationNode) RETURN count(n) AS graph_b_count;

-- 34.5 Switch Back to Graph A and Verify Isolation
USE GRAPH isolation_graph_a;
MATCH (n:IsolationNode) RETURN n.id, n.graph, n.name ORDER BY n.id;
MATCH (n:IsolationNode) RETURN count(n) AS graph_a_count;

-- 34.6 Test Cross-Graph Queries Dont Mix
MATCH (n:IsolationNode) WHERE n.graph = 'B' RETURN count(n) AS should_be_zero;

-- 34.7 Graph Isolation Cleanup
USE GRAPH isolation_graph_a;
MATCH (n) DETACH DELETE n;
USE GRAPH isolation_graph_b;
MATCH (n) DETACH DELETE n;
DROP GRAPH IF EXISTS isolation_graph_a;
DROP GRAPH IF EXISTS isolation_graph_b;


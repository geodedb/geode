-- 45.2 Bulk Relationship Creation
MATCH (a:BulkNode), (b:BulkNode) WHERE a.id < b.id AND a.id <= 5
CREATE (a)-[:BULK_LINK {weight: a.id + b.id}]->(b);

-- 45.3 Complex Multi-Hop Query
MATCH (start:BulkNode {id: 1})-[:BULK_LINK*1..3]->(end:BulkNode)
RETURN DISTINCT end.id AS reachable_node ORDER BY reachable_node;

-- 45.4 Aggregation Stress Test
MATCH (b:BulkNode)
RETURN count(b) AS total_nodes, min(b.id) AS min_id, max(b.id) AS max_id, avg(b.id) AS avg_id;

-- 45.5 Large Path Query
MATCH path = (a:BulkNode)-[:BULK_LINK*]->(b:BulkNode)
WHERE length(path) >= 2
RETURN a.id AS start, b.id AS end, length(path) AS hops
ORDER BY hops DESC LIMIT 10;


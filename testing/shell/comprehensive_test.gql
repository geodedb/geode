MATCH (c:Customer)-[:PLACED]->(o:Order)
WHERE c.credit_limit > 5000
RETURN c.name AS customer, c.tier, o.total AS order_total ORDER BY o.total DESC;

-- Products frequently ordered together
MATCH (p1:ProductItem)<-[:CONTAINS]-(o:Order)-[:CONTAINS]->(p2:ProductItem)
WHERE id(p1) < id(p2)
RETURN p1.name AS product1, p2.name AS product2, count(o) AS ordered_together
GROUP BY p1.name, p2.name
ORDER BY ordered_together DESC;

-- Customer purchase summary
MATCH (c:Customer)-[:PLACED]->(o:Order)
RETURN c.name, c.tier, count(o) AS order_count, sum(o.total) AS total_spent
GROUP BY c.name, c.tier
ORDER BY total_spent DESC;


-- ============================================================================
-- SECTION 22: DELETE OPERATIONS
-- ============================================================================

-- 22.1 Delete Node (must have no relationships)
CREATE (temp:Temporary {data: 'delete me'});
MATCH (t:Temporary) DELETE t;

-- 22.2 Delete with DETACH (removes relationships too)
CREATE (temp:Temporary {data: 'delete me with rels'});
CREATE (temp2:Temporary {data: 'connected'});
MATCH (a:Temporary {data: 'delete me with rels'}), (b:Temporary {data: 'connected'})
CREATE (a)-[:TEMP_REL]->(b);
MATCH (t:Temporary) DETACH DELETE t;

-- ============================================================================
-- SECTION 23: WITH CLAUSE
-- ============================================================================

-- 23.1 Basic WITH (GQL requires explicit GROUP BY)
MATCH (p:Person)
WITH p.age AS age, count(*) AS count
GROUP BY p.age
RETURN age, count ORDER BY age;

-- 23.2 WITH for Filtering Aggregations (GQL requires explicit GROUP BY)
MATCH (p:Person)-[:WORKS_FOR]->(c:Company)
WITH c, count(p) AS emp_count
GROUP BY c
WHERE emp_count > 1
RETURN c.name, emp_count;

-- 23.3 WITH for Chained Queries
MATCH (p:Person)
WITH p ORDER BY p.age DESC LIMIT 3
MATCH (p)-[:WORKS_FOR]->(c:Company)
RETURN p.name, c.name;


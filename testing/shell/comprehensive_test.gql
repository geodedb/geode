-- 37.1 Create Social Network for Pattern Tests
CREATE (u1:SocialUser {name: 'Alice', age: 28, city: 'NYC'});
CREATE (u2:SocialUser {name: 'Bob', age: 32, city: 'LA'});
CREATE (u3:SocialUser {name: 'Carol', age: 25, city: 'NYC'});
CREATE (u4:SocialUser {name: 'Dave', age: 35, city: 'Chicago'});
CREATE (u5:SocialUser {name: 'Eve', age: 29, city: 'LA'});
CREATE (u6:SocialUser {name: 'Frank', age: 31, city: 'NYC'});

MATCH (u1:SocialUser {name: 'Alice'}), (u2:SocialUser {name: 'Bob'}),
      (u3:SocialUser {name: 'Carol'}), (u4:SocialUser {name: 'Dave'}),
      (u5:SocialUser {name: 'Eve'}), (u6:SocialUser {name: 'Frank'})
CREATE (u1)-[:FRIEND {since: 2019}]->(u2),
       (u1)-[:FRIEND {since: 2020}]->(u3),
       (u2)-[:FRIEND {since: 2018}]->(u4),
       (u3)-[:FRIEND {since: 2021}]->(u4),
       (u4)-[:FRIEND {since: 2020}]->(u5),
       (u5)-[:FRIEND {since: 2019}]->(u6),
       (u6)-[:FRIEND {since: 2022}]->(u1);

-- 37.2 Undirected Relationship Match
MATCH (a:SocialUser)-[:FRIEND]-(b:SocialUser)
WHERE a.name = 'Alice'
RETURN DISTINCT b.name AS friends_of_alice ORDER BY b.name;

-- 37.3 Friends of Friends
MATCH (a:SocialUser {name: 'Alice'})-[:FRIEND]->()-[:FRIEND]->(fof:SocialUser)
WHERE fof <> a
RETURN DISTINCT fof.name AS friends_of_friends ORDER BY fof.name;

-- 37.4 Triangle Detection (Mutual Friends)
MATCH (a:SocialUser)-[:FRIEND]->(b:SocialUser)-[:FRIEND]->(c:SocialUser)-[:FRIEND]->(a)
WHERE id(a) < id(b) AND id(b) < id(c)
RETURN a.name AS user_a, b.name AS user_b, c.name AS user_c;

-- 37.5 Cycle Detection
MATCH path = (n:SocialUser)-[:FRIEND*3..6]->(n)
WHERE n.name = 'Alice'
RETURN length(path) AS cycle_length, [node IN nodes(path) | node.name] AS cycle_path LIMIT 3;

-- 37.6 Degree Centrality (Connection Count)
MATCH (n:SocialUser)
OPTIONAL MATCH (n)-[r:FRIEND]-()
WITH n, count(r) AS connections
RETURN n.name AS user, connections ORDER BY connections DESC;

-- 37.7 Common Neighbors
MATCH (a:SocialUser {name: 'Alice'})-[:FRIEND]-(common)-[:FRIEND]-(b:SocialUser {name: 'Dave'})
RETURN common.name AS common_friend;


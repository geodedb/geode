MATCH path = shortestPath((a:Person {name: 'Alice'})-[:KNOWS*]->(b:Person {name: 'Diana'}))
RETURN path, length(path) AS hops;

-- 28.2 All Shortest Paths
MATCH paths = allShortestPaths((a:Person {name: 'Alice'})-[:KNOWS*]->(b:Person {name: 'Diana'}))
RETURN paths;


-- SECTION 22: CLEANUP
-- ============================================================================

-- 22.1 Remove test relationships
MATCH ()-[r:TEST_REL]->() DELETE r;

-- 22.2 Verify graph state
MATCH (n)
RETURN labels(n) AS label_set, count(*) AS count
GROUP BY labels(n)
ORDER BY count DESC;


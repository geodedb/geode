-- ============================================================================
-- SECTION 17: SOCIAL GRAPH PATTERNS
-- ============================================================================

USE GRAPH extended_social;
MATCH (n) DETACH DELETE n;

-- Create users
CREATE (:User {id: 'U001', name: 'Alice', age: 30, city: 'NYC'});
CREATE (:User {id: 'U002', name: 'Bob', age: 25, city: 'LA'});
CREATE (:User {id: 'U003', name: 'Carol', age: 35, city: 'NYC'});
CREATE (:User {id: 'U004', name: 'Dave', age: 28, city: 'Chicago'});
CREATE (:User {id: 'U005', name: 'Eve', age: 32, city: 'LA'});
CREATE (:User {id: 'U006', name: 'Frank', age: 40, city: 'NYC'});

-- Create friendship network (bidirectional)
MATCH (u1:User {name: 'Alice'}), (u2:User {name: 'Bob'}) CREATE (u1)-[:FRIENDS_WITH {since: '2020-01-01'}]->(u2);
MATCH (u1:User {name: 'Bob'}), (u2:User {name: 'Alice'}) CREATE (u1)-[:FRIENDS_WITH {since: '2020-01-01'}]->(u2);
MATCH (u1:User {name: 'Alice'}), (u2:User {name: 'Carol'}) CREATE (u1)-[:FRIENDS_WITH {since: '2019-06-15'}]->(u2);
MATCH (u1:User {name: 'Carol'}), (u2:User {name: 'Alice'}) CREATE (u1)-[:FRIENDS_WITH {since: '2019-06-15'}]->(u2);
MATCH (u1:User {name: 'Bob'}), (u2:User {name: 'Dave'}) CREATE (u1)-[:FRIENDS_WITH {since: '2021-03-20'}]->(u2);
MATCH (u1:User {name: 'Dave'}), (u2:User {name: 'Bob'}) CREATE (u1)-[:FRIENDS_WITH {since: '2021-03-20'}]->(u2);
MATCH (u1:User {name: 'Carol'}), (u2:User {name: 'Eve'}) CREATE (u1)-[:FRIENDS_WITH {since: '2018-11-10'}]->(u2);
MATCH (u1:User {name: 'Eve'}), (u2:User {name: 'Carol'}) CREATE (u1)-[:FRIENDS_WITH {since: '2018-11-10'}]->(u2);
MATCH (u1:User {name: 'Dave'}), (u2:User {name: 'Eve'}) CREATE (u1)-[:FRIENDS_WITH {since: '2022-01-05'}]->(u2);
MATCH (u1:User {name: 'Eve'}), (u2:User {name: 'Dave'}) CREATE (u1)-[:FRIENDS_WITH {since: '2022-01-05'}]->(u2);

-- Frank has no friends (isolated node test)

-- 17.1 Friends of friends (2-hop)
MATCH (u:User {name: 'Alice'})-[:FRIENDS_WITH]->()-[:FRIENDS_WITH]->(fof:User)
WHERE fof.name <> 'Alice'
RETURN DISTINCT fof.name AS friends_of_friends;

-- 17.2 Common friends
MATCH (u1:User {name: 'Alice'})-[:FRIENDS_WITH]->(common:User)<-[:FRIENDS_WITH]-(u2:User {name: 'Dave'})
RETURN common.name AS mutual_friend;

-- 17.3 Users with no friends
MATCH (u:User)
WHERE NOT EXISTS { MATCH (u)-[:FRIENDS_WITH]->(:User) }
RETURN u.name AS lonely_user;

-- 17.4 Friend count per user
MATCH (u:User)
OPTIONAL MATCH (u)-[:FRIENDS_WITH]->(f:User)
RETURN u.name, count(f) AS friend_count
GROUP BY u.name
ORDER BY friend_count DESC;

-- 17.5 Users in same city who aren't friends
MATCH (u1:User), (u2:User)
WHERE u1.city = u2.city AND u1.id < u2.id
  AND NOT EXISTS { MATCH (u1)-[:FRIENDS_WITH]->(u2) }
RETURN u1.name AS user1, u2.name AS user2, u1.city AS city;


-- SECTION 18: DATE EDGE CASES
-- ============================================================================

USE GRAPH extended_corp;

-- 18.1 Date comparison
MATCH (e:Employee)
WHERE e.hire_date < '2020-01-01'
RETURN e.name, e.hire_date
ORDER BY e.hire_date ASC;

-- 18.2 Date extraction
RETURN date('2024-06-15').year AS year, date('2024-06-15').month AS month, date('2024-06-15').day AS day;

-- 18.3 Current date components
RETURN date().year AS current_year, date().month AS current_month;

-- ============================================================================
-- SECTION 19: STRESS TESTS
-- ============================================================================

USE GRAPH extended_corp;

-- 19.1 Large aggregation (all employees)
MATCH (e:Employee)
RETURN count(*) AS total,
       sum(e.salary) AS total_salary,
       avg(e.salary) AS avg_salary,
       min(e.salary) AS min_salary,
       max(e.salary) AS max_salary;

-- 19.2 Complex multi-level aggregation
MATCH (e:Employee)
WITH e.department AS dept, e.level AS lvl, count(*) AS cnt, avg(e.salary) AS avg
WITH dept, count(lvl) AS level_count, sum(cnt) AS total_in_dept, avg(avg) AS overall_avg
RETURN dept, level_count, total_in_dept, overall_avg
ORDER BY total_in_dept DESC;

-- 19.3 Full cross-join (small data)
MATCH (d:Department)
MATCH (p:Project)
WHERE d.active = true AND p.status = 'active'
RETURN d.name AS dept, p.name AS project
ORDER BY d.name, p.name;

-- 19.4 Complex EXISTS chain
MATCH (e:Employee)
WHERE EXISTS { MATCH (e)-[:REPORTS_TO]->(:Employee) }
   OR EXISTS { MATCH (e)-[:MANAGES]->(:Department) }
   OR EXISTS { MATCH (e)-[:WORKS_ON]->(:Project) }
RETURN e.name AS connected_employee
ORDER BY e.name;


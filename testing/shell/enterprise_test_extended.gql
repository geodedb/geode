-- ============================================================================
-- SECTION 2: EDGE CASE - EMPTY RESULTS AND BOUNDARY CONDITIONS
-- ============================================================================

-- 2.1 Query that returns no results
MATCH (e:Employee {department: 'NonExistent'})
RETURN e.name AS name;

-- 2.2 Department with no employees (NewDept)
MATCH (d:Department {name: 'NewDept'})
OPTIONAL MATCH (e:Employee {department: 'NewDept'})
RETURN d.name AS dept, count(e) AS emp_count;

-- 2.3 Filter that excludes all results
MATCH (e:Employee)
WHERE e.salary > 1000000
RETURN e.name AS millionaires;

-- 2.4 LIMIT 0 edge case
MATCH (e:Employee)
RETURN e.name
LIMIT 0;

-- 2.5 SKIP beyond result count
MATCH (e:Employee)
RETURN e.name
ORDER BY e.salary DESC
SKIP 100 LIMIT 10;

-- ============================================================================
-- SECTION 3: COMPLEX AGGREGATION EDGE CASES
-- ============================================================================

-- 3.1 Aggregation on empty group
MATCH (e:Employee {department: 'Support', active: true})
RETURN count(*) AS active_support, sum(e.salary) AS total_salary, avg(e.salary) AS avg_salary;

-- 3.2 Multiple aggregations with same GROUP BY
MATCH (e:Employee)
WHERE e.active = true
RETURN e.department AS dept,
       count(*) AS total,
       sum(e.salary) AS sum_sal,
       avg(e.salary) AS avg_sal,
       min(e.salary) AS min_sal,
       max(e.salary) AS max_sal,
       count(DISTINCT e.level) AS unique_levels
GROUP BY e.department
ORDER BY sum_sal DESC;

-- 3.3 Aggregation with zero values
MATCH (d:Department)
RETURN d.name, d.budget,
       CASE WHEN d.budget = 0 THEN 'No Budget' ELSE 'Has Budget' END AS status
ORDER BY d.budget ASC;

-- 3.4 COUNT DISTINCT on various types
MATCH (e:Employee)
RETURN count(DISTINCT e.department) AS unique_depts,
       count(DISTINCT e.level) AS unique_levels,
       count(DISTINCT e.active) AS unique_statuses;

-- 3.5 Aggregation with NULL handling
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
RETURN e.department AS dept,
       count(m) AS has_manager_count,
       count(*) AS total_count
GROUP BY e.department
ORDER BY has_manager_count DESC;

-- ============================================================================
-- SECTION 4: COMPLEX WITH CLAUSE CHAINS
-- ============================================================================

-- 4.1 Triple WITH chain
MATCH (e:Employee)
WITH e.department AS dept, count(*) AS cnt, avg(e.salary) AS avg
WITH dept, cnt, avg
WHERE cnt >= 2
WITH dept, cnt, avg, cnt * avg AS dept_impact
RETURN dept, cnt, avg, dept_impact
ORDER BY dept_impact DESC;

-- 4.2 WITH + aggregation + filter + aggregation
MATCH (e:Employee)
WITH e.department AS dept, sum(e.salary) AS total_sal
WITH dept, total_sal
WHERE total_sal > 200000
RETURN count(*) AS high_payroll_depts, sum(total_sal) AS combined_payroll;

-- 4.3 WITH changing column names through chain
MATCH (e:Employee)
WITH e.name AS original_name, e.salary AS original_salary
WITH original_name AS employee, original_salary AS pay
WITH employee AS person, pay AS compensation
RETURN person, compensation
ORDER BY compensation DESC
LIMIT 5;

-- 4.4 WITH with ORDER BY in middle
MATCH (e:Employee)
WITH e ORDER BY e.salary DESC
LIMIT 10
WITH e.department AS dept, count(*) AS top_earner_count
RETURN dept, top_earner_count
ORDER BY top_earner_count DESC;

-- ============================================================================
-- SECTION 5: COMPLEX ORDER BY EDGE CASES
-- ============================================================================
-- NOTE: Per GQL spec, ORDER BY should use aliases for base conformance.
-- Tests marked [GQ14] require optional "Complex expressions in sort keys" feature.

-- 5.1a ORDER BY on computed expression using ALIAS (CORRECT - base conformance)
MATCH (e:Employee)
RETURN e.name, e.salary, e.level, e.salary / e.level AS salary_per_level
ORDER BY salary_per_level DESC
LIMIT 10;

-- 5.1b ORDER BY on computed expression using EXPRESSION [GQ14 - partial support]
-- Note: Works when component columns (salary, level) are in RETURN
MATCH (e:Employee)
RETURN e.name, e.salary, e.level, e.salary / e.level AS salary_per_level
ORDER BY e.salary / e.level DESC
LIMIT 10;

-- 5.2 ORDER BY with multiple directions (uses column references - supported)
MATCH (e:Employee)
RETURN e.department, e.level, e.salary, e.name
ORDER BY e.department ASC, e.level DESC, e.salary DESC, e.name ASC;

-- 5.3 ORDER BY on aggregated column ALIAS (CORRECT - base conformance)
MATCH (e:Employee)
RETURN e.department AS dept, avg(e.salary) AS avg_salary
GROUP BY e.department
ORDER BY avg_salary ASC;

-- 5.3b NOTE: ORDER BY on aggregate EXPRESSION directly is NOT standard GQL
-- Per GQL spec, Feature GF20 "Aggregate functions in sort keys" is optional
-- INCORRECT (requires GF20): ORDER BY avg(e.salary) ASC
-- CORRECT (base conformance): ORDER BY avg_salary ASC (uses alias)

-- 5.4 ORDER BY with NULLS (employees without managers)
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
RETURN e.name AS employee, m.salary AS manager_salary
ORDER BY manager_salary DESC NULLS LAST;

-- 5.5 ORDER BY with same values (stability test)
MATCH (e:Employee)
WHERE e.salary = 95000
RETURN e.name, e.salary, e.department
ORDER BY e.salary DESC, e.name ASC;

-- ============================================================================
-- SECTION 6: MULTI-MATCH COMPLEX PATTERNS
-- ============================================================================

-- 6.1 Triple MATCH with aggregation
MATCH (d:Department)
MATCH (e:Employee)
MATCH (p:Project)
WHERE e.department = d.name
RETURN d.name AS dept, count(DISTINCT e) AS employees, count(DISTINCT p) AS total_projects
GROUP BY d.name
ORDER BY employees DESC;

-- 6.2 MATCH + OPTIONAL MATCH + MATCH
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
MATCH (d:Department {name: e.department})
RETURN e.name, m.name AS manager, d.budget
ORDER BY d.budget DESC
LIMIT 10;

-- 6.3 Multiple MATCH with cross-product filtering
MATCH (e1:Employee)
MATCH (e2:Employee)
WHERE e1.department = e2.department AND e1.id < e2.id
RETURN e1.name AS employee1, e2.name AS employee2, e1.department AS dept
ORDER BY e1.department, e1.name;

-- 6.4 MATCH with self-comparison
MATCH (e:Employee)
MATCH (other:Employee)
WHERE e.department = other.department AND e.salary > other.salary
RETURN e.name AS higher_earner, other.name AS lower_earner, e.department AS dept, e.salary - other.salary AS difference
ORDER BY difference DESC
LIMIT 10;

-- ============================================================================
-- SECTION 7: DEEP RELATIONSHIP TRAVERSAL
-- ============================================================================

-- 7.1 Variable-length path 1..4 hops (find people who report to Alice within 4 hops)
-- Note: Use reverse arrow because REPORTS_TO edges point FROM subordinate TO manager
MATCH (e:Employee {name: 'Alice Chen'})<-[:REPORTS_TO*1..4]-(subordinate:Employee)
RETURN e.name AS manager, subordinate.name AS subordinate;

-- 7.2 Reverse traversal (who reports up to top)
MATCH (e:Employee)-[:REPORTS_TO*1..5]->(top:Employee)
WHERE NOT EXISTS { MATCH (top)-[:REPORTS_TO]->(:Employee) }
RETURN e.name AS employee, top.name AS ultimate_manager
ORDER BY e.name;

-- 7.3 Path with relationship properties
MATCH (e:Employee)-[w:WORKS_ON]->(p:Project)
RETURN e.name, p.name AS project, w.role, w.hours
ORDER BY w.hours DESC;

-- 7.4 Multiple relationship types in path
MATCH (e:Employee)-[:REPORTS_TO|MENTORS*1..3]->(other:Employee)
WHERE e.name = 'Diana Miller'
RETURN DISTINCT other.name AS connected_to;

-- ============================================================================
-- SECTION 8: SUBQUERY EDGE CASES
-- ============================================================================

-- 8.1 EXISTS with empty inner match
MATCH (e:Employee)
WHERE EXISTS {
    MATCH (e)-[:WORKS_ON]->(:Project {status: 'cancelled'})
}
RETURN e.name AS works_on_cancelled;

-- 8.2 NOT EXISTS - employees not on any project
MATCH (e:Employee)
WHERE NOT EXISTS {
    MATCH (e)-[:WORKS_ON]->(:Project)
}
RETURN e.name AS no_projects
ORDER BY e.name;

-- 8.3 COUNT subquery with zero result
MATCH (d:Department)
RETURN d.name AS department,
       COUNT { MATCH (:Employee {department: d.name, active: false}) } AS inactive_count
ORDER BY inactive_count DESC;

-- 8.4 Nested subquery condition
MATCH (e:Employee)
WHERE e.salary > 100000
  AND EXISTS { MATCH (e)-[:REPORTS_TO]->(:Employee) }
RETURN e.name AS high_earner_with_manager
ORDER BY e.salary DESC;

-- ============================================================================
-- SECTION 9: NULL HANDLING EDGE CASES
-- ============================================================================

-- 9.1 COALESCE chain
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
OPTIONAL MATCH (e)-[:MENTORS]->(mentee:Employee)
RETURN e.name,
       coalesce(m.name, 'No Manager') AS manager,
       coalesce(mentee.name, 'No Mentee') AS mentee;

-- 9.2 NULL in arithmetic (should propagate)
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
RETURN e.name, m.salary AS manager_salary, m.salary + 1000 AS manager_salary_plus
ORDER BY e.name
LIMIT 10;

-- 9.3 NULL comparison behavior
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
WHERE m.salary IS NOT NULL
RETURN e.name AS has_manager_with_salary;

-- 9.4 IS NULL filter
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
WHERE m IS NULL
RETURN e.name AS top_level
ORDER BY e.name;

-- ============================================================================
-- SECTION 10: CASE EXPRESSION EDGE CASES
-- ============================================================================

-- 10.1 Nested CASE expressions
MATCH (e:Employee)
RETURN e.name,
       CASE
           WHEN e.salary >= 140000 THEN
               CASE WHEN e.level >= 5 THEN 'Executive' ELSE 'Senior Expert' END
           WHEN e.salary >= 100000 THEN 'Senior'
           WHEN e.salary >= 70000 THEN 'Mid'
           ELSE 'Junior'
       END AS tier;

-- 10.2 CASE in aggregation
MATCH (e:Employee)
RETURN e.department,
       sum(CASE WHEN e.active = true THEN 1 ELSE 0 END) AS active_count,
       sum(CASE WHEN e.active = false THEN 1 ELSE 0 END) AS inactive_count
GROUP BY e.department
ORDER BY active_count DESC;

-- 10.3 CASE with NULL comparison
MATCH (e:Employee)
OPTIONAL MATCH (e)-[:REPORTS_TO]->(m:Employee)
RETURN e.name,
       CASE
           WHEN m IS NULL THEN 'Top Level'
           WHEN m.salary > e.salary THEN 'Normal Hierarchy'
           ELSE 'Unusual Hierarchy'
       END AS hierarchy_status;

-- ============================================================================
-- SECTION 11: SET OPERATIONS EDGE CASES
-- ============================================================================

-- 11.1 UNION with empty set
MATCH (e:Employee {department: 'NonExistent'})
RETURN e.name AS person
UNION
MATCH (e:Employee {department: 'Legal'})
RETURN e.name AS person;

-- 11.2 INTERSECT with subset relationship
MATCH (e:Employee) WHERE e.salary > 100000
RETURN e.name AS person
INTERSECT
MATCH (e:Employee) WHERE e.salary > 120000
RETURN e.name AS person;

-- 11.3 EXCEPT all from set
MATCH (e:Employee {department: 'Engineering'})
RETURN e.name AS person
EXCEPT
MATCH (e:Employee {department: 'Engineering'})
RETURN e.name AS person;

-- 11.4 Complex UNION with ORDER BY
MATCH (e:Employee) WHERE e.level = 5
RETURN e.name AS leader, 'Department Head' AS role
UNION ALL
MATCH (e:Employee)-[:MANAGES]->(:Department)
RETURN e.name AS leader, 'Manager' AS role
ORDER BY leader;

-- ============================================================================
-- SECTION 12: STRING EDGE CASES
-- ============================================================================

-- 12.1 Empty string handling
RETURN '' AS empty_string, size('') AS empty_size;

-- 12.2 String with special characters
RETURN 'Hello\nWorld' AS with_newline;
RETURN 'Tab\there' AS with_tab;
RETURN 'Quote: "test"' AS with_quotes;

-- 12.3 Case-insensitive comparison
MATCH (e:Employee)
WHERE lower(e.department) = 'engineering'
RETURN count(*) AS eng_count;

-- 12.4 String concatenation simulation via CASE
MATCH (e:Employee)
RETURN e.name,
       CASE
           WHEN e.level >= 4 THEN 'Senior '
           ELSE ''
       END AS prefix,
       e.department
ORDER BY e.name
LIMIT 5;

-- ============================================================================
-- SECTION 13: NUMERIC EDGE CASES
-- ============================================================================

-- 13.1 Division by non-zero
MATCH (d:Department)
WHERE d.budget > 0
MATCH (e:Employee {department: d.name})
RETURN d.name, d.budget, count(e) AS emp_count, d.budget / count(e) AS budget_per_emp
GROUP BY d.name, d.budget
ORDER BY budget_per_emp DESC;

-- 13.2 Negative numbers in expressions
RETURN -100 AS negative, abs(-100) AS absolute, sign(-100) AS sign_val;

-- 13.3 Large number handling
RETURN 9999999999 AS large_num, 9999999999 * 2 AS doubled;

-- 13.4 Zero handling
RETURN 0 AS zero, 0 + 1 AS zero_plus_one, 100 - 100 AS difference_zero;

-- 13.5 Modulo and integer division edge cases
RETURN 10 % 3 AS modulo_result;
RETURN 10 / 3 AS integer_div;

-- ============================================================================
-- SECTION 14: LIST EDGE CASES
-- ============================================================================

-- 14.1 Empty list operations
RETURN [] AS empty_list, size([]) AS empty_size;

-- 14.2 Single element list
RETURN [42] AS single, head([42]) AS single_head, tail([42]) AS single_tail;

-- 14.3 List index edge cases
RETURN [1,2,3,4,5][0] AS first;
RETURN [1,2,3,4,5][4] AS last_valid;

-- 14.4 List slicing edge cases
RETURN [1,2,3,4,5][0..1] AS first_one;
RETURN [1,2,3,4,5][0..5] AS all_elements;
RETURN [1,2,3,4,5][2..2] AS empty_slice;

-- 14.5 IN predicate edge cases
RETURN 1 IN [] AS in_empty;
RETURN null IN [1, 2, 3] AS null_in_list;

-- ============================================================================
-- SECTION 15: COMPLEX BUSINESS QUERIES
-- ============================================================================

-- 15.1 Department budget utilization (payroll / budget ratio)
MATCH (d:Department)
WHERE d.budget > 0
MATCH (e:Employee {department: d.name})
WHERE e.active = true
RETURN d.name AS department,
       d.budget,
       sum(e.salary) AS total_payroll,
       d.budget - sum(e.salary) AS remaining,
       (sum(e.salary) * 100) / d.budget AS utilization_pct
GROUP BY d.name, d.budget
ORDER BY utilization_pct DESC;

-- 15.2 Management span (direct reports per manager)
MATCH (m:Employee)<-[:REPORTS_TO]-(e:Employee)
RETURN m.name AS manager,
       m.department,
       count(e) AS direct_reports,
       avg(e.salary) AS avg_report_salary
GROUP BY m.name, m.department
ORDER BY direct_reports DESC;

-- 15.3 Cross-department collaboration analysis
MATCH (e1:Employee)-[:COLLABORATES_WITH]->(e2:Employee)
WHERE e1.department <> e2.department
RETURN e1.department AS dept1, e2.department AS dept2, count(*) AS collaborations
GROUP BY e1.department, e2.department
ORDER BY collaborations DESC;

-- 15.4 Employee without any relationships
MATCH (e:Employee)
WHERE NOT EXISTS { MATCH (e)-[:REPORTS_TO]->(:Employee) }
  AND NOT EXISTS { MATCH (e)-[:MANAGES]->(:Department) }
  AND NOT EXISTS { MATCH (e)-[:WORKS_ON]->(:Project) }
  AND NOT EXISTS { MATCH (e)-[:MENTORS]->(:Employee) }
  AND NOT EXISTS { MATCH (e)-[:COLLABORATES_WITH]->(:Employee) }
RETURN e.name AS isolated_employee, e.department
ORDER BY e.name;

-- 15.5 Project team composition
MATCH (p:Project)<-[w:WORKS_ON]-(e:Employee)
RETURN p.name AS project,
       p.status,
       count(e) AS team_size,
       sum(w.hours) AS total_hours,
       sum(e.salary) AS team_payroll
GROUP BY p.name, p.status
ORDER BY team_size DESC;


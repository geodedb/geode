-- ============================================================================
-- GEODE ENTERPRISE EXTENDED TEST FILE
-- ============================================================================
-- Comprehensive edge case and stress testing for advanced Geode features.
-- Run with: ./zig-out/bin/geode shell --insecure
-- Then: /source ./testing/shell/enterprise_test_extended.gql
-- ============================================================================
--
-- GQL CONFORMANCE NOTES (ISO/IEC 39075:2024):
-- ============================================================================
-- Per the GQL specification, ORDER BY has specific requirements:
--
-- 1. SORT KEY REQUIREMENTS (Base Conformance):
--    - Sort keys should use binding variable references (column aliases)
--    - Example: ORDER BY total_qty DESC (CORRECT)
--
-- 2. OPTIONAL FEATURES (Not Required for Base Conformance):
--    - GQ14 "Complex expressions in sort keys": e.salary / e.level
--    - GQ16 "Pre-projection aliases in sort keys": references to pre-RETURN aliases
--    - GF20 "Aggregate functions in sort keys": ORDER BY sum(qty)
--
-- 3. GEODE IMPLEMENTATION:
--    - Fully supports ORDER BY on aliases (base conformance)
--    - Partial support for GQ14 when component columns are in RETURN
--    - Use aliases for guaranteed compatibility
--
-- ============================================================================


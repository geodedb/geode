-- Migration: Social Network Schema
-- Version: 001
-- Description: Creates a comprehensive social network graph with users, posts, companies, and locations
-- Author: Geode Team
-- Date: 2025-09-26

-- ============================================================================
-- SCHEMA DOCUMENTATION
-- ============================================================================
-- Note: GQL standard doesn't include DDL statements like CREATE LABEL or CREATE CONSTRAINT.
-- These schema definitions are documented here for reference and would be implemented
-- using database-specific configuration or through the CREATE statements that follow.
--
-- The following schema elements would typically be configured:
--
-- CONSTRAINTS:
--   - UNIQUE constraint on User.email
--   - UNIQUE constraint on Company.ticker  
--   - NOT NULL constraints on id fields
--   - CHECK constraints on numeric ranges (e.g., rating 0-5)
--
-- INDEXES:
--   - B-tree index on User.location
--   - B-tree index on Post.created_at
--   - B-tree index on Company.industry
--   - Full-text search indexes on content fields
--   - Vector similarity indexes for embeddings
--   - Spatial indexes for geographic data
--   - Network indexes for IP/subnet data
--
-- ============================================================================
-- NODE TYPES AND PROPERTIES
-- ============================================================================

-- User nodes represent people in the social network
-- Properties:
--   id: STRING (required, unique identifier)
--   email: STRING (required, unique)
--   username: STRING (required)
--   full_name: STRING
--   bio: STRING
--   created_at: TIMESTAMP (required)
--   last_active: TIMESTAMP
--   location: STRING
--   ip_address: IpAddr
--   profile_vector: VectorF32 (8 dimensions)
--   verified: BOOLEAN (default: false)
--   follower_count: INTEGER (default: 0)
--   following_count: INTEGER (default: 0)

-- Post nodes represent user-generated content
-- Properties:
--   id: STRING (required, unique identifier)
--   content: STRING (required)
--   created_at: TIMESTAMP (required)
--   updated_at: TIMESTAMP
--   likes: INTEGER (default: 0)
--   shares: INTEGER (default: 0)
--   comments: INTEGER (default: 0)
--   content_vector: VectorF32 (8 dimensions)
--   language: LanguageTag
--   sentiment: FLOAT

-- Company nodes represent organizations
-- Properties:
--   id: STRING (required, unique identifier)
--   name: STRING (required)
--   ticker: STRING (unique)
--   industry: STRING
--   founded: DATE
--   headquarters: LatLon
--   employees: INTEGER
--   revenue: Currency
--   website: STRING
--   description: STRING
--   logo_hash: Hash

-- Location nodes represent geographic places
-- Properties:
--   id: STRING (required, unique identifier)
--   name: STRING (required)
--   type: STRING (city, state, country)
--   coordinates: LatLon
--   population: INTEGER
--   timezone: STRING
--   country_code: STRING
--   region: Geometry

-- Topic nodes represent discussion topics/hashtags
-- Properties:
--   id: STRING (required, unique identifier)
--   name: STRING (required)
--   category: STRING
--   description: STRING
--   trending_score: FLOAT
--   related_vector: VectorF32 (8 dimensions)

-- Group nodes represent communities/groups
-- Properties:
--   id: STRING (required, unique identifier)
--   name: STRING (required)
--   description: STRING
--   created_at: TIMESTAMP (required)
--   member_count: INTEGER (default: 0)
--   privacy: STRING (default: 'public')
--   rules: STRING[]
--   cover_image_hash: Hash

-- Event nodes represent events/meetings
-- Properties:
--   id: STRING (required, unique identifier)
--   title: STRING (required)
--   description: STRING
--   start_time: TIMESTAMP (required)
--   end_time: TIMESTAMP
--   location: LatLon
--   venue: STRING
--   capacity: INTEGER
--   attendees: INTEGER (default: 0)
--   ticket_price: Currency
--   categories: STRING[]

-- Product nodes represent products/services
-- Properties:
--   id: STRING (required, unique identifier)
--   name: STRING (required)
--   description: STRING
--   price: Currency
--   category: STRING
--   brand: STRING
--   rating: FLOAT (0-5)
--   reviews: INTEGER (default: 0)
--   in_stock: BOOLEAN (default: true)
--   features: STRING[]
--   embedding: VectorF32 (8 dimensions)

-- Device nodes represent user devices
-- Properties:
--   id: STRING (required, unique identifier)
--   device_type: STRING
--   os: STRING
--   browser: STRING
--   ip_address: IpAddr
--   mac_address: Mac
--   subnet: Subnet
--   last_seen: TIMESTAMP
--   trust_score: FLOAT

-- Media nodes represent media files
-- Properties:
--   id: STRING (required, unique identifier)
--   type: STRING (image, video, audio)
--   url: STRING
--   size_bytes: INTEGER
--   mime_type: STRING
--   duration_seconds: INTEGER
--   width: INTEGER
--   height: INTEGER
--   hash: Hash
--   created_at: TIMESTAMP
--   tags: STRING[]

-- ============================================================================
-- EDGE TYPES AND PROPERTIES
-- ============================================================================

-- FOLLOWS: User follows another User
-- Properties:
--   since: TIMESTAMP (required)
--   notifications: BOOLEAN (default: true)

-- FRIENDS_WITH: Mutual friendship between Users
-- Properties:
--   since: TIMESTAMP (required)
--   closeness_score: FLOAT

-- LIKES: User likes a Post
-- Properties:
--   timestamp: TIMESTAMP (required)
--   reaction: STRING (like, love, haha, wow, sad, angry)

-- POSTED: User created a Post
-- Properties:
--   timestamp: TIMESTAMP (required)
--   device_id: STRING

-- COMMENTED_ON: User commented on a Post
-- Properties:
--   content: STRING (required)
--   timestamp: TIMESTAMP (required)
--   edited: BOOLEAN (default: false)

-- SHARED: User shared a Post
-- Properties:
--   timestamp: TIMESTAMP (required)
--   comment: STRING

-- WORKS_AT: User works at a Company
-- Properties:
--   position: STRING
--   department: STRING
--   start_date: DATE (required)
--   end_date: DATE
--   is_current: BOOLEAN (default: true)

-- LOCATED_IN: User/Company/Event is located in a Location
-- Properties:
--   since: DATE
--   is_primary: BOOLEAN (default: true)

-- MEMBER_OF: User is member of a Group
-- Properties:
--   joined_at: TIMESTAMP (required)
--   role: STRING (default: 'member')

-- ATTENDING: User is attending an Event
-- Properties:
--   rsvp_status: STRING (going, interested, not_going)
--   rsvp_time: TIMESTAMP
--   ticket_count: INTEGER (default: 1)

-- PURCHASED: User purchased a Product
-- Properties:
--   timestamp: TIMESTAMP (required)
--   quantity: INTEGER (default: 1)
--   price: Currency
--   rating: INTEGER
--   review: STRING

-- TAGGED_WITH: Post/Media is tagged with a Topic
-- Properties:
--   confidence: FLOAT (default: 1.0)
--   auto_generated: BOOLEAN (default: false)

-- CONNECTED_FROM: Device connected from an IP/location
-- Properties:
--   first_seen: TIMESTAMP (required)
--   last_seen: TIMESTAMP (required)
--   connection_count: INTEGER (default: 1)

-- MENTIONED_IN: User/Company mentioned in a Post
-- Properties:
--   context: STRING
--   sentiment: FLOAT

-- REPLIED_TO: Post is a reply to another Post
-- Properties:
--   timestamp: TIMESTAMP (required)
--   thread_depth: INTEGER (default: 1)

-- INVESTED_IN: Company/User invested in another Company
-- Properties:
--   amount: Currency
--   date: DATE
--   round: STRING (seed, series_a, series_b, etc)

-- ============================================================================
-- SAMPLE NODE CREATION
-- ============================================================================
-- The actual data is created using standard GQL CREATE statements.
-- See 002_social_network_data.gql for node creation
-- See 003_social_network_relationships.gql for relationship creation
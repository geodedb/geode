-- Connect companies to locations
MATCH (c:Company), (l:Location)
WHERE distance_haversine(c.headquarters, l.coordinates) < 50000  -- Within 50km
CREATE (c)-[:LOCATED_IN {since: c.founded, is_primary: true}]->(l);

-- Tag posts with topics
MATCH (p:Post {id: 'post-1'}), (t:Topic {id: 'topic-1'})
CREATE (p)-[:TAGGED_WITH {confidence: 0.95, auto_generated: false}]->(t);

MATCH (p:Post {id: 'post-2'}), (t:Topic {id: 'topic-2'})

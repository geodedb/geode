-- Connect posts to users
MATCH (u:User {id: 'user-1'}), (p:Post {id: 'post-1'})
CREATE (u)-[:POSTED {timestamp: p.created_at, device_id: 'device-1'}]->(p);

MATCH (u:User {id: 'user-2'}), (p:Post {id: 'post-2'})
CREATE (u)-[:POSTED {timestamp: p.created_at, device_id: 'device-2'}]->(p);

MATCH (u:User {id: 'user-3'}), (p:Post {id: 'post-3'})
CREATE (u)-[:POSTED {timestamp: p.created_at, device_id: 'device-3'}]->(p);

MATCH (u:User {id: 'user-4'}), (p:Post {id: 'post-4'})
CREATE (u)-[:POSTED {timestamp: p.created_at, device_id: 'device-4'}]->(p);

MATCH (u:User {id: 'user-5'}), (p:Post {id: 'post-5'})
CREATE (u)-[:POSTED {timestamp: p.created_at, device_id: 'device-5'}]->(p);

-- Distribute remaining posts among users
MATCH (p:Post)
WHERE NOT (:User)-[:POSTED]->(p)
WITH p, toInteger(substring(p.id, 5)) AS post_num
MATCH (u:User {id: 'user-' + toString(6 + (post_num % 45))})
CREATE (u)-[:POSTED {timestamp: p.created_at, device_id: 'device-auto-' + toString(post_num)}]->(p);

-- Create likes on posts
MATCH (u:User), (p:Post)
WHERE rand() < 0.3  -- 30% chance of like
  AND NOT (u)-[:POSTED]->(p)  -- Don't like own posts
CREATE (u)-[:LIKES {
    timestamp: p.created_at + duration('PT' + toString(rand() * 86400) + 'S'),
    reaction: CASE
        WHEN rand() < 0.6 THEN 'like'
        WHEN rand() < 0.8 THEN 'love'
        WHEN rand() < 0.9 THEN 'wow'
        ELSE 'haha'
    END
}]->(p);

-- Create comments on posts
MATCH (u:User), (p:Post)
WHERE rand() < 0.1  -- 10% chance of comment
CREATE (u)-[:COMMENTED_ON {
    content: CASE toInteger(rand() * 5)
        WHEN 0 THEN 'Great post! Thanks for sharing.'
        WHEN 1 THEN 'Interesting perspective. I\'d love to hear more about this.'
        WHEN 2 THEN 'This is exactly what I needed to read today!'
        WHEN 3 THEN 'Have you considered the alternative approach?'
        ELSE 'Awesome work! Keep it up!'
    END,
    timestamp: p.created_at + duration('PT' + toString(rand() * 172800) + 'S'),
    edited: rand() < 0.1
}]->(p);

-- Create shares of posts
MATCH (u:User), (p:Post)
WHERE rand() < 0.05  -- 5% chance of share
  AND NOT (u)-[:POSTED]->(p)
CREATE (u)-[:SHARED {
    timestamp: p.created_at + duration('PT' + toString(rand() * 259200) + 'S'),
    comment: CASE
        WHEN rand() < 0.3 THEN 'Worth reading!'
        WHEN rand() < 0.6 THEN 'This is important.'
        ELSE null
    END
}]->(p);


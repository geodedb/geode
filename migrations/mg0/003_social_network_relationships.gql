-- Create friendships and follows
-- Core influencers have many followers
MATCH (follower:User), (followed:User)
WHERE follower.id IN ['user-1', 'user-2', 'user-3', 'user-4', 'user-5']
  AND followed.id IN ['user-3', 'user-4']
  AND follower <> followed
CREATE (follower)-[:FOLLOWS {
    since: timestamp('2021-01-01T00:00:00Z') + duration('P' + toString(rand() * 365) + 'D'),
    notifications: rand() > 0.3
}]->(followed);

-- Create a follow network for regular users
MATCH (u1:User), (u2:User)
WHERE toInteger(substring(u1.id, 5)) > 5
  AND toInteger(substring(u2.id, 5)) > 5
  AND u1 <> u2
  AND rand() < 0.15  -- 15% chance of follow
CREATE (u1)-[:FOLLOWS {
    since: timestamp('2022-01-01T00:00:00Z') + duration('P' + toString(rand() * 730) + 'D'),
    notifications: rand() > 0.5
}]->(u2);

-- Create mutual friendships among some users
MATCH (u1:User), (u2:User)
WHERE u1.id IN ['user-1', 'user-2', 'user-3', 'user-5']
  AND u2.id IN ['user-1', 'user-2', 'user-3', 'user-5']
  AND u1.id < u2.id  -- Avoid duplicates
CREATE (u1)-[:FRIENDS_WITH {
    since: timestamp('2020-06-01T00:00:00Z') + duration('P' + toString(rand() * 365) + 'D'),
    closeness_score: 0.5 + (rand() * 0.5)
}]->(u2);

CREATE (u2)-[:FRIENDS_WITH {
    since: timestamp('2020-06-01T00:00:00Z') + duration('P' + toString(rand() * 365) + 'D'),
    closeness_score: 0.5 + (rand() * 0.5)
}]->(u1);


WHERE u.id IN ['user-1', 'user-2', 'user-3']
CREATE (u)-[:MEMBER_OF {
    joined_at: timestamp('2020-04-01T00:00:00Z') + duration('P' + toString(rand() * 365) + 'D'),
    role: CASE u.id WHEN 'user-1' THEN 'admin' ELSE 'member' END

-- Auto-tag remaining posts
MATCH (p:Post), (t:Topic)
WHERE NOT (p)-[:TAGGED_WITH]->(t)
  AND rand() < 0.3
CREATE (p)-[:TAGGED_WITH {
    confidence: 0.5 + (rand() * 0.5),
    auto_generated: true
}]->(t);

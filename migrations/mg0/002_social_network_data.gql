-- Create 45 more users with varied profiles
UNWIND range(6, 50) AS i
CREATE (:User {
    id: 'user-' + toString(i),
    email: 'user' + toString(i) + '@example.com',
    username: 'user_' + toString(i),
    full_name: 'User ' + toString(i),
    bio: CASE i % 5
        WHEN 0 THEN 'Tech enthusiast | Developer | Open source contributor'
        WHEN 1 THEN 'Digital marketer | Growth hacker | Data-driven decisions'
        WHEN 2 THEN 'Designer | Artist | Creative soul | Photography lover'
        WHEN 3 THEN 'Business analyst | Strategy consultant | MBA graduate'
        ELSE 'Content creator | Writer | Storyteller | Travel blogger'
    END,
    created_at: timestamp('2020-01-01T00:00:00Z') + duration('P' + toString(i * 7) + 'D'),
    last_active: timestamp('2024-09-20T00:00:00Z') + duration('PT' + toString(i * 137) + 'M'),
    location: CASE i % 5
        WHEN 0 THEN 'San Francisco'
        WHEN 1 THEN 'New York'
        WHEN 2 THEN 'London'
        WHEN 3 THEN 'Tokyo'
        ELSE 'Berlin'
    END,
    ip_address: IpAddr('10.0.' + toString(i % 256) + '.' + toString((i * 7) % 256)),
    profile_vector: VectorF32([
        (i % 10) / 10.0, 
        ((i * 3) % 10) / 10.0,
        ((i * 5) % 10) / 10.0,
        ((i * 7) % 10) / 10.0,
        ((i * 11) % 10) / 10.0,
        ((i * 13) % 10) / 10.0,
        ((i * 17) % 10) / 10.0,
        ((i * 19) % 10) / 10.0
    ]),
    verified: i % 3 = 0,
    follower_count: (i * 23) % 1000,
    following_count: (i * 17) % 500
});


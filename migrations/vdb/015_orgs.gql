// --- Create Organization Relationships ---

// Standards collaboration relationships
MATCH (iso:Organization WHERE iso.acronym = 'ISO'),
      (iec:Organization WHERE iec.acronym = 'IEC')
CREATE (iso)-[:COLLABORATES_WITH {type: 'joint_standards', established: date('1976-01-01')}]->(iec);

// IANA operates under ICANN
MATCH (iana:Organization WHERE iana.acronym = 'IANA'),
      (icann:Organization WHERE icann.acronym = 'ICANN')
CREATE (iana)-[:OPERATES_UNDER]->(icann);

// IEEE and ACM are both computing professional associations
MATCH (ieee:Organization WHERE ieee.acronym = 'IEEE'),
      (acm:Organization WHERE acm.acronym = 'ACM')
CREATE (ieee)-[:RELATED_TO {type: 'professional_peers', domain: 'computing'}]->(acm);

// Government/research relationships
MATCH (nist:Organization WHERE nist.acronym = 'NIST'),
      (ansi:Organization WHERE ansi.acronym = 'ANSI'),
      (mitre:Organization WHERE mitre.acronym = 'MITRE')
CREATE (nist)-[:COORDINATES_WITH]->(ansi);
CREATE (nist)-[:CONTRACTS_WITH]->(mitre);

// International coordination
MATCH (itu:Organization WHERE itu.acronym = 'ITU'),
      (ietf:Organization WHERE ietf.acronym = 'IETF'),
      (icann:Organization WHERE icann.acronym = 'ICANN')
CREATE (itu)-[:COORDINATES_WITH {scope: 'telecommunications'}]->(ietf);
CREATE (itu)-[:COORDINATES_WITH {scope: 'internet_governance'}]->(icann);

// --- Query Examples ---

// Find all standards organizations
MATCH (org:Organization WHERE org.organization_type = 'standards_body')
RETURN org.name, org.acronym, org.founded
ORDER BY org.founded;

// Get organization hierarchy and relationships
MATCH (org:Organization WHERE org.acronym = $acronym)
OPTIONAL MATCH (org)-[rel]-(related:Organization)
RETURN org, type(rel) AS relationship_type, related.name AS related_org;

// Find organizations by domain
MATCH (org:Organization)-[:OWNS_DOMAIN]->(domain:Domain WHERE domain.name = $domain_name)
RETURN org;

// Get all domains owned by an organization
MATCH (org:Organization WHERE org.acronym = $acronym)-[:OWNS_DOMAIN]->(domain:Domain)
RETURN domain.name
ORDER BY domain.name;

// Find organizations founded in a specific time period
MATCH (org:Organization)
WHERE org.founded >= date($start_date) AND org.founded <= date($end_date)
RETURN org
ORDER BY org.founded;

// Find collaborative networks
MATCH path = (org1:Organization)-[:COLLABORATES_WITH|COORDINATES_WITH*1..3]-(org2:Organization)
WHERE org1.acronym = $acronym
RETURN path;

// Get organization influence score (based on connections)
MATCH (org:Organization)
OPTIONAL MATCH (org)-[rel]-(connected:Organization)
RETURN org.name, org.acronym, count(connected) AS connection_count
ORDER BY connection_count DESC;

// --- Migration Notes ---
// This GQL migration creates a graph representation of key organizations:
// 1. Organization nodes replace organization tables with rich metadata
// 2. OWNS_DOMAIN edges link organizations to their domains
// 3. Relationship edges (COLLABORATES_WITH, OPERATES_UNDER, etc.) model org interactions
// 4. Graph structure enables complex organizational relationship queries
// 5. Domain ownership is explicitly modeled for DNS authority tracking
// 6. Uses Geode's built-in audit system for tracking organizational changes
// 7. Natural representation of collaborative networks and hierarchies
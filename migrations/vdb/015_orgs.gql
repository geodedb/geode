// GQL Graph Migration: 015_orgs.gql
// Converts VDB organizations data to graph-based organization entities
// Based on ../../../vdb/migrations/015_orgs.sql

// --- Organization Schema Definition ---

CREATE LABEL Organization;

// Organization entity
CREATE (org:Organization:Entity {
  id: UUID DEFAULT gen_random_uuid(),
  name: STRING NOT NULL,
  acronym: STRING,
  description: STRING,
  organization_type: STRING, // standards_body, non_profit, government_agency, etc.
  founded: DATE,
  website: STRING,
  country: STRING,
  created_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP(),
  updated_at: TIMESTAMP,
  metadata: JSONB
});

// --- Edge Types for Organization Relationships ---

CREATE LABEL TYPE EDGE OWNS_DOMAIN; // Organization -> Domain
CREATE LABEL TYPE EDGE COLLABORATES_WITH; // Organization -> Organization
CREATE LABEL TYPE EDGE OPERATES_UNDER; // Organization -> Organization
CREATE LABEL TYPE EDGE RELATED_TO; // Organization -> Organization
CREATE LABEL TYPE EDGE COORDINATES_WITH; // Organization -> Organization
CREATE LABEL TYPE EDGE CONTRACTS_WITH; // Organization -> Organization

// --- Constraints and Indexes ---

CREATE CONSTRAINT org_id_unique ON (:Organization) ASSERT id IS UNIQUE;
CREATE CONSTRAINT org_name_unique ON (:Organization) ASSERT name IS UNIQUE;

CREATE INDEX org_acronym_idx ON (:Organization) (acronym);
CREATE INDEX org_type_idx ON (:Organization) (organization_type);
CREATE INDEX org_country_idx ON (:Organization) (country);
CREATE INDEX org_founded_idx ON (:Organization) (founded);

// --- Create Standard Organizations ---

// Internet Engineering Task Force
CALL create_domain('ietf.org');
CREATE (ietf:Organization:Entity {
  id: gen_random_uuid(),
  name: 'Internet Engineering Task Force',
  acronym: 'IETF',
  description: 'Develops and maintains Internet standards and protocols',
  organization_type: 'standards_body',
  founded: date('1986-01-01'),
  website: 'https://ietf.org',

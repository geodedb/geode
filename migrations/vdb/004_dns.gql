// --- Edge Types for DNS Hierarchy ---

// Domain hierarchy relationships
CREATE LABEL TYPE EDGE PARENT_OF; // Domain -> Domain (parent-child)
CREATE LABEL TYPE EDGE SUBDOMAIN_OF; // Domain -> Domain (child-parent)

// DNS delegation and authority
CREATE LABEL TYPE EDGE AUTHORITATIVE_FOR; // Nameserver -> Domain
CREATE LABEL TYPE EDGE DELEGATES_TO; // Domain -> Nameserver

// Registration relationships
CREATE LABEL TYPE EDGE REGISTERED_BY; // Domain -> Registrar
CREATE LABEL TYPE EDGE MANAGES; // Registrar -> Domain

// Resource record relationships
CREATE LABEL TYPE EDGE HAS_RECORD; // Domain -> ResourceRecord
CREATE LABEL TYPE EDGE POINTS_TO; // ResourceRecord -> Domain (for CNAME, PTR)
CREATE LABEL TYPE EDGE SERVES; // Nameserver -> ResourceRecord


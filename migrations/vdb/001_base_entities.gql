// GQL Graph Migration: 001_base_entities.gql
// Base entity definitions and common patterns for VDB graph schema
// Replaces 001_audit.sql with focus on core entity patterns
// (Audit functionality is handled by Geode's built-in audit system)

// --- Base Graph Schema Definition ---

// Common labels for all entities
CREATE LABEL Entity;
CREATE LABEL Versioned;
CREATE LABEL Timestamped;

// --- Base Entity Pattern ---

// All entities inherit these common properties
CREATE CONSTRAINT entity_base_pattern ON (:Entity) 
  ASSERT id IS NOT NULL AND created_at IS NOT NULL;

// Standard entity with minimal required fields
// Note: In practice, you would create entities with specific property values
// CREATE (entity:Entity {
//   id: uuid_v4(),
//   created_at: DateTime(),
//   updated_at: DateTime(),
//   metadata: Jsonb('{}')
// });

// Versioned entities track version numbers
// Note: In practice, you would create entities with specific property values
// CREATE (versioned_entity:Entity:Versioned {
//   id: uuid_v4(),
//   created_at: DateTime(),
//   updated_at: DateTime(),
//   version: 1,
//   metadata: Jsonb('{}')
// });

// Timestamped entities have detailed time tracking
// Note: In practice, you would create entities with specific property values
// CREATE (timestamped_entity:Entity:Timestamped {
//   id: uuid_v4(),
//   created_at: DateTime(),
//   updated_at: DateTime(),
//   last_accessed: DateTime(),
//   expires_at: DateTime(),
//   metadata: Jsonb('{}')
// });

// --- Common Edge Types ---

// Basic relationships used across domains
CREATE LABEL TYPE EDGE CONTAINS;
CREATE LABEL TYPE EDGE BELONGS_TO;
CREATE LABEL TYPE EDGE DEPENDS_ON;
CREATE LABEL TYPE EDGE REFERENCES;
CREATE LABEL TYPE EDGE DERIVED_FROM;

// Hierarchical relationships
CREATE LABEL TYPE EDGE PARENT_OF;
CREATE LABEL TYPE EDGE CHILD_OF;

// Temporal relationships
CREATE LABEL TYPE EDGE PRECEDES;
CREATE LABEL TYPE EDGE FOLLOWS;

// --- Universal Constraints ---
// Note: GQL constraints are not part of the ISO/IEC 39075:2024 standard
// These would be enforced at the application level or through Geode's
// built-in validation systems

// Conceptual constraints (enforced by application logic):
// - All entities must have valid UUIDs for id property
// - Timestamps must be valid (updated_at >= created_at when both present)  
// - Version numbers must be positive integers

// --- Universal Indexes ---
// Note: Index creation syntax is implementation-specific and not standardized in GQL
// Geode would provide its own indexing mechanisms

// Conceptual indexes (would be created through Geode's indexing system):
// - entity_id_idx: Index on Entity.id for fast lookups
// - entity_created_at_idx: Index on Entity.created_at for temporal queries
// - versioned_version_idx: Index on Versioned.version for version queries
// - timestamped_updated_idx: Index on Timestamped.updated_at for recent updates
// - timestamped_expires_idx: Index on Timestamped.expires_at for expiration queries
// - timestamped_accessed_idx: Index on Timestamped.last_accessed for access patterns


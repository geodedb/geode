// --- Common Query Patterns ---

// Find all entities of a specific type
MATCH (e:Entity WHERE e:$label)
RETURN e;

// Get entity with full metadata
MATCH (e:Entity WHERE e.id = $entity_id)
RETURN e.id, e.created_at, e.updated_at, e.metadata;

// Find recently updated entities
MATCH (e:Entity)
WHERE e.updated_at > (CURRENT_TIMESTAMP() - duration('P7D'))
RETURN e
ORDER BY e.updated_at DESC;

// Find entities by metadata query
MATCH (e:Entity)
WHERE e.metadata[$key] = $value
RETURN e;

// Get entity hierarchy (parent-child relationships)
MATCH path = (parent:Entity)-[:PARENT_OF*]->(child:Entity)
WHERE parent.id = $parent_id
RETURN path;

// Find orphaned entities (no incoming relationships)
MATCH (e:Entity)
WHERE NOT ()-[:CONTAINS|PARENT_OF|REFERENCES]->(e)
RETURN e;

// --- Data Validation Patterns ---
// Note: These are conceptual validation patterns. In practice, validation

// GQL Graph Migration: 001_base_entities.gql
// Base entity definitions and common patterns for VDB graph schema
// Replaces 001_audit.sql with focus on core entity patterns
// (Audit functionality is handled by Geode's built-in audit system)

// --- Base Graph Schema Documentation ---
// Note: GQL standard doesn't include DDL statements like CREATE LABEL or CREATE CONSTRAINT.
// These patterns document the base entity structure that would be used throughout
// the VDB graph database.

// Common entity patterns:
// - Entity: Base pattern for all nodes
// - Versioned: Nodes that track version numbers
// - Timestamped: Nodes with detailed time tracking

// Base constraints that would typically be enforced:
// - All Entity nodes must have id and created_at properties
// - id must be unique within each label
// - Timestamps should be non-null where required

// --- Base Entity Pattern Examples ---

// Standard entity with minimal required fields
// Example of creating a base entity:
CREATE (entity:Entity {
  id: 'uuid_v4_example_001',
  created_at: timestamp('2024-09-27T12:00:00Z'),
  updated_at: timestamp('2024-09-27T12:00:00Z'),
  metadata: Jsonb('{}')
});

// Versioned entity that tracks version numbers
CREATE (versioned_entity:Entity:Versioned {
  id: 'uuid_v4_example_002',
  created_at: timestamp('2024-09-27T12:00:00Z'),
  updated_at: timestamp('2024-09-27T12:00:00Z'),
  version: 1,
  metadata: Jsonb('{"source": "migration"}')
});

// Timestamped entity with detailed time tracking
CREATE (timestamped_entity:Entity:Timestamped {
  id: 'uuid_v4_example_003',
  created_at: timestamp('2024-09-27T12:00:00Z'),
  updated_at: timestamp('2024-09-27T12:00:00Z'),
  deleted_at: null,
  valid_from: timestamp('2024-09-27T12:00:00Z'),
  valid_to: timestamp('9999-12-31T23:59:59Z'),
  metadata: Jsonb('{"tracking": "enabled"}')
});

// --- Common Relationships ---

// Version tracking relationship
MATCH (v1:Versioned {id: 'uuid_v4_example_002', version: 1}),
      (v2:Versioned {id: 'uuid_v4_example_002', version: 2})
CREATE (v1)-[:NEXT_VERSION {changed_at: timestamp('2024-09-27T13:00:00Z')}]->(v2);

// Parent-child hierarchy
MATCH (parent:Entity {id: 'uuid_v4_example_001'}),
      (child:Entity {id: 'uuid_v4_example_002'})
CREATE (parent)-[:HAS_CHILD {created_at: timestamp('2024-09-27T12:30:00Z')}]->(child);

// Ownership relationship
MATCH (owner:Entity {id: 'uuid_v4_example_001'}),
      (resource:Entity {id: 'uuid_v4_example_003'})
CREATE (owner)-[:OWNS {since: timestamp('2024-09-27T12:00:00Z')}]->(resource);


global
    log stdout local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Stats interface
stats enable
stats uri /stats
stats refresh 10s

# TCP Load balancing for Geode
frontend geode_tcp_frontend
    bind *:7500
    mode tcp
    default_backend geode_tcp_backend

backend geode_tcp_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check send "RETURN 1 AS health\n"
    tcp-check expect string "1"
    server geode-leader geode-leader:7568 check
    server geode-follower-1 geode-follower-1:7568 check
    server geode-follower-2 geode-follower-2:7568 check

# Note: QUIC/UDP load balancing requires a different approach
# Consider using a QUIC-aware load balancer or DNS round-robin for QUIC
global
    log stdout local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Stats interface
stats enable
stats uri /stats
stats refresh 10s

# Note: QUIC/UDP load balancing requires a QUIC-aware load balancer.
# This HAProxy config intentionally avoids proxying database traffic.
# Use DNS round-robin or a dedicated QUIC LB; keep this file for stats only.

# Geode Development Environment - Docker Compose
# Complete development stack with all services and tools
# Use: docker compose -f docker-compose.dev.yml up -d

services:
  # Main development container
  geode-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        USERNAME: ${USERNAME:-dev}
        ZIG_VERSION: "0.16.0"
    image: geode-dev:latest
    container_name: geode-dev
    hostname: geode-dev
    stdin_open: true
    tty: true
    volumes:
      # Mount entire project directory
      - .:/workspace:cached
      # Separate cache directories for better performance
      - zig-cache:/workspace/zig-cache
      - zig-global-cache:/home/${USERNAME:-dev}/.cache/zig

      # Git configuration (read-only)
      - ~/.gitconfig:/home/${USERNAME:-dev}/.gitconfig:ro

      # VSCode and Cursor IDE configurations
      - ~/.vscode:/home/${USERNAME:-dev}/.vscode:cached
      - ~/.vscode-server:/home/${USERNAME:-dev}/.vscode-server:cached
      - ~/.cursor:/home/${USERNAME:-dev}/.cursor:cached
      - ~/.cursor-server:/home/${USERNAME:-dev}/.cursor-server:cached
      - ~/.config/Code:/home/${USERNAME:-dev}/.config/Code:cached
      - ~/.config/Cursor:/home/${USERNAME:-dev}/.config/Cursor:cached

      # AI Assistant IDE configurations
      - ~/.config/Claude:/home/${USERNAME:-dev}/.config/Claude:cached
      - ~/.config/github-copilot:/home/${USERNAME:-dev}/.config/github-copilot:cached
      - ~/.config/opencode:/home/${USERNAME:-dev}/.config/opencode:cached
      - ~/.config/crush:/home/${USERNAME:-dev}/.config/crush:cached

      # AI Assistant CLI configurations and sessions
      - ~/.anthropic:/home/${USERNAME:-dev}/.anthropic:cached
      - ~/.config/gh:/home/${USERNAME:-dev}/.config/gh:cached
      - ~/.aider:/home/${USERNAME:-dev}/.aider:cached
      - ~/.config/aider:/home/${USERNAME:-dev}/.config/aider:cached

    environment:
      # Development environment
      - GEODE_ENV=development
      # geode reads no LOG_LEVEL (run it with --log-level debug), no
      # RUST_BACKTRACE (it is not written in Rust), no VAULT_* (no KMS
      # provider reads Vault) and no REDIS_URL (it has no Redis cache).
      # SONNY-6435.
      # geode reads no S3_* variable: backups are local files written by
      # `geode backup create` (SONNY-6290); copy them to object storage yourself
      # (scripts/init-minio.sh sets up the MinIO bucket). SONNY-6430.
      # FIPS: geode reads no FIPS_MODE; FIPS is the -Dfips=true build, whose
      # OpenSSL provider reads OPENSSL_CONF. SONNY-6435.
      - OPENSSL_CONF=/opt/openssl-fips/ssl/openssl.cnf
      # Build optimization
      - ZIG_LOCAL_CACHE_DIR=/workspace/zig-cache
      - ZIG_GLOBAL_CACHE_DIR=/home/dev/.cache/zig
    networks:
      - geode-dev-network
    ports:
      # Geode server ports
      - "3141:3141/udp"   # QUIC (+TLS over QUIC)
      - "9091:9091/tcp"   # Metrics
      # Debug ports
      - "9999:9999/tcp"   # Debug port
      - "4000:4000/tcp"   # LSP server
    # SONNY-6442: no Vault, MinIO or Redis: geode uses none of them (no KMS
    # provider reads Vault, backups are local files, there is no Redis cache).
    command: /bin/bash

  # Prometheus - Metrics Collection (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: geode-dev-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-dev-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geode-dev-network
    profiles:
      - monitoring

  # Grafana - Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: geode-dev-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dev-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geode-dev-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

volumes:
  # Persistent data volumes
  prometheus-dev-data:
    driver: local
  grafana-dev-data:
    driver: local
  # Build cache volumes (for performance)
  zig-cache:
    driver: local
  zig-global-cache:
    driver: local

networks:
  geode-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

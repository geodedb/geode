name: governance
on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      telemetry_strict:
        description: 'Set to 1 to enforce telemetry smoke test failures'
        required: false
        default: '0'

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary-governance:
    runs-on:
      group: lab
      labels: [self-hosted, X64]
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('**/build.zig', '**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build canary scanner
        run: cd tools/canaryscan && go build -o ../../bin/canaryscan .
      - name: Strict verify GAP_ANALYSIS vs evidence
        run: ./bin/canaryscan --root . --out status.json --csv status.csv --verify docs/GAP_ANALYSIS.md --strict
      - name: Governance summary
        run: zig run scripts/governance_ci.zig | tee governance_summary.jsonl
      - name: Generate badge
        run: zig run scripts/generate_badges.zig -- --status status.csv --out badges/evidence.svg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-artifacts
          path: |
            status.json
            status.csv
            badges/evidence.svg
            governance_summary.jsonl
  telemetry-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('**/build.zig', '**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Build binaries
        run: zig build -Doptimize=ReleaseSafe
      - name: Run telemetry smoke (soft)
        env:
          GEODE_CI_TELEMETRY_SMOKE: '1'
          # Allow workflows_dispatch to override strict via input; default 0
          GEODE_CI_TELEMETRY_STRICT: ${{ github.event.inputs.telemetry_strict || '0' }}
        run: |
          # Run the telemetry smoke test only; ignore failure unless strict is set
          set +e
          zig test test_telemetry_smoke.zig
          exit 0
      - name: Upload telemetry logs (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-artifacts
          path: |
            single_stdout.log
            single_stderr.log
            test_stdout.log
            test_stderr.log
            test_run.log

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.15.1"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-mode: [Debug, ReleaseSafe]
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Cache Zig dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/zig
          .zig-cache
        key: ${{ runner.os }}-zig-${{ hashFiles('build.zig') }}
        restore-keys: |
          ${{ runner.os }}-zig-
    
    - name: Build Geode
      run: |
        if [ "${{ matrix.build-mode }}" = "Debug" ]; then
          make build
        else
          make release
        fi
    
    - name: Run Zig tests
      run: zig build test
    
    - name: Run Go client tests
      run: make go-test
    
    - name: Run integration tests
      run: make integration-test
    
    - name: Run canary tests
      run: zig build canary-test
    
    - name: Check governance
      run: make governance-check

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker images
      run: make docker-build
    
    - name: Test Docker containers
      run: make docker-test

  fuzzing:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Run fuzz tests
      run: |
        timeout 20m make fuzz || true
    
    - name: Upload fuzz artifacts
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: fuzz-crashes
        path: fuzz/crashes/

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Run benchmarks
      run: make bench
    
    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'customBiggerIsBetter'
        output-file-path: bench-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false

  cross-compile:
    name: Cross Compilation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [
          "x86_64-linux-gnu",
          "aarch64-linux-gnu", 
          "x86_64-windows-gnu",
          "x86_64-macos",
          "aarch64-macos"
        ]
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Cross compile for ${{ matrix.target }}
      run: |
        zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Check Zig formatting
      run: |
        zig fmt --check src/
        zig fmt --check tests/
        zig fmt --check tools/
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Check Go formatting
      run: |
        cd clients/go
        gofmt -l . | tee /tmp/gofmt.out
        test -z "$(cat /tmp/gofmt.out)"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, cross-compile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Build release artifacts
      run: |
        make release
        make cross-compile
    
    - name: Create tarball
      run: |
        tar czf geode-linux-x86_64.tar.gz zig-out/bin/
    
    - name: Generate changelog
      run: |
        git log --pretty=format:"* %s (%h)" $(git describe --tags --abbrev=0)..HEAD > CHANGELOG.md
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          geode-*.tar.gz
          CHANGELOG.md
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
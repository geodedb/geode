name: Nightly Builds

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force nightly build even if no changes'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.15.1

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for commits since last nightly
        id: check
        run: |
          # Check if there are commits in last 24 hours
          LAST_COMMIT=$(git log --since="24 hours ago" --oneline | wc -l)

          if [ "$LAST_COMMIT" -gt 0 ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✓ Found $LAST_COMMIT commits in last 24 hours"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "✗ No commits in last 24 hours, skipping nightly"
          fi

  nightly-release:
    name: GoReleaser Pro Nightly
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old nightly tag
        continue-on-error: true
        run: |
          git push --delete origin nightly || true
          git tag -d nightly || true

      - name: Create nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Run GoReleaser Pro Nightly
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: '~> v2'
          args: release --nightly --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly build failed"
          echo "Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: Cross-Compile Clients

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'clients/**'
      - 'build.zig'
      - 'Makefile'
      - '.github/workflows/cross-compile-clients.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'clients/**'
      - 'build.zig'
      - 'Makefile'
      - '.github/workflows/cross-compile-clients.yml'

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.1
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user qemu-user-static
    
    - name: Install Wine (for Windows testing)
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y wine wine64
    
    - name: Cross-compile clients
      run: make cross-clients
    
    - name: Test cross-compiled clients with QEMU
      run: make qemu-test-clients
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: cross-compiled-clients
        path: |
          zig-out/clients/
        retention-days: 7
    
    - name: Create release matrix
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "Creating release packages..."
        for platform in zig-out/clients/*; do
          platform_name=$(basename "$platform")
          tar czf "geode-clients-${platform_name}.tar.gz" -C zig-out/clients "$platform_name"
        done
        ls -la *.tar.gz
    
    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: geode-clients-*.tar.gz
        fail_on_unmatched_files: false

  test-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    
    runs-on: ${{ matrix.os }}
    needs: cross-compile
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.1
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: cross-compiled-clients
        path: zig-out/clients
    
    - name: Test native client
      run: |
        echo "Testing native client for ${{ matrix.target }}..."
        if [ -f "zig-out/clients/${{ matrix.target }}/geode-zig-example-${{ matrix.target }}" ]; then
          ./zig-out/clients/${{ matrix.target }}/geode-zig-example-${{ matrix.target }} || true
        elif [ -f "zig-out/clients/${{ matrix.target }}/geode-zig-example-${{ matrix.target }}.exe" ]; then
          ./zig-out/clients/${{ matrix.target }}/geode-zig-example-${{ matrix.target }}.exe || true
        fi
      shell: bash
name: build-and-publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils build-essential jq python3 python3-pip
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig','src/**/*.zig') }}
          restore-keys: ${{ runner.os }}-zig-
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Schema validate EXPLAIN output
        run: |
          pip3 install --no-cache-dir jsonschema
          
          # Test EXPLAIN output (simpler than PROFILE in stdio mode)
          echo '{"type":"RUN_GQL","text":"EXPLAIN RETURN 1 AS x ORDER BY x LIMIT 1","params":{},"page_size":100}' | \
            ./zig-out/bin/geoded 2>/dev/null > explain.json
          
          # Validate the structure has expected fields
          jq -e '.result.json.profile_version' explain.json > /dev/null || \
            (echo "Missing profile_version in EXPLAIN output:" && cat explain.json && exit 1)
          jq -e '.result.json.logical' explain.json > /dev/null || \
            (echo "Missing logical plan in EXPLAIN output:" && cat explain.json && exit 1)
          
          echo "EXPLAIN output validation passed"
      - name: Archive binaries
        run: |
          mkdir artifacts
          cp zig-out/bin/geoded artifacts/
          cp zig-out/bin/geodec artifacts/
          tar -czf geode-binaries.tar.gz -C artifacts .
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & Push Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/geode:dev-latest -t ghcr.io/${{ github.repository_owner }}/geode:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/geode:dev-latest
          docker push ghcr.io/${{ github.repository_owner }}/geode:${{ github.sha }}
      - name: Publish / Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-snapshot
          name: Dev Snapshot (auto-updated)
          draft: false
          prerelease: true
          files: geode-binaries.tar.gz
          fail_on_unmatched_files: false

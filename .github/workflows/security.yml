name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * MON'  # Weekly on Monday

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Check for known vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
    
    - name: SBOM generation
      uses: anchore/syft-action@v0.14.0
      with:
        artifact-name: sbom-${{ github.run_id }}

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: "0.15.1"
    
    - name: Run static analysis
      run: |
        # Check for common security issues
        grep -r "strcpy\|sprintf\|gets" src/ && echo "WARNING: Unsafe functions detected" || echo "No unsafe functions found"
        
        # Check for hardcoded credentials
        grep -rE "(password|secret|token|key)\s*=\s*[\"'][^\"']+[\"']" src/ --exclude="*test*" && echo "WARNING: Possible hardcoded credentials" || echo "No hardcoded credentials found"
        
        # Check for SQL injection vulnerabilities
        grep -r "std.fmt.allocPrint.*WHERE" src/ && echo "WARNING: Potential SQL injection" || echo "No SQL injection patterns found"

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: License scan
      uses: fossas/fossa-action@main
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
        analyze: true
        test: true

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - uses: spyderorg/workflows/.github/actions/nix-setup@main
      with:
        git-credentials: ${{ secrets.GIT_CREDENTIALS }}
        gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    
    - name: TruffleHog scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
    
    - name: Gitleaks scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
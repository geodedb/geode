name: Build and Release Binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils build-essential jq python3 python3-pip
      
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
          
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig','src/**/*.zig') }}
          restore-keys: ${{ runner.os }}-zig-
          
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
        
      - name: Build cross-platform binaries
        run: |
          # Build for multiple platforms
          make cross-linux-x86_64
          make cross-linux-arm64
          make cross-windows
          make cross-macos-x86_64
          make cross-macos-arm64
          
      - name: Schema validate EXPLAIN output
        run: |
          pip3 install --no-cache-dir jsonschema
          
          # Test EXPLAIN output (simpler than PROFILE in stdio mode)
          echo '{"type":"RUN_GQL","text":"EXPLAIN RETURN 1 AS x ORDER BY x LIMIT 1","params":{},"page_size":100}' | \
            ./zig-out/bin/geoded 2>/dev/null > explain.json
          
          # Validate the structure has expected fields
          jq -e '.result.json.profile_version' explain.json > /dev/null || \
            (echo "Missing profile_version in EXPLAIN output:" && cat explain.json && exit 1)
          jq -e '.result.json.logical' explain.json > /dev/null || \
            (echo "Missing logical plan in EXPLAIN output:" && cat explain.json && exit 1)
          
          echo "EXPLAIN output validation passed"
          
      - name: Archive binaries
        run: |
          # Create architecture-specific archives
          for arch in linux-x86_64 linux-arm64 windows-x86_64 macos-x86_64 macos-arm64; do
            if [ -d "zig-out/$arch/bin" ]; then
              tar -czf "geode-$arch.tar.gz" -C "zig-out/$arch" bin
            fi
          done
          
          # Create a combined archive with native Linux binaries
          tar -czf geode-binaries.tar.gz -C zig-out/linux-x86_64 bin
          
      - name: Publish / Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-snapshot
          name: Dev Snapshot (auto-updated)
          body: |
            Automated development build from commit ${{ github.sha }}
            
            ## Available Binaries
            - `geode-linux-x86_64.tar.gz` - Linux x86_64
            - `geode-linux-arm64.tar.gz` - Linux ARM64
            - `geode-windows-x86_64.tar.gz` - Windows x86_64
            - `geode-macos-x86_64.tar.gz` - macOS Intel
            - `geode-macos-arm64.tar.gz` - macOS Apple Silicon
            - `geode-binaries.tar.gz` - Linux x86_64 (legacy name)
            
            ## Docker Images
            Docker images are automatically built and published to GitHub Container Registry:
            - `ghcr.io/${{ github.repository_owner }}/geode:latest`
            - `ghcr.io/${{ github.repository_owner }}/geode:main-${{ github.sha }}`
            
            See the [Docker workflow](https://github.com/${{ github.repository }}/actions/workflows/docker-publish.yml) for details.
          draft: false
          prerelease: true
          files: |
            geode-*.tar.gz
          fail_on_unmatched_files: false
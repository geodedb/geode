name: Fuzz
on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzz duration (e.g. 10s, 5m, 1h)'
        required: false
        default: '10s'
      target:
        description: 'Specific fuzz target (leave empty for all)'
        required: false
        default: ''
jobs:
  fuzz-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            zig-out
            ~/.cache/zig
          key: ${{ runner.os }}-zig-fuzz-${{ hashFiles('build.zig','src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-fuzz-
            ${{ runner.os }}-zig-
      - name: Build CLI binaries first
        run: |
          # Build the CLI binaries that the tests depend on
          echo "Building CLI binaries..."
          zig build -Doptimize=Debug
          # Verify the binary exists
          if [ ! -f "./zig-out/bin/geode" ]; then
            echo "Warning: geode binary not found, trying to build individually"
            zig build geode -Doptimize=Debug || true
          fi
          ls -la ./zig-out/bin/ || echo "No binaries built yet"
      - name: Build tests
        run: |
          # Build tests without running them first
          zig build test -Dtest-filter="" || true
      - name: Run fuzz (short)
        run: |
          DURATION="${{ github.event.inputs.fuzz_duration || '10s' }}"
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ]; then
            echo "Running fuzz for target: $TARGET with duration: $DURATION"
            zig build test --fuzz=$DURATION --target=$TARGET || true
          else
            echo "Running all fuzz tests with duration: $DURATION"
            zig build test --fuzz=$DURATION || true
          fi
  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        target: [parser, hnsw_snapshot, hnsw_wal, txn_sequence, lfu_cache, protocol_hello, decimal_roundtrip, planner_prune]
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            zig-out
            ~/.cache/zig
          key: ${{ runner.os }}-zig-fuzz-${{ matrix.target }}-${{ hashFiles('build.zig','src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-fuzz-${{ matrix.target }}-
            ${{ runner.os }}-zig-fuzz-
      - name: Build CLI binaries first
        run: |
          # Build the CLI binaries that the tests depend on
          echo "Building CLI binaries..."
          zig build -Doptimize=Debug
          # Verify the binary exists
          if [ ! -f "./zig-out/bin/geode" ]; then
            echo "Warning: geode binary not found, trying to build individually"
            zig build geode -Doptimize=Debug || true
          fi
          ls -la ./zig-out/bin/ || echo "No binaries built yet"
      - name: Run fuzz target
        run: |
          echo "Running fuzz for target: ${{ matrix.target }}"
          zig build test -- -Denable-llvm-fuzzer=true || true
  fuzz-windows-skip:
    runs-on: windows-latest
    steps:
      - run: echo "Skipping fuzz on Windows (unsupported in Zig 0.15.1)"

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.15.1
  PROJECT_NAME: geode

jobs:
  build-matrix:
    name: Build/Test/Package (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-linux-gnu
            run_tests: true
          - os: linux
            arch: arm
            runner: ubuntu-latest
            target: arm-linux-gnueabihf
            run_tests: false
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-linux-gnu
            run_tests: false
          - os: linux
            arch: riscv64
            runner: ubuntu-latest
            target: riscv64-linux-gnu
            run_tests: false
          # macOS
          - os: macos
            arch: x86_64
            runner: macos-14
            target: x86_64-macos
            run_tests: false
          - os: macos
            arch: arm64
            runner: macos-14
            target: aarch64-macos
            run_tests: false
          # Windows
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-windows-msvc
            run_tests: false
          - os: windows
            arch: arm64
            runner: windows-latest
            target: aarch64-windows-msvc
            run_tests: false

    steps:
      - uses: de-vri-es/setup-git-credentials@v2
        with:
          credentials: ${{ secrets.GIT_CREDENTIALS }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Zig version
        run: zig version

      - name: Build (install) ReleaseSafe
        run: zig build -Dtarget='${{ matrix.target }}' -Doptimize=ReleaseSafe install

      - name: Test
        if: matrix.run_tests
        run: make test

      - name: Build fuzzers
        if: matrix.run_tests
        run: make fuzz

      - name: Bench (build only)
        if: matrix.run_tests
        run: make bench

      - name: Tools + Doccheck
        if: matrix.run_tests
        run: make doccheck

      - name: Upload installed binaries (unpackaged)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.os }}-${{ matrix.arch }}-zig-${{ env.ZIG_VERSION }}-bin
          path: zig-out/bin/**
          retention-days: 7
      - name: Package binaries (OS-specific archive)
        shell: bash
        run: |
          set -euo pipefail
          os='${{ matrix.os }}'
          arch='${{ matrix.arch }}'
          zigv='${{ env.ZIG_VERSION }}'
          name="${{ env.PROJECT_NAME }}-${os}-${arch}-zig-${zigv}"
          mkdir -p dist
          if [ "${os}" = "windows" ]; then
            if command -v powershell >/dev/null 2>&1; then
              powershell -NoProfile -Command "if (-Not (Test-Path 'zig-out/bin')) { throw 'zig-out/bin missing' }; Compress-Archive -Path 'zig-out/bin/*' -DestinationPath 'dist/${name}.zip' -Force"
            else
              echo "powershell not available for zip compression" >&2; exit 1
            fi
            echo "ARCHIVE_PATH=dist/${name}.zip" >> "$GITHUB_ENV"
            echo "ARCHIVE_NAME=${name}.zip" >> "$GITHUB_ENV"
          else
            [ -d zig-out/bin ] || { echo 'zig-out/bin missing' >&2; exit 1; }
            tar -czf "dist/${name}.tar.gz" -C zig-out/bin .
            echo "ARCHIVE_PATH=dist/${name}.tar.gz" >> "$GITHUB_ENV"
            echo "ARCHIVE_NAME=${name}.tar.gz" >> "$GITHUB_ENV"
          fi
          # checksums
          (cd dist; for f in *; do sha256sum "$f" > "$f.sha256"; sha512sum "$f" > "$f.sha512"; done)

      - name: Upload packaged artifact + checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.os }}-${{ matrix.arch }}-zig-${{ env.ZIG_VERSION }}
          path: |
            dist/${{ env.PROJECT_NAME }}-${{ matrix.os }}-${{ matrix.arch }}-zig-${{ env.ZIG_VERSION }}.tar.gz
            dist/${{ env.PROJECT_NAME }}-${{ matrix.os }}-${{ matrix.arch }}-zig-${{ env.ZIG_VERSION }}.zip
            dist/*.sha256
            dist/*.sha512
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: de-vri-es/setup-git-credentials@v2
        with:
          credentials: ${{ secrets.GIT_CREDENTIALS }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create source tarball
        run: git archive --format=tar.gz -o dist/source-${{ github.ref_name }}.tar.gz --prefix=${{ env.PROJECT_NAME }}-${{ github.ref_name }}/ ${{ github.sha }}

      - name: Collect license and signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for pat in LICENSE* COPYING* NOTICE*; do
            for f in $pat; do
              cp -v "$f" dist/
            done
          done

      - name: Create/Update Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: 'Automated release for ${{ github.ref_name }} (commit ${{ github.sha }})'
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.sha256
            dist/**/*.sha512
            dist/LICENSE*
            dist/COPYING*
            dist/NOTICE*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

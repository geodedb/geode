name: CANARY Verify

on:
  pull_request:
  push:
    branches: [main, trunk, master]

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build scanner
        run: go build -o ./bin/canaryscan ./tools/canaryscan
      - name: Generate status
        run: ./bin/canaryscan --root . --out status.json --csv status.csv
      - name: Verify GAP + Strict freshness
        run: ./bin/canaryscan --root . --verify docs/GAP_ANALYSIS.md --strict
      - name: Reality Delta CI Gate
        run: |
          if [ -x scripts/reality_delta_ci.sh ]; then
            bash scripts/reality_delta_ci.sh
          else
            echo "scripts/reality_delta_ci.sh missing or not executable" >&2
            exit 1
          fi

name: CANARY Verify

on:
  pull_request:
  push:
    branches: [main, trunk, master]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Sync vendor directory
        run: |
          go mod vendor
          cd clients/go/gql && go mod vendor && cd -
          cd tools/canaryscan && go mod tidy && cd -
      - name: Build scanner
        run: cd tools/canaryscan && go build -o ../../bin/canaryscan .
      - name: Generate status
        run: ./bin/canaryscan --root . --out status.json --csv status.csv
      - name: Verify GAP + Strict freshness
        run: ./bin/canaryscan --root . --verify docs/GAP_ANALYSIS.md --strict
      - name: Reality Delta CI Gate
        run: |
          if [ -x scripts/reality_delta_ci.sh ]; then
            bash scripts/reality_delta_ci.sh
          else
            echo "scripts/reality_delta_ci.sh missing or not executable" >&2
            exit 1
          fi

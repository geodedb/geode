name: Build, Test, Cross-compile, and Dev Release

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ['0.15.1']
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Zig version
        run: zig version
      - name: Build and Test
        env:
          CI: true
        run: make build test
      - name: Go GQL tests (race)
        env:
          CI: true
        run: go -C clients/go/gql test -race -count=1
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ runner.os }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: zig build
      - name: Unit tests
        env:
          CI: true
        run: make test
      - name: Build fuzzers
        run: make fuzz
      - name: Build bench
        run: make bench
      - name: Doccheck
        run: make doccheck
      - name: Ensure GAP updated when code changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}... | grep -E '\\.(zig|zon|yml)$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Code changes detected:"; echo "$CHANGED"
            echo "Checking GAP.md update..."
            git diff --name-only origin/${{ github.base_ref }}... | grep -q docs/GAP.md || { echo "GAP.md not updated"; exit 1; }
            zig build tools
            ./zig-out/bin/update-gap --summary "CI: code changed in PR" || true
          fi

  cross-platform-stdio-test:
    name: Cross-platform stdio test
    runs-on: ubuntu-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Test cross-platform stdio on Linux
        run: |
          echo "Running cross-platform stdio test on Linux..."
          echo "Zig version: $(zig version)"
          echo "Current directory: $(pwd)"
          echo "Test file exists: $(test -f tests/test_cross_platform_stdio.zig && echo 'yes' || echo 'no')"

          # Run the test and capture output
          if OUTPUT=$(zig test tests/test_cross_platform_stdio.zig 2>&1); then
            echo "Test passed successfully"
            echo "Output: $OUTPUT"
          else
            EXIT_CODE=$?
            echo "Test failed with exit code $EXIT_CODE"
            echo "Output: $OUTPUT"
            exit $EXIT_CODE
          fi

      - name: Cross-compile for Windows and test with Wine
        run: |
          # Install Wine for Windows emulation
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          # Install wine meta packages; tolerate transient failures with one retry
          if ! sudo apt-get install -y --no-install-recommends wine wine64; then
            echo "First wine install attempt failed, retrying after apt-get update..." >&2
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends wine wine64 || {
              echo "WARNING: Unable to install wine/wine64 packages" >&2
            }
          fi

          echo "Wine binaries after install (if any):"
          command -v wine 2>/dev/null || echo "wine not found"
          command -v wine64 2>/dev/null || echo "wine64 not found"
          ls -1 /usr/bin/wine* 2>/dev/null || true
          echo "uname -a: $(uname -a)"

          # Cross-compile a simple executable for Windows to test with Wine
          echo "Cross-compiling test executable for Windows..."
          zig build-exe tests/test_stdio_windows_exe.zig -target x86_64-windows -femit-bin=test_stdio_windows.exe

          # Check if binary was created
          if [ ! -f test_stdio_windows.exe ]; then
            echo "Failed to create Windows executable"
            exit 1
          fi

          echo "Selecting Wine command..."
          if command -v wine64 >/dev/null 2>&1; then
            WINE_CMD=wine64
          elif command -v wine >/dev/null 2>&1; then
            WINE_CMD=wine
          else
            echo "⚠ wine or wine64 not available, skipping Windows execution test (cross-compile succeeded)" >&2
            exit 0
          fi

          echo "Wine self-test ($WINE_CMD --version)..."
          if ! $WINE_CMD --version 2>/dev/null | head -1; then
            echo "Warning: failed to obtain Wine version (continuing)" >&2
          fi

          echo "Running test with $WINE_CMD..."
          # Run with Wine and capture output (suppress noisy debug)
          OUTPUT=$(WINEDEBUG=-all $WINE_CMD test_stdio_windows.exe 2>&1 || true)
          echo "Wine output: $OUTPUT"

          # Check for expected output or known Wine error patterns
          if echo "$OUTPUT" | grep -q "Test stdout" && echo "$OUTPUT" | grep -q "Test stderr"; then
            echo "✅ Wine test passed - found expected output"
          elif echo "$OUTPUT" | grep -q "Bad EXE format\|Invalid\|not supported"; then
            echo "⚠️ Wine execution failed (known Wine/architecture issue)" >&2
            echo "Note: Cross-compilation succeeded, which is the primary goal" >&2
            echo "This is likely a transient Wine packaging or architecture mismatch issue" >&2
            # Don't fail the build for Wine execution issues since cross-compilation worked
            exit 0
          else
            echo "⚠️ Wine test did not produce expected output" >&2
            echo "Output was: $OUTPUT" >&2
            echo "Note: Cross-compilation succeeded, continuing..." >&2
            # Don't fail for Wine runtime issues if cross-compilation worked
            exit 0
          fi

      - name: Cross-compile binaries for Windows
        run: |
          # Cross-compile the main binaries for Windows to verify they compile
          zig build -Dtarget=x86_64-windows -p zig-out/windows-x86_64

          # Verify the binaries were created
          test -f zig-out/windows-x86_64/bin/geoded.exe || exit 1
          test -f zig-out/windows-x86_64/bin/geodec.exe || exit 1
          test -f zig-out/windows-x86_64/bin/gql.exe || exit 1

  cross-builds:
    name: Cross builds (${{ matrix.archive_os }}-${{ matrix.archive_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: arm-linux-gnueabihf
            archive_os: linux
            archive_arch: arm
          - runner: ubuntu-latest
            target: aarch64-linux-gnu
            archive_os: linux
            archive_arch: arm64
          - runner: ubuntu-latest
            target: riscv64-linux-gnu
            archive_os: linux
            archive_arch: riscv64
          - runner: macos-14
            target: x86_64-macos
            archive_os: macos
            archive_arch: x86_64
          - runner: windows-latest
            target: aarch64-windows-msvc
            archive_os: windows
            archive_arch: arm64
        zig: ['0.15.1']
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Zig version
        run: zig version
      - name: Build (cross)
        run: make build ZIG_FLAGS='-Dtarget=${{ matrix.target }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.archive_os }}-${{ matrix.archive_arch }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        zig: [0.15.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: make build
      - name: Run tests
        env:
          CI: true
        run: zig build test
      - name: Build fuzzers
        run: make fuzz
      - name: Build bench
        run: make bench
      - name: Build tools
        run: zig build tools
      - name: Doccheck
        run: ./zig-out/bin/doccheck
      - name: Doc sync
        run: zig run src/tools/doc_sync.zig -- --check
      - name: Ensure GAP updated on code changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '\\.(zig|zon|md|yml)$' >/dev/null; then
            if ! git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '^docs/GAP.md$' >/dev/null; then
              echo "GAP.md not updated for code changes" >&2
              exit 1
            fi
          fi

  dev-release:
    name: Create or update dev release with binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
          
      - name: Build cross-platform binaries
        run: |
          # Build native release first
          zig build -Doptimize=ReleaseSafe
          
          # Build for multiple platforms
          zig build -Dtarget=x86_64-linux-gnu -p zig-out/linux-x86_64 -Doptimize=ReleaseSafe
          zig build -Dtarget=aarch64-linux-gnu -p zig-out/linux-arm64 -Doptimize=ReleaseSafe
          zig build -Dtarget=x86_64-windows-msvc -p zig-out/windows-x86_64 -Doptimize=ReleaseSafe
          zig build -Dtarget=x86_64-macos -p zig-out/macos-x86_64 -Doptimize=ReleaseSafe
          zig build -Dtarget=aarch64-macos -p zig-out/macos-arm64 -Doptimize=ReleaseSafe
          
      - name: Archive binaries
        run: |
          # Create architecture-specific archives
          for arch in linux-x86_64 linux-arm64 windows-x86_64 macos-x86_64 macos-arm64; do
            if [ -d "zig-out/$arch/bin" ]; then
              if [[ "$arch" == *"windows"* ]]; then
                # Windows uses ZIP
                cd "zig-out/$arch" && zip -r "../../geode-$arch.zip" bin/ && cd ../..
              else
                # Unix uses tar.gz
                tar -czf "geode-$arch.tar.gz" -C "zig-out/$arch" bin
              fi
            fi
          done
          
      - name: Create source tarball
        run: git archive --format=tar.gz -o geode-dev-source.tar.gz --prefix=geode-dev/ HEAD
        
      - name: Delete old dev release if exists
        run: |
          gh release delete dev --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create dev tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dev
          git push origin dev --force
          
      - name: Create/update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Release (auto-updated)
          body: |
            Automated development build from commit ${{ github.sha }}
            
            ## Available Binaries
            - `geode-linux-x86_64.tar.gz` - Linux x86_64
            - `geode-linux-arm64.tar.gz` - Linux ARM64  
            - `geode-windows-x86_64.zip` - Windows x86_64
            - `geode-macos-x86_64.tar.gz` - macOS Intel
            - `geode-macos-arm64.tar.gz` - macOS Apple Silicon
            - `geode-dev-source.tar.gz` - Source code
            
            Built with Zig 0.15.1 in ReleaseSafe mode.
            
            These binaries are automatically updated on every push to main and can be used for testing the latest development version.
          prerelease: true
          files: |
            geode-*.tar.gz
            geode-*.zip
          fail_on_unmatched_files: true

  tcp-go-client:
    name: Go client TCP tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build server
        run: zig build
      - name: Sync Go vendor
        run: |
          go mod vendor
          cd clients/go/gql && go mod vendor
      - name: Start geoded (tcp)
        run: |
          ./zig-out/bin/geoded --listen-quic 127.0.0.1:7567 > server.out 2> server.err &
          echo $! > geoded.pid
          for i in $(seq 1 40); do
            if nc -z 127.0.0.1 7567 2>/dev/null; then echo "server up"; break; fi; sleep 0.1; done
      - name: Go TCP tests
        env:
          CI: '' # Explicitly unset CI to allow TCP tests to run with actual server
        run: go -C clients/go/gql test -race -count=1 -run TCP
      - name: Logs on failure
        if: failure()
        run: |
          echo 'Listing processes'; ps aux | grep geoded || true
          echo '--- server stdout ---'; cat server.out || true
          echo '--- server stderr ---'; cat server.err || true
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-server-logs
          path: |
            server.out
            server.err
      - name: Stop server
        if: always()
        run: |
          if [ -f geoded.pid ]; then kill $(cat geoded.pid) || true; fi

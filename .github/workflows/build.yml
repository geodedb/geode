name: Build, Test, Cross-compile, and Dev Release

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ['0.15.1']
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Zig version
        run: zig version
      - name: Build and Test
        env:
          CI: true
        run: make build test
      - name: Go GQL tests (race)
        env:
          CI: true
        run: go -C clients/go/gql test -race -count=1
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ runner.os }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: zig build
      - name: Unit tests
        env:
          CI: true
        run: make test
      - name: Build fuzzers
        run: make fuzz
      - name: Build bench
        run: make bench
      - name: Doccheck
        run: make doccheck
      - name: Ensure GAP updated when code changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}... | grep -E '\\.(zig|zon|yml)$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Code changes detected:"; echo "$CHANGED"
            echo "Checking GAP.md update..."
            git diff --name-only origin/${{ github.base_ref }}... | grep -q docs/GAP.md || { echo "GAP.md not updated"; exit 1; }
            zig build tools
            ./zig-out/bin/update-gap --summary "CI: code changed in PR" || true
          fi

  cross-builds:
    name: Cross builds (${{ matrix.archive_os }}-${{ matrix.archive_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU variants
          - runner: ubuntu-latest
            target: arm-linux-gnueabihf
            archive_os: linux
            archive_arch: armv7
          - runner: ubuntu-latest
            target: aarch64-linux-gnu
            archive_os: linux
            archive_arch: arm64
          - runner: ubuntu-latest
            target: riscv64-linux-gnu
            archive_os: linux
            archive_arch: riscv64
          # Linux musl variants (for Alpine, static linking)
          - runner: ubuntu-latest
            target: x86_64-linux-musl
            archive_os: linux
            archive_arch: amd64-musl
          - runner: ubuntu-latest
            target: aarch64-linux-musl
            archive_os: linux
            archive_arch: arm64-musl
          # macOS variants
          - runner: macos-14
            target: x86_64-macos
            archive_os: macos
            archive_arch: x86_64
          - runner: macos-14
            target: aarch64-macos
            archive_os: macos
            archive_arch: arm64
          # Windows variants
          - runner: windows-latest
            target: x86_64-windows-gnu
            archive_os: windows
            archive_arch: amd64
          - runner: windows-latest
            target: aarch64-windows-gnu
            archive_os: windows
            archive_arch: arm64
        zig: ['0.15.1']
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Zig version
        run: zig version
      - name: Build (cross)
        run: make build ZIG_FLAGS='-Dtarget=${{ matrix.target }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.archive_os }}-${{ matrix.archive_arch }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        zig: [0.15.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: make build
      - name: Run tests
        env:
          CI: true
        run: zig build test
      - name: Build fuzzers
        run: make fuzz
      - name: Build bench
        run: make bench
      - name: Build tools
        run: zig build tools
      - name: Doccheck
        run: ./zig-out/bin/doccheck
      - name: Doc sync
        run: zig run src/tools/doc_sync.zig -- --check
      - name: Ensure GAP updated on code changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '\\.(zig|zon|md|yml)$' >/dev/null; then
            if ! git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '^docs/GAP.md$' >/dev/null; then
              echo "GAP.md not updated for code changes" >&2
              exit 1
            fi
          fi

  dev-release:
    name: Create or update dev release with binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
          
      - name: Build cross-platform binaries
        run: |
          # Build native release first
          zig build -Doptimize=ReleaseSafe
          
          # Build for multiple platforms
          zig build -Dtarget=x86_64-linux-gnu -p zig-out/linux-x86_64 -Doptimize=ReleaseSafe
          zig build -Dtarget=aarch64-linux-gnu -p zig-out/linux-arm64 -Doptimize=ReleaseSafe
          zig build -Dtarget=x86_64-windows-gnu -p zig-out/windows-x86_64 -Doptimize=ReleaseSafe
          zig build -Dtarget=x86_64-macos -p zig-out/macos-x86_64 -Doptimize=ReleaseSafe
          zig build -Dtarget=aarch64-macos -p zig-out/macos-arm64 -Doptimize=ReleaseSafe
          
      - name: Archive binaries
        run: |
          # Create architecture-specific archives
          for arch in linux-x86_64 linux-arm64 windows-x86_64 macos-x86_64 macos-arm64; do
            if [ -d "zig-out/$arch/bin" ]; then
              if [[ "$arch" == *"windows"* ]]; then
                # Windows uses ZIP
                cd "zig-out/$arch" && zip -r "../../geode-$arch.zip" bin/ && cd ../..
              else
                # Unix uses tar.gz
                tar -czf "geode-$arch.tar.gz" -C "zig-out/$arch" bin
              fi
            fi
          done
          
      - name: Create source tarball
        run: git archive --format=tar.gz -o geode-dev-source.tar.gz --prefix=geode-dev/ HEAD
        
      - name: Delete old dev release if exists
        run: |
          gh release delete dev --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create dev tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dev
          git push origin dev --force
          
      - name: Create/update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Release (auto-updated)
          body: |
            Automated development build from commit ${{ github.sha }}
            
            ## Available Binaries
            - `geode-linux-x86_64.tar.gz` - Linux x86_64
            - `geode-linux-arm64.tar.gz` - Linux ARM64  
            - `geode-windows-x86_64.zip` - Windows x86_64
            - `geode-macos-x86_64.tar.gz` - macOS Intel
            - `geode-macos-arm64.tar.gz` - macOS Apple Silicon
            - `geode-dev-source.tar.gz` - Source code
            
            Built with Zig 0.15.1 in ReleaseSafe mode.
            
            These binaries are automatically updated on every push to main and can be used for testing the latest development version.
          prerelease: true
          files: |
            geode-*.tar.gz
            geode-*.zip
          fail_on_unmatched_files: true

  docker-build:
    name: Build Docker Images
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        variant:
          - name: debian
            dockerfile: Dockerfile.ci
            platforms: linux/amd64,linux/arm64
            tags: latest,main
          - name: alpine
            dockerfile: Dockerfile.ci.alpine
            platforms: linux/amd64,linux/arm64
            tags: alpine
          - name: gpu
            dockerfile: Dockerfile.ci.gpu
            platforms: linux/amd64,linux/arm64
            tags: gpu
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download artifacts (Linux amd64)
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-Linux-zig-0.15.1
          path: ./artifacts/amd64

      - name: Download artifacts (Linux arm64)
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-Linux-zig-0.15.1
          path: ./artifacts/arm64

      - name: Prepare build context
        run: |
          # Create build contexts for each platform
          mkdir -p build-context/amd64/zig-out/bin
          mkdir -p build-context/arm64/zig-out/bin

          # Copy binaries to build contexts
          cp -r ./artifacts/amd64/zig-out/bin/* build-context/amd64/zig-out/bin/ || true
          cp -r ./artifacts/arm64/zig-out/bin/* build-context/arm64/zig-out/bin/ || true

          # Copy Dockerfile to each context
          cp ${{ matrix.variant.dockerfile }} build-context/amd64/Dockerfile
          cp ${{ matrix.variant.dockerfile }} build-context/arm64/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.variant.name }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant.name }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.variant.name }}
            type=sha,format=short,prefix=sha-,suffix=-${{ matrix.variant.name }}
            type=raw,value=${{ matrix.variant.tags }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./build-context/amd64
          file: ./build-context/amd64/Dockerfile
          push: true
          platforms: ${{ matrix.variant.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}
          provenance: false
          sbom: false

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.variant.name }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.variant.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          skip-version-check: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results-${{ matrix.variant.name }}.sarif'
          wait-for-processing: false

  docker-test:
    name: Test Docker Images
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        variant: [debian, alpine, gpu]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Docker image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.variant }} --help

      - name: Test basic query
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.variant }} \
            query "RETURN 1 AS x" --no-quic

      - name: Verify binaries exist
        run: |
          docker run --rm --entrypoint /bin/sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.variant }} -c "
            ls -la /usr/local/bin/geode
          "

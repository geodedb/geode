# Geode Graph Database - GPU-Accelerated Deployment
# Extends base docker-compose.yml with GPU support
# Usage: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  # Geode Database - GPU-accelerated version
  geode-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        ZIG_VERSION: "0.16.0"
        TARGETARCH: amd64
        CUDA_VERSION: "12.3.0"
    image: geode:gpu
    container_name: geode-db-gpu
    restart: unless-stopped
    # Security hardening: GPU access is via deploy.resources.reservations.devices
    # below, not via Linux capabilities, so dropping all capabilities does not
    # affect GPU availability. Empirically verified the geode binary starts and
    # serves fully (thread pool, QUIC listener, HTTP liveness) with zero added
    # capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # NOTE (SAST: Container Traffic Not Bound To Host Interface): intentionally
    # NOT bound to 127.0.0.1. This is the production GPU database variant of the
    # `geode` service in docker-compose.yml, which publishes the identical
    # 3141/udp+9091/tcp pair unrestricted (see docker-compose.yml:190-192) so
    # external QUIC clients can reach the database. Restricting this one variant
    # to loopback would silently break remote client access while leaving the
    # base service's identical exposure untouched -- needs an infra-owner
    # decision (e.g. firewall/security-group perimeter instead of loopback bind).
    ports:
      - "3142:3141/udp"  # QUIC protocol (different port to avoid conflict)
      - "9092:9091/tcp"  # Metrics endpoint
    environment:
      # geode reads no LOG_LEVEL (the log level is --log-level, below), no
      # VAULT_* (no KMS provider reads Vault), no REDIS_URL (no Redis cache),
      # no FIPS_MODE (FIPS is the -Dfips=true build, i.e. the fips image) and
      # no GPU_ENABLED (there is no GPU switch; algorithms run on the CPU,
      # GAP-0878). The NVIDIA_* / CUDA_* variables are the container
      # runtime's. SONNY-6435.
      # geode reads no S3_* variable: backups are local files written by
      # `geode backup create` (SONNY-6290); copy them to object storage yourself
      # (scripts/init-minio.sh sets up the MinIO bucket). SONNY-6430.
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - geode-gpu-data:/data
      - geode-gpu-logs:/var/log/geode
      - ./certs:/certs
    command:
      - "serve"
      - "--data-dir"
      - "/data"
      - "--listen"
      - "0.0.0.0:3141"
      - "--cert"
      - "/certs/server.crt"
      - "--key"
      - "/certs/server.key"
      - "--log-level"
      - "info"
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "geode", "query", "RETURN 1 AS health", "--server", "127.0.0.1:3141"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - geode-network
    depends_on:
      vault:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Prometheus with GPU metrics
  nvidia-exporter:
    image: nvidia/dcgm-exporter:3.3.0-3.2.0-ubuntu22.04
    container_name: geode-nvidia-exporter
    restart: unless-stopped
    # Security hardening: GPU access is via deploy.resources.reservations.devices
    # below, not via Linux capabilities. Only DCGM *profiling* metrics require
    # --cap-add SYS_ADMIN (not requested here -- no DCGM_EXPORTER_COLLECTORS
    # profiling fields are configured); base utilization metrics run fine
    # without added capabilities (verified against this exact image tag).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Only scraped by Prometheus over the internal geode-network (container DNS,
    # not this published port), so binding to loopback only affects host-local
    # access and does not break in-network scraping.
    ports:
      - "127.0.0.1:9400:9400"
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    healthcheck:
      # Image is Ubuntu-based with bash but no curl/wget/nc; verified this
      # /dev/tcp connect check works against this exact image tag.
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/9400) 2>/dev/null'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - geode-network

networks:
  geode-network:
    driver: bridge

volumes:
  geode-gpu-data:
    driver: local
  geode-gpu-logs:
    driver: local

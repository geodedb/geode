# Docker Compose for Geode - three nodes (NOT a Raft cluster as shipped)
#
# SONNY-6435: this file used to configure a cluster with NODE_ID, NODE_ROLE,
# CLUSTER_NAME, RAFT_PORT, RAFT_PEERS, RAFT_JOIN, CLUSTER_NODES,
# GEODE_DISTRIBUTED, GEODE_SHARD_COUNT and GEODE_REPLICATION_FACTOR, and with
# `geode serve` options for a node id, a Raft bind / advertise / join address,
# a bootstrap size and JSON logs. geode reads none of those variables and has
# none of those options (`geode serve` then ignored an option it did not
# know; it refuses one since SONNY-6442), so the three nodes ran standalone.
# They have been removed; the nodes still run standalone. Geode forms a
# cluster from GEODE_CLUSTER_TOKEN, GEODE_PEERS (the same comma-separated
# host:port list on every node), GEODE_NODE_ID (a number, the node's 1-based
# position in GEODE_PEERS), GEODE_CLUSTER_NAME,
# GEODE_CLUSTER_PORT and the cluster TLS certificate
# (src/server/cluster_bootstrap.zig); this file has not been validated with
# them. The log level is --log-level.

services:
  # Geode Leader Node
  geode-leader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geode-leader
    hostname: geode-leader
    ports:
      - '7567:7567/udp' # QUIC
      - '9090:9090' # Metrics
      - '8300:8300' # Raft internal
    volumes:
      - geode-leader-data:/data
      - geode-certs:/certs
      - ./certs:/certs
    command: >
      --listen 0.0.0.0:7567
      --data-dir /data
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', '/usr/local/bin/health-check.sh']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      geode-cluster-net:
        ipv4_address: 172.29.0.10
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Geode Follower Node 1
  geode-follower-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geode-follower-1
    hostname: geode-follower-1
    ports:
      - '7569:7567/udp' # QUIC
      - '9091:9090' # Metrics
      - '8301:8300' # Raft internal
    volumes:
      - geode-follower-1-data:/data
      - geode-certs:/certs
      - ./certs:/certs
    command: >
      --listen 0.0.0.0:7567
      --data-dir /data
    restart: unless-stopped
    depends_on:
      - geode-leader
    healthcheck:
      test:
        ['CMD', '/usr/local/bin/health-check.sh']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s
    networks:
      geode-cluster-net:
        ipv4_address: 172.29.0.11
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Geode Follower Node 2
  geode-follower-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geode-follower-2
    hostname: geode-follower-2
    ports:
      - '7571:7567/udp' # QUIC
      - '9092:9090' # Metrics
      - '8302:8300' # Raft internal
    volumes:
      - geode-follower-2-data:/data
      - geode-certs:/certs
      - ./certs:/certs
    command: >
      --listen 0.0.0.0:7567
      --data-dir /data
    restart: unless-stopped
    depends_on:
      - geode-leader
    healthcheck:
      test:
        ['CMD', '/usr/local/bin/health-check.sh']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s
    networks:
      geode-cluster-net:
        ipv4_address: 172.29.0.12
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # QUIC-only: No HAProxy TCP load balancer. Use DNS round-robin or QUIC-aware LB.

  # Prometheus for cluster monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: geode-prometheus-cluster
    volumes:
      - ./monitoring/prometheus-cluster.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-cluster-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - '9093:9090'
    networks:
      geode-cluster-net:
        ipv4_address: 172.29.0.20
    restart: unless-stopped

  # Grafana for cluster visualization
  grafana:
    image: grafana/grafana:latest
    container_name: geode-grafana-cluster
    volumes:
      - grafana-cluster-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=redis-datasource,redis-app
    ports:
      - '3001:3000'
    networks:
      geode-cluster-net:
        ipv4_address: 172.29.0.21
    depends_on:
      - prometheus
    restart: unless-stopped

  # Optional: Cluster coordinator for advanced operations
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: geode-coordinator
    entrypoint: /bin/sh
    command: -c "sleep infinity"
    volumes:
      - geode-certs:/certs:ro
      - ./scripts:/scripts:ro
    networks:
      geode-cluster-net:
        ipv4_address: 172.29.0.30
    profiles:
      - tools

volumes:
  geode-leader-data:
    driver: local
  geode-follower-1-data:
    driver: local
  geode-follower-2-data:
    driver: local
  geode-certs:
    driver: local
  prometheus-cluster-data:
    driver: local
  grafana-cluster-data:
    driver: local

networks:
  geode-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

# Self-contained geode + OpenTelemetry collector stack.
#
# Usage:
#   zig build -Doptimize=ReleaseSafe          # produce zig-out/bin/geode on the host
#   docker compose -f docker-compose.otel.yml up --build -d
#   scripts/otel-compose-verify.sh            # generate telemetry + assert it lands
#   docker compose -f docker-compose.otel.yml down -v
#
# geode pushes OTLP/HTTP to the collector over the compose network (otel-collector:4318).
# The verify script execs into the geode container and runs queries against 127.0.0.1:3141,
# so no cross-container QUIC/UDP is required.
#
# GEODE_OTEL_PASSWORD MUST be set in the environment (no secret is committed). The verify
# script and `make otel-compose-up` auto-generate a random one; for a manual `docker compose
# up` export your own, e.g.  GEODE_OTEL_PASSWORD=$(openssl rand -hex 12) docker compose ... up
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: geode-otel-collector
    # Run as root so the file exporters can create *.jsonl under the root-owned
    # `otel-output` named volume (the contrib image's default UID 10001 cannot
    # write to a freshly-created named-volume mount). See scripts/otel-compose-verify.sh.
    user: "0:0"
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-output:/var/log/otel
    ports:
      - "4318:4318"     # OTLP/HTTP
      - "4317:4317"     # OTLP/gRPC
      - "13133:13133"   # health_check extension (real readiness; curled by the verify script)
    healthcheck:
      # The contrib image is distroless (no curl/sh), so this only smoke-tests that
      # the binary runs — it does NOT prove the OTLP receiver is bound. Real readiness
      # is the health_check extension on :13133 (see config + scripts/otel-compose-verify.sh).
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  geode:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: geode:otel-local
    container_name: geode-otel
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      # --- OTel push to the in-compose collector ---
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_TRACES_SAMPLER: "always_on"
      OTEL_METRIC_EXPORT_INTERVAL: "3000"
      OTEL_BSP_SCHEDULE_DELAY: "2000"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=geode,service.namespace=codepros,deployment.environment.name=docker-compose"
      # --- geode runtime ---
      # No secret committed: GEODE_OTEL_PASSWORD must be provided by the caller
      # (verify script / make target auto-generate one). Matches the ${VAR:?...}
      # convention used by the other docker-compose*.yml files.
      GEODE_ADMIN_PASSWORD: "${GEODE_OTEL_PASSWORD:?set GEODE_OTEL_PASSWORD (verify script/make auto-generate; or export your own)}"
      GEODE_USERNAME: "geode"
      GEODE_PASSWORD: "${GEODE_OTEL_PASSWORD:?set GEODE_OTEL_PASSWORD (verify script/make auto-generate; or export your own)}"
      # GEODE_METRICS_PORT starts the Prometheus /metrics server (main.zig:1258 —
      # the server is only created when this env is set). GEODE_METRICS_BIND is an
      # IP-only dotted-quad (metrics_server.zig:359 parses address only, no port).
      GEODE_METRICS_PORT: "9091"
      GEODE_METRICS_BIND: "0.0.0.0"
      LOG_LEVEL: "info"
    command: ["--data-dir", "/data", "--listen", "0.0.0.0:3141", "--log-level", "info"]
    ports:
      # Host QUIC published on 13141 (not 3141) so this stack coexists with a
      # host-resident geode (e.g. a systemd geode.service) that already owns
      # UDP 3141. The container still listens on 3141 internally; the verify
      # script queries geode from inside the container, so this mapping only
      # affects external host access.
      - "13141:3141/udp"  # QUIC (host 13141 -> container 3141)
      - "9091:9091/tcp"   # Prometheus /metrics
    volumes:
      - geode-data:/data
    ulimits:
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096

volumes:
  otel-output:
  geode-data:

# Development overrides for docker-compose.yml
# This file is automatically loaded by docker-compose

services:
  geode:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    # Debug logging is --log-level debug (below): geode reads no LOG_LEVEL,
    # and RUST_BACKTRACE means nothing to it (it is not written in Rust).
    # SONNY-6435.
    volumes:
      # Mount source code for development
      - ./src:/home/geode/src:ro
      - ./tests:/home/geode/tests:ro
      # Mount local data directory
      - ./data:/data
    ports:
      # Additional debug port
      - '9999:9999'
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_RESOURCE
    command:
      - "--data-dir"
      - "/data"
      - "--listen"
      - "0.0.0.0:3141"
      - "--cert"
      - "/certs/server.crt"
      - "--key"
      - "/certs/server.key"
      - "--log-level"
      - "debug"
    # QUIC-only transport with TLS certificates
